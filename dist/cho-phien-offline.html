<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="game-version" content="v8.8"><title>Chợ phiên · thử ngoại tuyến</title><style>
#cho-phien{position:fixed;inset:0;z-index:2147483000;overflow:auto;text-align:left;line-height:normal}
body:has(#cho-phien){overflow:hidden!important}
#cho-phien{color-scheme:dark;--ink:#efe6cf;--muted:#a8b4a7;--gold:#e3c27a;--line:#ffffff1f;--lac:#8c2f1d}
#cho-phien *{box-sizing:border-box}
#cho-phien{margin:0;background:#101b16;color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;overflow:auto;-webkit-tap-highlight-color:transparent}
#cho-phien button,#cho-phien input{font:inherit;letter-spacing:normal;text-transform:none;line-height:normal;margin:0;box-shadow:none;height:auto;width:auto;min-height:0}
#cho-phien h1,#cho-phien h2,#cho-phien h3,#cho-phien p,#cho-phien small,#cho-phien b,#cho-phien label{font-family:inherit;letter-spacing:normal;text-transform:none}
#cho-phien svg.icon{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#cho-phien button{cursor:pointer;color:var(--ink);background:#22362cf2;border:1px solid #b5ba9850;border-radius:10px;padding:9px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation}
#cho-phien button:hover{background:#2f4a3c}
#cho-phien button:disabled{opacity:.4;cursor:not-allowed}
#cho-phien button.primary{background:linear-gradient(#a4452c,#7c2c1b);border-color:#e3b86f;color:#fff3d6;font-weight:700;text-shadow:0 1px 0 #3a120a}
#cho-phien button.primary:hover{background:linear-gradient(#b8533a,#8a3320)}
#cho-phien button.busy{opacity:.6;pointer-events:none}
#cho-phien button.ghost{background:transparent}
#cho-phien input{padding:9px 10px;border:1px solid #79907177;background:#0d1a13;color:#fff;border-radius:9px;font-size:15px}
#cho-phien .ch-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:linear-gradient(#1a2c22f5,#132219f5);border-bottom:2px solid #8c6b3a;box-shadow:0 6px 18px #0006}
#cho-phien .brand{display:flex;align-items:center;gap:10px}
#cho-phien .brand .mark{width:38px;height:38px;color:var(--gold)}
#cho-phien .brand b{display:block;font:24px Georgia,serif;color:var(--gold);line-height:1}
#cho-phien .brand small{color:var(--muted);font-size:11px}
#cho-phien .user{display:flex;align-items:center;gap:8px}
#cho-phien .user b{color:#f3dfae;font-size:13px}
#cho-phien .user button{padding:6px 10px;font-size:12px}
#cho-phien .ch-body{max-width:960px;margin:0 auto;padding:14px 16px 90px;display:flex;flex-direction:column;gap:12px}
#cho-phien .ch-foot{max-width:960px;margin:0 auto;padding:0 16px 24px;display:flex;justify-content:center;align-items:center;gap:8px;color:var(--muted);font-size:11px}
#cho-phien .link{color:var(--gold);text-decoration:none;font-weight:600}
#cho-phien .hint{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}
#cho-phien .ch-login{max-width:380px;width:100%;margin:30px auto 0;display:flex;flex-direction:column;gap:10px;padding:20px;border:1px solid #ab956a66;border-radius:18px;background:#1a2b21}
#cho-phien .ch-login h2{margin:0;font:24px Georgia,serif;color:var(--gold)}
#cho-phien .ch-login label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#c9d2c3}
#cho-phien .big{padding:12px}
#cho-phien .msg{margin:0;min-height:18px;color:#ff9f8f;font-size:13px;text-align:center}
#cho-phien .who{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#16261d}
#cho-phien .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
#cho-phien .who-list{display:flex;gap:6px;flex-wrap:wrap}
#cho-phien .who-list button{flex-direction:column;align-items:flex-start;gap:0;padding:7px 12px}
#cho-phien .who-list button small{font-size:10px;color:var(--muted)}
#cho-phien .who-list button.on{background:#ecd29a;border-color:#f6e2b4;color:#2a1a0e}
#cho-phien .who-list button.on small{color:#5a4325}
#cho-phien .purse{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#cho-phien .bagc{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#c9d2c3}
#cho-phien .bagc svg{width:16px;height:16px}
#cho-phien .money{display:inline-flex;gap:8px;align-items:center}
#cho-phien .coin{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700}
#cho-phien .coin i{display:block;width:11px;height:11px;border:2px solid #ffffff33;border-radius:50%;background:#ac6c45}
#cho-phien .coin.silver i{background:#b1bdc7}
#cho-phien .coin.gold i{background:#d6b354}
#cho-phien .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#cho-phien .tabs button{flex-direction:column;gap:3px;padding:9px 4px;font-size:12px;position:relative}
#cho-phien .tabs button.on{background:#ecd29a;border-color:#f6e2b4;color:#2a1a0e;font-weight:700}
#cho-phien .tabs .dot{position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:#ff6f6f}
#cho-phien #chPane{display:flex;flex-direction:column;gap:10px}
#cho-phien .flt{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#cho-phien .flt button{padding:6px 12px;font-weight:700}
#cho-phien .flt button.on{background:#2f2a1c;border-color:currentColor}
#cho-phien .flt .ghost{margin-left:auto;font-weight:500;color:var(--muted)}
#cho-phien .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
#cho-phien .card{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px 10px;border-radius:14px;background:#14241c;border:1px solid color-mix(in srgb,var(--q) 55%,transparent);text-align:center}
#cho-phien .card[data-on]{box-shadow:0 0 0 2px var(--gold)}
#cho-phien .ci{position:relative;width:52px;height:52px;display:grid;place-items:center;border-radius:12px;background:radial-gradient(circle at 50% 40%,#2c4636,#0e1a13)}
#cho-phien .ci svg{width:32px;height:32px}
#cho-phien .lv{position:absolute;left:3px;top:2px;font-size:10px;color:#ffd77a}
#cho-phien .nm{font-size:13px;line-height:1.25}
#cho-phien .q{font-size:11px;font-weight:700}
#cho-phien .chips{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
#cho-phien .ch{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-style:normal;font-weight:600;color:#f0e2bd;background:#0b1a13;border-radius:6px;padding:1px 5px}
#cho-phien .ch svg{width:12px;height:12px}
#cho-phien .ch.add{color:#bfe3ff;background:#0d1f2a}
#cho-phien .ch.fx{color:#ffd0ec;background:#2a1424;font-weight:500}
#cho-phien .pr{margin-top:2px}
#cho-phien .seller{font-size:10.5px;color:var(--muted)}
#cho-phien .card button{width:100%;margin-top:4px}
#cho-phien .sellbar{position:sticky;bottom:10px;display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;padding:12px;border:1px solid #e3b86f88;border-radius:14px;background:#1d2c22f5;box-shadow:0 8px 24px #0008}
#cho-phien .sellbar>span{flex-basis:100%;font-size:13px}
#cho-phien .sellbar label,#cho-phien .price-in label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
#cho-phien .sellbar input,#cho-phien .price-in input{width:72px;padding:7px}
#cho-phien .price-in{display:flex;gap:6px}
#cho-phien .rows{display:flex;flex-direction:column;gap:6px}
#cho-phien .row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#14241c;flex-wrap:wrap}
#cho-phien .row>div{display:flex;flex-direction:column;gap:3px;min-width:0}
#cho-phien .row>div:nth-child(2){flex:1}
#cho-phien .row b{color:#f3dfae}
#cho-phien .row .end{flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap}
#cho-phien .g{font-size:11px;padding:3px 6px;border-radius:6px;background:#0b1a13;color:#c9d2c3}
#cho-phien .gear{display:flex;gap:3px}
#cho-phien .gear svg{width:16px;height:16px}
#cho-phien .stats{font-size:11px;color:var(--muted)}
#cho-phien .tag{font-size:11px;color:#ffd77a}
#cho-phien h3{margin:8px 0 0;font:17px Georgia,serif;color:var(--gold)}
#cho-phien .claim{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid #e3b86f66;border-radius:14px;background:#1c2a20}
#cho-phien .claim>svg{width:34px;height:34px;color:var(--gold)}
#cho-phien .claim>div{flex:1;display:flex;flex-direction:column;gap:4px}
#cho-phien .claim span{font-size:12px;color:var(--muted)}
#cho-phien .empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px;color:#7f937f;text-align:center}
#cho-phien .empty svg{width:30px;height:30px}
#cho-phien #chToast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;background:#16261df5;border:1px solid #9fe8a866;transition:.2s;max-width:92%;z-index:9}
#cho-phien #chToast.on{opacity:1;transform:translateX(-50%)}
#cho-phien #chToast.bad{border-color:#ff9f8f88}
#cho-phien #chToast svg{width:18px;height:18px}
#cho-phien [hidden]{display:none!important}
@media(max-width:560px){#cho-phien .tabs span{font-size:11px}
#cho-phien .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
#cho-phien .brand b{font-size:20px}
#cho-phien .row .end{width:100%;justify-content:space-between}
}
#cho-phien .coin.ruby i{border-radius:3px;transform:rotate(45deg);background:#e35979}
#cho-phien .mlook{display:flex;flex-direction:column;gap:4px;margin-top:3px}
#cho-phien .mlook .mlv{align-self:flex-start;padding:1px 7px;border-radius:7px;border:1px solid #9fe8a866;color:#9fe8a8;font-size:11.5px;font-weight:700}
#cho-phien .mgear{display:flex;flex-wrap:wrap;gap:4px 8px}
#cho-phien .mgear .gi{display:inline-flex;align-items:center;gap:3px;font-size:11px}
#cho-phien .mgear .gi svg{width:16px;height:16px}
#cho-phien .mgear .gi small{color:#d9d2bd}
#cho-phien img.icon.pic{object-fit:contain}
</style></head><body>

<script>
/* ================= LÕI MÁY CHỦ (dùng chung cho Apps Script và chế độ ngoại tuyến) =================
   adapter cần có: rows(bang) \u{b7} insert(bang,obj) \u{b7} update(bang,obj) \u{b7} mail(to,tieuDe,noiDung) \u{b7} hash(chuoi) \u{b7} now() \u{b7} uid() \u{b7} staticData() \u{b7} lock(fn) \u{b7} rules() (nạp luật chơi)
   Bảng: tai_khoan \u{b7} nhan_vat \u{b7} cho
   v8: máy chủ giữ tiền, hồng ngọc, đồ của từng nhân vật. Trình duyệt chỉ gửi: sắp xếp đồ, máu/mana, vị trí và các lệnh (hạ quái, mua, bán, gia cường, nhiệm vụ, thuê lính). */
function LH_Core(A){
  const TOKEN_DAYS=30,RESET_MIN=15;
  const fail=e=>{throw Error(e);};
  const lower=s=>String(s||'').trim().toLowerCase();
  const cfg=k=>{const r=(A.staticData().cau_hinh||[]).find(x=>x.khoa===k);return r?Number(r.gia_tri):null;};
  const pub=a=>({id:a.id,username:a.username,email:a.email});
  function auth(token){
    const a=A.rows('tai_khoan').find(x=>x.token&&x.token===token);
    // Mỗi tài khoản chỉ một thiết bị: đăng nhập nơi khác thì phiên cũ bị đẩy ra
    if(!a){if(token&&A.rows('tai_khoan').some(x=>x.token_cu&&x.token_cu===token))fail('DANG_NHAP_NOI_KHAC');fail('PHIEN_HET_HAN');}
    if(Number(a.token_het_han)<A.now())fail('PHIEN_HET_HAN');
    return a;
  }
  function ownChar(a,id,status){
    const c=A.rows('nhan_vat').find(x=>x.id===id);
    if(!c||c.tai_khoan!==a.id)fail('KHONG_THAY_NHAN_VAT');
    if(status&&c.trang_thai!==status)fail('SAI_TRANG_THAI');
    return c;
  }
  const charView=c=>({id:c.id,name:c.ten,gender:c.gioi_tinh,stats:{strength:+c.suc_manh,agility:+c.nhanh_nhen,vitality:+c.suc_khoe,intelligence:+c.tri_tue},status:c.trang_thai,level:+c.cap||1,price:+c.gia_danh_thue||0,ruby:+c.gia_hong_ngoc||0,created:+c.tao_luc});
  function newToken(a){a.token_cu=a.token&&Number(a.token_het_han)>A.now()?a.token:'';a.token=A.uid()+A.uid();a.token_het_han=A.now()+TOKEN_DAYS*864e5;A.update('tai_khoan',a);return a.token;}
  // Trạng thái nhân vật lưu trên máy chủ (cột luu): {v, player, pos, seen, srv}
  function stateOf(c){
    A.rules&&A.rules();
    let save=null;try{save=c.luu?JSON.parse(c.luu):null;}catch(e){}save=save||{};
    const ch=charView(c);
    return {save,player:save.player?Player.restore(save,ch,()=>true,null).player:Player.create(ch)};
  }
  function storeState(c,st,player,soft){
    soft=soft||{};
    const okPos=v=>v&&Number.isFinite(+v.x)&&Number.isFinite(+v.y)?{x:+v.x,y:+v.y}:null;
    const save={v:Player.VERSION,player,pos:soft.pos!==undefined?okPos(soft.pos):(st.save.pos||null),seen:Array.isArray(soft.seen)?soft.seen.slice(0,60).map(String):(st.save.seen||[]),srv:st.save.srv||{}};
    const j=JSON.stringify(save);if(j.length>45000)fail('DU_LIEU_QUA_LON');
    c.luu=j;c.cap=player.level;c.kinh_nghiem=player.exp;c.cap_nhat=A.now();A.update('nhan_vat',c);st.save=save;
  }
  // Dáng vẻ nhân vật (cho căn lều chọn nhân vật và chợ cho thuê): cấp, đồ đang mặc, hào quang sách, số lính, chỉ số
  function lookOf(c){
    try{const p=stateOf(c).player,D=Player.derive(p),ab=p.activeBook!=null?p.skillSlots[p.activeBook]:p.skillSlots.find(Boolean);
      return {level:p.level,equipment:p.equipment,el:ab&&Player.info(ab)?Player.info(ab).element:null,mercs:p.mercs.length,pets:(p.pets||[]).length,main:D.main,dmg:[D.tot.dmgMin,D.tot.dmgMax],hp:D.tot.hp,def:D.tot.def};}catch(e){return null;}
  }
  const claimSum=acc=>pendingClaims(acc).reduce((s,r)=>({copper:s.copper+Number(r.tien_nhan||0),ruby:s.ruby+Number(r.hong_ngoc_nhan||0)}),{copper:0,ruby:0});
  function pendingClaims(acc){return A.rows('cho').filter(r=>r.trang_thai==='da_ban'&&r.nguoi_ban===acc&&String(r.da_nhan)!=='1');}
  const H={
    ping:()=>({msg:'Lữ Hành API'}),
    // kiểm tra phiên còn giữ (game gọi định kỳ): bị đăng nhập nơi khác thì báo DANG_NHAP_NOI_KHAC
    alive(p){auth(p.token);return {};},
    data:()=>({data:A.staticData()}),
    register(p){
      const username=lower(p.username),email=lower(p.email),pw=String(p.password||'');
      if(!/^[a-z0-9_]{3,20}$/.test(username))fail('TEN_DANG_NHAP_SAI');
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))fail('EMAIL_SAI');
      if(pw.length<6)fail('MAT_KHAU_NGAN');
      return A.lock(()=>{
        const all=A.rows('tai_khoan');
        if(all.some(a=>a.username===username))fail('TEN_DANG_NHAP_DA_CO');
        if(all.some(a=>a.email===email))fail('EMAIL_DA_CO');
        const salt=A.uid(),a={id:'tk-'+A.uid(),username,email,muoi:salt,mat_khau:A.hash(salt+pw),tao_luc:A.now(),token:'',token_het_han:0,ma_khoi_phuc:'',ma_het_han:0};
        A.insert('tai_khoan',a);
        return {token:newToken(a),account:pub(a)};
      });
    },
    login(p){
      const key=lower(p.username),pw=String(p.password||'');
      const a=A.rows('tai_khoan').find(x=>x.username===key||x.email===key);
      if(!a||A.hash(a.muoi+pw)!==a.mat_khau)fail('SAI_DANG_NHAP');
      return {token:newToken(a),account:pub(a)};
    },
    logout(p){const a=auth(p.token);a.token='';a.token_cu='';a.token_het_han=0;A.update('tai_khoan',a);return {};},
    forgot(p){
      const email=lower(p.email),a=A.rows('tai_khoan').find(x=>x.email===email);
      if(!a)fail('KHONG_THAY_EMAIL');
      const code=String(100000+Math.floor(Math.random()*900000));
      a.ma_khoi_phuc=code;a.ma_het_han=A.now()+RESET_MIN*6e4;A.update('tai_khoan',a);
      A.mail(a.email,'Lữ Hành \u{b7} Khôi phục tài khoản',`Tên đăng nhập của bạn: ${a.username}\nMã khôi phục: ${code}\nMã có hiệu lực ${RESET_MIN} phút.`);
      return {sent:true,devCode:A.devMail?code:undefined,username:A.devMail?a.username:undefined};
    },
    reset(p){
      const email=lower(p.email),a=A.rows('tai_khoan').find(x=>x.email===email);
      if(!a||!a.ma_khoi_phuc||String(a.ma_khoi_phuc)!==String(p.code).trim()||Number(a.ma_het_han)<A.now())fail('MA_SAI');
      if(String(p.password||'').length<6)fail('MAT_KHAU_NGAN');
      a.muoi=A.uid();a.mat_khau=A.hash(a.muoi+p.password);a.ma_khoi_phuc='';a.ma_het_han=0;
      return {token:newToken(a),account:pub(a)};
    },
    chars(p){
      const a=auth(p.token),list=A.rows('nhan_vat').filter(c=>c.tai_khoan===a.id&&(c.trang_thai==='active'||c.trang_thai==='merc')).map(c=>({...charView(c),look:lookOf(c)}));
      const cs=claimSum(a.id);
      return {account:pub(a),chars:list,max:cfg('so_nhan_vat_toi_da')||5,claim:cs.copper,claimRuby:cs.ruby};
    },
    createChar(p){
      const a=auth(p.token),name=String(p.name||'').trim().replace(/\s+/g,' '),gender=p.gender==='f'?'f':'m',st=p.stats||{};
      if(name.length<2||name.length>16||!/^[\p{L}\p{N} ]+$/u.test(name))fail('TEN_NHAN_VAT_SAI');
      const keys=['strength','agility','vitality','intelligence'],vals=keys.map(k=>Number(st[k]));
      if(vals.some(v=>!Number.isInteger(v)||v<0))fail('DIEM_SAI');
      if(vals.reduce((s,v)=>s+v,0)!==(cfg('diem_khoi_tao')||50))fail('DIEM_SAI');
      return A.lock(()=>{
        const all=A.rows('nhan_vat'),max=cfg('so_nhan_vat_toi_da')||5;
        if(all.filter(c=>c.tai_khoan===a.id&&(c.trang_thai==='active'||c.trang_thai==='merc')).length>=max)fail('DU_NHAN_VAT');
        if(all.some(c=>c.ten_khoa===lower(name)&&c.trang_thai!=='deleted'))fail('TEN_DA_CO');
        const c={id:'nv-'+A.uid(),tai_khoan:a.id,ten:name,ten_khoa:lower(name),gioi_tinh:gender,suc_manh:vals[0],nhanh_nhen:vals[1],suc_khoe:vals[2],tri_tue:vals[3],trang_thai:'active',gia_danh_thue:0,nguoi_mua:'',luu:'',tao_luc:A.now(),cap_nhat:A.now()};
        A.insert('nhan_vat',c);return {char:charView(c)};
      });
    },
    load(p){
      const a=auth(p.token);
      return A.lock(()=>{const c=ownChar(a,p.charId,'active'),st=stateOf(c);if(!c.luu)storeState(c,st,st.player);return {char:charView(c),save:{player:st.player,pos:st.save.pos||null,seen:st.save.seen||[]}};});
    },
    // Đồng bộ: nhận cách sắp xếp đồ + lệnh, máy chủ tự tính kết quả (rơi đồ, tiền, gia cường\u{2026}) rồi trả lại trạng thái chuẩn
    play(p){
      const a=auth(p.token);
      return A.lock(()=>{
        const c=ownChar(a,p.charId,'active'),st=stateOf(c),C=p.save&&p.save.player;
        const R=C?Player.merge(st.player,C):st.player,srv=st.save.srv=st.save.srv||{},now=A.now();
        const results=(Array.isArray(p.ops)?p.ops.slice(0,60):[]).map(op=>{try{return {ok:true,...Player.applyOp(R,op,srv,now)};}catch(e){return {ok:false,error:String(e.message||e)};}});
        storeState(c,st,R,{pos:p.save&&p.save.pos,seen:p.save&&p.save.seen});
        return {state:R,results,savedAt:c.cap_nhat};
      });
    },
    save(p){return H.play({...p,ops:[]});},
    mercRegister(p){
      const a=auth(p.token),c=ownChar(a,p.charId,'active'),price=Math.max(0,Math.floor(Number(p.price)||0)),ruby=Math.max(0,Math.floor(Number(p.ruby)||0));
      if(!(price>=100)&&!(ruby>=1))fail('GIA_SAI');
      c.trang_thai='merc';c.gia_danh_thue=price;c.gia_hong_ngoc=ruby;c.cap_nhat=A.now();A.update('nhan_vat',c);return {char:charView(c)};
    },
    mercCancel(p){const a=auth(p.token),c=ownChar(a,p.charId,'merc');c.trang_thai='active';c.gia_danh_thue=0;c.gia_hong_ngoc=0;A.update('nhan_vat',c);return {char:charView(c)};},
    mercList(p){
      const a=auth(p.token);
      return {list:A.rows('nhan_vat').filter(c=>c.trang_thai==='merc'&&c.tai_khoan!==a.id).map(c=>{let eq={};try{eq=(JSON.parse(c.luu||'{}').player||{}).equipment||{};}catch(e){}return {...charView(c),equipment:eq,look:lookOf(c)};})};
    },
    mercBuy(p){
      const a=auth(p.token);
      return A.lock(()=>{
        const b=ownChar(a,p.charId,'active'),t=A.rows('nhan_vat').find(c=>c.id===p.targetId);
        if(!t||t.trang_thai!=='merc'||t.tai_khoan===a.id)fail('LINH_KHONG_CON');
        let eq={};try{eq=(JSON.parse(t.luu||'{}').player||{}).equipment||{};}catch(e){}
        const price=Number(t.gia_danh_thue)||0,ruby=Number(t.gia_hong_ngoc)||0,fee=(cfg('phi_cho')||0)/100,st=stateOf(b);
        if(st.player.copper<price)fail('KHONG_DU_TIEN');if(st.player.rubies<ruby)fail('KHONG_DU_HONG_NGOC');if(st.player.mercs.length>=Player.MAX_MERC)fail('DU_LINH');
        Player.addMerc(st.player,{name:t.ten,gender:t.gioi_tinh,stats:charView(t).stats,equipment:eq,src:'player',from:t.id,cmd:10});
        st.player.copper-=price;st.player.rubies-=ruby;storeState(b,st,st.player);
        t.trang_thai='sold';t.nguoi_mua=p.charId;t.cap_nhat=A.now();A.update('nhan_vat',t);
        A.insert('cho',{id:'ch-'+A.uid(),loai:'linh',nguoi_ban:t.tai_khoan,nhan_vat_ban:t.id,vat_pham:'',gia:price,tien_nhan:Math.floor(price*(1-fee)),hong_ngoc:ruby,hong_ngoc_nhan:Math.floor(ruby*(1-fee)),trang_thai:'da_ban',nguoi_mua:p.charId,tao_luc:A.now(),ban_luc:A.now(),da_nhan:0});
        return {name:t.ten,price,ruby,state:st.player};
      });
    },
    marketList(p){
      const a=auth(p.token),rows=A.rows('cho').filter(r=>r.loai==='do');
      const view=r=>({id:r.id,item:JSON.parse(r.vat_pham||'null'),price:Number(r.gia),mine:r.nguoi_ban===a.id,seller:r.ten_nguoi_ban||''});
      return {open:rows.filter(r=>r.trang_thai==='mo').map(view),claim:claimSum(a.id).copper,claimRuby:claimSum(a.id).ruby};
    },
    // Ký gửi: lấy món đồ ra khỏi túi nhân vật trên máy chủ
    marketSell(p){
      const a=auth(p.token),price=Math.floor(Number(p.price));
      if(!(price>=1))fail('GIA_SAI');
      return A.lock(()=>{
        const c=ownChar(a,p.charId,'active'),st=stateOf(c),i=Math.floor(Number(p.i)),it=st.player.bag[i];
        if(!it||!Player.tradeable(it))fail('VAT_PHAM_SAI');
        st.player.bag[i]=null;storeState(c,st,st.player);
        const fee=(cfg('phi_cho')||0)/100,r={id:'ch-'+A.uid(),loai:'do',nguoi_ban:a.id,nhan_vat_ban:c.id,ten_nguoi_ban:c.ten,vat_pham:JSON.stringify(it),gia:price,tien_nhan:Math.floor(price*(1-fee)),trang_thai:'mo',nguoi_mua:'',tao_luc:A.now(),ban_luc:0,da_nhan:0};
        A.insert('cho',r);return {id:r.id,state:st.player};
      });
    },
    // Hủy ký gửi: trả món đồ về túi nhân vật đã ký gửi
    marketCancel(p){
      const a=auth(p.token);
      return A.lock(()=>{
        const r=A.rows('cho').find(x=>x.id===p.id);if(!r||r.nguoi_ban!==a.id||r.trang_thai!=='mo')fail('KHONG_HUY_DUOC');
        const c=ownChar(a,r.nhan_vat_ban,'active'),st=stateOf(c),it=Player.cleanItem(JSON.parse(r.vat_pham));
        if(it)Player.addItem(st.player,it);storeState(c,st,st.player);
        r.trang_thai='huy';A.update('cho',r);return {charId:c.id,state:st.player};
      });
    },
    marketBuy(p){
      const a=auth(p.token);
      return A.lock(()=>{
        const c=ownChar(a,p.charId,'active'),r=A.rows('cho').find(x=>x.id===p.id);
        if(!r||r.trang_thai!=='mo')fail('DA_BAN');if(r.nguoi_ban===a.id)fail('DO_CUA_MINH');
        const st=stateOf(c),price=Number(r.gia),it=Player.cleanItem(JSON.parse(r.vat_pham));
        if(st.player.copper<price)fail('KHONG_DU_TIEN');if(!it)fail('VAT_PHAM_SAI');
        Player.addItem(st.player,it);st.player.copper-=price;storeState(c,st,st.player);
        r.trang_thai='da_ban';r.nguoi_mua=p.charId;r.ban_luc=A.now();A.update('cho',r);
        return {item:it,price,state:st.player};
      });
    },
    // Nhận tiền bán hàng vào một nhân vật
    claim(p){
      const a=auth(p.token);
      return A.lock(()=>{
        const c=ownChar(a,p.charId,'active'),st=stateOf(c);let sum=0,rsum=0;
        for(const r of pendingClaims(a.id)){sum+=Number(r.tien_nhan||0);rsum+=Number(r.hong_ngoc_nhan||0);r.da_nhan=1;A.update('cho',r);}
        st.player.copper+=sum;st.player.rubies+=rsum;storeState(c,st,st.player);return {amount:sum,ruby:rsum,state:st.player};
      });
    }
  };
  return {handle(action,p){try{if(!H[action])fail('KHONG_CO_LENH');return {ok:true,...H[action](p||{})};}catch(e){return {ok:false,error:String(e.message||e)};}}};
}
</script>
<script>
/* ================= KẾT NỐI MÁY CHỦ =================
   Dán URL Web App của Apps Script vào LH_API. Để trống = chế độ ngoại tuyến (lưu trên trình duyệt này, dùng để thử). */
const LH_API=(typeof window!=='undefined'&&window.LH_API)||'';
function sha256(s){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=Array.from(new TextEncoder().encode(s)),l=b.length*8;b.push(0x80);while(b.length%64!==56)b.push(0);for(let i=7;i>=0;i--)b.push(Math.floor(l/2**(i*8))&255);
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const r=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
    for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
    let [a,bb,c,d,e,f,g,hh]=h;for(let i=0;i<64;i++){const t1=(hh+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&c)^(bb&c)))|0;hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;}
    h=h.map((v,i)=>(v+[a,bb,c,d,e,f,g,hh][i])|0);}
  return h.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
}
// Máy chủ giả trên trình duyệt: dùng chung LH_Core với Apps Script
const LocalServer=(()=>{
  const KEY='lh-offline-db';let db;
  const load=()=>{if(db)return db;try{db=JSON.parse(localStorage.getItem(KEY))||null;}catch(e){}return db=db||{tai_khoan:[],nhan_vat:[],cho:[]};};
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}};
  const core=LH_Core({
    rows:t=>load()[t],insert:(t,o)=>{load()[t].push(o);persist();},update:(t,o)=>{const a=load()[t],i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;persist();},
    mail:()=>{},devMail:true,hash:sha256,now:()=>Date.now(),uid:()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4),
    staticData:()=>GAME_DATA,lock:fn=>fn()
  });
  // đọc lại mỗi lệnh: game và Chợ phiên mở ở 2 thẻ vẫn dùng chung dữ liệu
  return {handle:(action,p)=>{db=null;return JSON.parse(JSON.stringify(core.handle(action,p)));}};
})();
const Net={
  online:!!LH_API,token:(()=>{try{return localStorage.getItem('lh-token')||'';}catch(e){return '';}})(),
  setToken(t){this.token=t||'';try{t?localStorage.setItem('lh-token',t):localStorage.removeItem('lh-token');}catch(e){}},
  async call(action,payload={}){
    const body={...payload,action,token:this.token};let r;
    if(!LH_API)r=LocalServer.handle(action,body);
    else{
      const json=JSON.stringify(body),small=json.length<1800;
      const parse=txt=>{try{return JSON.parse(txt);}catch(e){throw Error(/<html/i.test(txt)?'MAY_CHU_LOI':'Failed to fetch');}};
      // POST giống hệt bản 8.4 (không thêm tùy chọn nào: Safari thêm header là bị chặn CORS)
      const viaPost=async()=>parse(await (await fetch(LH_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:json})).text());
      // Đường dự phòng: lệnh nhỏ gửi bằng GET (?p=\u{2026}) khi trình duyệt không POST được
      const viaGet=async()=>{const x=parse(await (await fetch(LH_API+(LH_API.includes('?')?'&':'?')+'p='+encodeURIComponent(json))).text());if(x&&x.msg!==undefined&&action!=='ping')throw Error('POST_LOI');return x;};
      if(small&&Net.useGet){try{r=await viaGet();}catch(e){}}
      // mạng chập chờn (điện thoại chuyển 4G/Wi-Fi): lệnh chỉ đọc thì thử lại tối đa 2 lần
      for(let k=0;!r;k++){
        try{r=await viaPost();}
        catch(e){
          if(small&&(NET_SAFE.has(action)||action==='register'||action==='reset')&&netErr(e).message==='Failed to fetch'){try{r=await viaGet();Net.useGet=true;break;}catch(g){if(g.message==='POST_LOI')throw g;}}
          if(k>=2||e.message==='MAY_CHU_LOI'||!NET_SAFE.has(action))throw await netDiag(netErr(e));await new Promise(ok=>setTimeout(ok,900*(k+1)));
        }
      }
    }
    // cùng trình duyệt (game và Chợ phiên ở 2 thẻ) đã đăng nhập lại: dùng phiên mới rồi thử lại một lần
    if(!r.ok&&r.error==='DANG_NHAP_NOI_KHAC'&&!payload._retry){let st='';try{st=localStorage.getItem('lh-token')||'';}catch(e){}if(st&&st!==this.token){this.token=st;return this.call(action,{...payload,_retry:1});}}
    // phiên bị thay (đăng nhập ở thiết bị khác): báo cho game / Chợ phiên dừng lại
    if(!r.ok&&(r.error==='DANG_NHAP_NOI_KHAC'||(r.error==='PHIEN_HET_HAN'&&this.token))&&typeof window!=='undefined')window.dispatchEvent(new CustomEvent('lh-kicked',{detail:r.error}));
    if(!r.ok){const e=Error(r.error||'LOI');throw e;}
    return r;
  }
};

<script>
/* ================= ẢNH TĨNH (Sheet "LH \u{b7} Hình ảnh", tab hinh_anh) =================
   Mỗi dòng: nhom + ma + link_anh. Dán link ảnh Google Drive (chia sẻ "Bất kỳ ai có đường liên kết") hoặc link ảnh bất kỳ.
   Ô link để trống, hoặc ảnh không tải được: dùng biểu tượng / hình vẽ mặc định của game.
   nhom: bieu_tuong (biểu tượng giao diện) \u{b7} vat_pham (đồ dùng) \u{b7} quai (quái vật) \u{b7} npc (dân làng) \u{b7} giao_dien (logo, nền, chân dung, túi đồ rơi) */
const LH_IMG=(()=>{
  const KEY='lh-img',MAP={},PIC={},ORIG={};
  // Link Drive (file/d/ID/view, open?id=ID, uc?id=ID\u{2026}) \u{2192} link ảnh xem trực tiếp
  function direct(u){
    u=String(u||'').trim();if(!u)return '';
    const m=/(?:drive|docs)\.google\.com/.test(u)&&(u.match(/\/d\/([\w-]{20,})/)||u.match(/[?&]id=([\w-]{20,})/));
    if(m)return 'https://lh3.googleusercontent.com/d/'+m[1];
    return /^https?:\/\/\S+$/.test(u)||/^data:image\//.test(u)?u:'';
  }
  const url=key=>MAP[key]||'';
  const attr=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  // Biểu tượng HTML: ảnh nếu có, lỗi thì quay về biểu tượng mặc định
  function icon(key,fb,color){
    const s=`<svg class="icon" aria-hidden="true"${color?` style="color:${color}"`:''}><use href="#i-${fb}"/></svg>`,u=url(key);
    // ảnh nằm trong khung <svg class="icon"> để giữ đúng cỡ biểu tượng ở mọi chỗ
    return u?`<svg class="icon pic" viewBox="0 0 32 32" aria-hidden="true"${color?` style="color:${color}"`:''}><image href="${attr(u)}" width="32" height="32" preserveAspectRatio="xMidYMid meet" onerror="const e=document.createElementNS('http://www.w3.org/2000/svg','use');e.setAttribute('href','#i-${fb}');this.replaceWith(e)"/></svg>`:s;
  }
  // Ảnh cho canvas (quái, NPC, túi đồ): chỉ trả về khi đã tải xong
  function pic(key){const p=PIC[key];return p&&p.complete&&p.naturalWidth>0?p:null;}
  // Biểu tượng giao diện: thay nội dung <symbol id="i-\u{2026}"> bằng ảnh, mọi chỗ dùng biểu tượng đó tự đổi theo
  function applyIcons(){
    if(typeof document==='undefined')return;
    for(const [id,html] of Object.entries(ORIG)){const s=document.getElementById('i-'+id);if(s&&!MAP['bieu_tuong:'+id]){s.innerHTML=html;delete ORIG[id];}}
    for(const [k,u] of Object.entries(MAP)){
      if(!k.startsWith('bieu_tuong:'))continue;const id=k.slice(11),s=document.getElementById('i-'+id);if(!s)continue;
      if(!(id in ORIG))ORIG[id]=s.innerHTML;
      const vb=(s.getAttribute('viewBox')||'0 0 32 32').split(/\s+/).map(Number);
      // thử tải trước: lỗi thì giữ biểu tượng cũ
      const im=new Image();im.referrerPolicy='no-referrer';im.onload=()=>{s.innerHTML=`<image href="${attr(u)}" x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" preserveAspectRatio="xMidYMid meet"/>`;};im.src=u;
    }
  }
  function load(map){
    for(const k of Object.keys(MAP))delete MAP[k];Object.assign(MAP,map);
    for(const [k,u] of Object.entries(MAP)){if(/^(bieu_tuong|vat_pham):/.test(k)||(PIC[k]&&PIC[k].src===u))continue;const im=new Image();im.referrerPolicy='no-referrer';im.src=u;PIC[k]=im;}
    applyIcons();
  }
  // rows: [{nhom, ma, link_anh}] từ máy chủ
  function set(rows){
    const map={};for(const r of rows||[]){const u=direct(r.link_anh),k=String(r.nhom||'').trim()+':'+String(r.ma||'').trim();if(u&&k.length>2)map[k]=u;}
    try{localStorage.setItem(KEY,JSON.stringify(map));}catch(e){}
    load(map);
  }
  try{const c=JSON.parse(localStorage.getItem(KEY)||'{}');if(c&&typeof c==='object')load(c);}catch(e){}
  return {set,url,icon,pic,direct,get map(){return {...MAP};}};
})();
</script>

  function mercEquip(s,i,bagIndex,slot){const m=s.mercs[i];if(!m)throw Error('MERC');const P=mercProxy(s,m);equip(P,bagIndex,slot);s.bag=P.bag;}
  function mercUnequip(s,i,slot){const m=s.mercs[i];if(!m)throw Error('MERC');const P=mercProxy(s,m);unequip(P,slot);s.bag=P.bag;}
  function dismissMerc(s,i){const m=s.mercs[i];if(!m)throw Error('MERC');const list=slots.map(k=>m.equipment[k]).filter(Boolean);if(s.bag.filter(x=>!x).length<list.length)throw Error('BAG_FULL');for(const it of list)addItem(s,it);s.mercs.splice(i,1);}
  // Lưu / khôi phục
  function cleanItem(i){
    if(!i||typeof i.uid!=='string')return null;const type=ALIAS[i.type]||i.type;const d=items[type];if(!d)return null;
    const it={uid:i.uid.slice(0,80),type};const lv=Math.floor(num(i.lv));if(lv>0&&canEnhance(it))it.lv=Math.min(MAX_LV,lv);
    if(!d.q&&RAR[i.q]&&i.q!=='n')it.q=i.q;
    if(i.add&&typeof i.add==='object'){const a={};for(const [k,v] of Object.entries(i.add))if(ADD[k]&&Number.isFinite(+v))a[k]=Math.max(0,Math.min(999,+v));if(Object.keys(a).length)it.add=a;}
    return it;
  }
  function serialize(s,pos,seen){return {v:VERSION,player:s,pos:{x:pos.x,y:pos.y},seen:[...seen]};}
  function restorePlayer(p,ch){
    const s=create(ch),n=(v,a,b,f)=>typeof v==='number'&&Number.isFinite(v)?Math.max(a,Math.min(b,v)):f,used=new Set();
    const valid=i=>{const it=cleanItem(i);if(!it||used.has(it.uid))return null;used.add(it.uid);return it;};
    s.level=Math.floor(n(p.level,1,maxLevel(),1));s.exp=Math.floor(n(p.exp,0,expNeed(s.level),0));s.points=Math.floor(n(p.points,0,99999,0));s.passive=n(p.passive,0,100,0);
    for(const k of [...STAT_KEYS,'command'])s.alloc[k]=Math.floor(n(p.alloc&&p.alloc[k],0,99999,0));
    if(Number.isFinite(+p.rs))s.rs=(+p.rs)|0;
    s.copper=Math.floor(n(p.copper,0,Number.MAX_SAFE_INTEGER,0));s.rubies=Math.floor(n(p.rubies,0,Number.MAX_SAFE_INTEGER,0));
    s.stats.command=Math.floor(n(p.stats&&p.stats.command,0,999,s.stats.command));
    if(p.flags){s.flags.river=!!p.flags.river;s.flags.hunted=!!p.flags.hunted;if(p.flags.wells&&typeof p.flags.wells==='object')for(const [k,v] of Object.entries(p.flags.wells))if(/^gieng-\d+$/.test(k)&&Number.isFinite(+v))s.flags.wells[k]=+v;for(const [k,v] of Object.entries(p.flags.kills||{}))if(MON[k])s.flags.kills[k]=Math.floor(n(v,0,1e9,0));}
    const extra=[],eq=Object.fromEntries(slots.map(k=>[k,null]));
    for(const k of slots){const it=valid(p.equipment&&p.equipment[k]);if(!it)continue;const d=items[it.type];const ok=(d.slot==='hand'?(k==='left'||k==='right'):d.slot===k)&&(!d.gender||d.gender===s.gender);if(ok)eq[k]=it;else extra.push(it);}
    if(isTwo(eq.left)){extra.push(eq.left);eq.left=null;}
    if(isTwo(eq.right)&&eq.left){extra.push(eq.left);eq.left=null;}
    if(eq.left&&eq.right&&!pairOk(kind(eq.left),kind(eq.right))){extra.push(eq.left);eq.left=null;}
    s.equipment=eq;
    const srcBag=Array.isArray(p.bag)?p.bag:[];s.bag=Array.from({length:BAG_SIZE},(_,i)=>valid(srcBag[i]));
    const srcSk=Array.isArray(p.skillSlots)?p.skillSlots:[];
    s.skillSlots=Array.from({length:SKILL_SLOTS},(_,i)=>{const it=valid(srcSk[i]);if(it&&items[it.type].slot!=='book'){extra.push(it);return null;}return it;});
    s.activeBook=Number.isInteger(p.activeBook)&&s.skillSlots[p.activeBook]?p.activeBook:null;
    for(const it of extra){const i=s.bag.indexOf(null);if(i>=0)s.bag[i]=it;}
    for(const k of Object.keys(skills))s.cooldowns[k]=n(p.cooldowns&&p.cooldowns[k],0,Date.now()+skills[k].cooldown,0);
    if(p.quests){for(const [k,v] of Object.entries(p.quests.active||{}))if(QUESTS[k])s.quests.active[k]=Math.floor(n(v,0,999,0));for(const [k,v] of Object.entries(p.quests.done||{}))if(QUESTS[k])s.quests.done[k]=Math.floor(n(v,0,1e6,0));}
    if(Array.isArray(p.mercs))s.mercs=p.mercs.slice(0,MAX_MERC).map(m=>{const x=makeMerc(m);x.mid=typeof m.mid==='string'?m.mid.slice(0,30):x.mid;x.hpFrac=n(m.hpFrac,0,1,1);x.on=!!m.on;return x;});
    if(Number.isInteger(p.activeMerc)&&s.mercs[p.activeMerc])s.mercs[p.activeMerc].on=true; // bản cũ: 1 lính
    if(Array.isArray(p.pets))s.pets=p.pets.filter(x=>x&&MON[x.type]&&!MON[x.type].boss&&typeof x.pid==='string').slice(0,petMax()).map(x=>({pid:x.pid.slice(0,30),type:x.type,hpFrac:n(x.hpFrac,0,1,1)}));
    const D=derive(s);
    // lính vượt quá Mệnh lệnh đang có thì cho nghỉ (theo thứ tự trong danh sách)
    {let left=D.main.cmd-mountCmd(s.equipment);for(const m of s.mercs)if(m.on){if(num(m.cmd,5)<=left)left-=num(m.cmd,5);else m.on=false;}}
    s.hp=n(p.hp,1,D.tot.hp,D.tot.hp);s.mana=n(p.mana,0,D.tot.mp,D.tot.mp);
    return s;
  }
  function restore(save,ch,canStand,npcIds){
    if(!save||!save.player)return {player:create(ch),pos:null,seen:[]};
    const s=restorePlayer(save.player,ch),pos=save.pos;
    return {player:s,pos:pos&&canStand&&canStand(pos.x,pos.y)?{x:pos.x,y:pos.y}:null,seen:Array.isArray(save.seen)?save.seen.filter(v=>(npcIds||[]).includes(v)):[]};
  }
  /* ---------- v8: máy chủ quyết định tiền, đồ, gia cường ----------
     merge(S,C): S = trạng thái máy chủ (đồ nào tồn tại, tiền, hồng ngọc, nhiệm vụ),
                 C = trạng thái máy người chơi (chỉ được sắp xếp đồ đang có + máu, mana, giếng\u{2026}).
     Người chơi không thể tự sinh đồ hay tiền: món nào không có trên máy chủ thì bị bỏ, món mới trên máy chủ tự vào túi. */
  const allItems=s=>[...(s.bag||[]),...Object.values(s.equipment||{}),...(s.skillSlots||[]),...(s.mercs||[]).flatMap(m=>Object.values(m.equipment||{}))].filter(it=>it&&typeof it.uid==='string');
  function merge(S,C){
    const chOf={name:S.name,gender:S.gender,stats:S.stats};
    const soft={hp:C&&C.hp,mana:C&&C.mana,passive:C&&C.passive,cooldowns:C&&C.cooldowns,flags:{...S.flags,river:!!(S.flags&&S.flags.river)||!!(C&&C.flags&&C.flags.river),wells:(C&&C.flags&&C.flags.wells)||(S.flags&&S.flags.wells)||{}}};
    const softOnly=()=>restorePlayer({...S,...soft},chOf);
    if(!C||typeof C!=='object')return restorePlayer(S,chOf);
    const pool=new Map(allItems(S).map(it=>[it.uid,it]));
    const take=x=>{if(!x||typeof x.uid!=='string')return null;const it=pool.get(x.uid);if(!it)return null;pool.delete(x.uid);return it;};
    const cm=new Map((Array.isArray(C.mercs)?C.mercs:[]).filter(m=>m&&typeof m.mid==='string').map(m=>[m.mid,m]));
    const mercs=(S.mercs||[]).map(m=>({...m,equipment:Object.fromEntries(slots.map(k=>[k,null]))}));
    mercs.forEach((m,i)=>{if(!cm.has(m.mid))for(const k of slots)m.equipment[k]=take((S.mercs[i].equipment||{})[k]);});
    mercs.forEach(m=>{const c=cm.get(m.mid);if(!c)return;for(const k of slots)m.equipment[k]=take(c.equipment&&c.equipment[k]);if(Number.isFinite(+c.hpFrac))m.hpFrac=Math.max(0,Math.min(1,+c.hpFrac));m.on=!!c.on;});
    const cp=new Map((Array.isArray(C.pets)?C.pets:[]).filter(x=>x&&typeof x.pid==='string').map(x=>[x.pid,x])),pets=(S.pets||[]).map(x=>{const c=cp.get(x.pid);return c&&Number.isFinite(+c.hpFrac)?{...x,hpFrac:Math.max(0,Math.min(1,+c.hpFrac))}:x;});
    const equipment=Object.fromEntries(slots.map(k=>[k,take(C.equipment&&C.equipment[k])]));
    const skillSlots=Array.from({length:SKILL_SLOTS},(_,i)=>take(Array.isArray(C.skillSlots)?C.skillSlots[i]:null));
    const bag=Array.from({length:BAG_SIZE},(_,i)=>take(Array.isArray(C.bag)?C.bag[i]:null));
    for(const it of pool.values()){const i=bag.indexOf(null);if(i<0)return softOnly();bag[i]=it;}
    const R=restorePlayer({...S,...soft,activeBook:C.activeBook,equipment,skillSlots,bag,mercs,pets},chOf);
    return allItems(R).length===allItems(S).length?R:softOnly();
  }
  // Các lệnh làm thay đổi tiền/đồ, chạy trên máy chủ (và trên trình duyệt ở chế độ ngoại tuyến)
  const KILL_LIMIT=id=>MON[id].boss?1:3;
  const PREDICT=new Set(['kill','buy','sell','enh','enhSk','qa','qt','hire','dismiss','pt','petOff']);
  function applyOp(s,op,srv,now=Date.now(),rng=Math.random){
    const t=op&&op.t;if(PREDICT.has(t))rng=seqRng(s);
    if(t==='kill'){
      const M=MON[op.mon];if(!M)throw Error('MON');
      srv.kills=srv.kills||{};const win=Math.max(5,M.respawn)*1000,log=(srv.kills[op.mon]||[]).filter(x=>now-x<win);
      if(log.length>=KILL_LIMIT(op.mon))throw Error('NHANH_QUA');log.push(now);srv.kills[op.mon]=log;
      s.copper+=M.copper;s.flags.kills[op.mon]=(s.flags.kills[op.mon]||0)+1;
      const drop=rollDrop(op.mon,rng),items=[],lost=[];s.rubies+=drop.rubies;
      for(const it of drop.items){try{addItem(s,it);items.push(it);}catch(e){lost.push(it);}}
      const done=questProgress(s,op.mon).filter(id=>s.quests.active[id]>=QUESTS[id].count);
      let bonus=0;const k=s.flags.kills;if(!s.flags.hunted&&k.deer&&k.lion&&k.elephant&&k.croc){s.flags.hunted=true;s.copper+=100;bonus=100;}
      const up=gainExp(s,M.exp);
      // Sách Ma công: tỉ lệ thu phục quái (không áp dụng cho trùm), tăng theo Mệnh lệnh và cấp sách
      let pet=null;if(!M.boss&&(s.pets=s.pets||[]).length<petMax()){const D=derive(s);if(D.bfx.demon>=0){const ch=num(CFG.ma_ti_le_goc,2)+D.main.cmd*num(CFG.ma_phan_van_moi_menh_lenh,20)/100+num(CFG.sach_ti_le_cap,1)*D.bfx.demon;if(rng()*100<ch){pet={pid:'pet-'+rnd36(rng),type:op.mon,hpFrac:1};s.pets.push(pet);}}}
      return {mon:op.mon,copper:M.copper,rubies:drop.rubies,items,lost,done,bonus,exp:M.exp,up,level:s.level,pet};
    }
    if(t==='buy'){const i=buy(s,String(op.type),op.q==='g'?'g':'n',rng);return {i,item:s.bag[i]};}
    if(t==='sell'){const i=Math.floor(op.i),it=s.bag[i];const v=sell(s,i);return {v,item:it};}
    if(t==='enh'){const bag=op.where==='bag',key=bag?Math.floor(op.key):String(op.key);if(!bag&&!slots.includes(key))throw Error('SLOT');const r=enhance(s,{where:bag?'bag':'equipment',key},rng,op.shop);return {...r,item:bag?s.bag[key]:s.equipment[key]};}
    if(t==='enhSk'){const key=Math.floor(op.key);if(!(key>=0&&key<SKILL_SLOTS))throw Error('SLOT');const r=enhance(s,{where:'skill',key},rng,op.shop||'wizard');return {...r,item:s.skillSlots[key]};}
    if(t==='qa'){questAccept(s,String(op.id));return {};}
    if(t==='qt'){return questTurnIn(s,String(op.id),rng);}
    if(t==='hire'){const m=hireNpc(s,String(op.id),rng);return {mid:m.mid,name:m.name};}
    if(t==='petOff'){const i=(s.pets||[]).findIndex(x=>x.pid===op.pid);if(i<0)throw Error('PET');const x=s.pets.splice(i,1)[0];return {type:x.type};}
    if(t==='pt'){spendPoints(s,String(op.k),op.n);return {k:op.k,points:s.points};}
    if(t==='dismiss'){const i=Math.floor(op.i),m=s.mercs[i];dismissMerc(s,i);return {name:m?m.name:''};}
    throw Error('LENH');
  }
  load(typeof GAME_DATA!=='undefined'?GAME_DATA:{});
  return {VERSION,BAG_SIZE,SKILL_SLOTS,MAX_LV,MAX_MERC,MAX_ACTIVE_QUEST,ELEMENTS,BEASTS,GROUPS,FX_NAMES,STAT_KEYS,CFG,RAR,ADD,SHOPS,SETS,MON,QUESTS,MERCS,items,slots,skills,
    load,info,kind,weapon,skillCost,cmdInfo,WEAPONS,PREDICT,seqRng,setFollow,fitFollow,mercCmd,petMax,SHOP_ENH,expNeed,maxLevel,gainExp,spendPoints,mountGain,bookStat,mountCmd,qOf,rar,nameOf,stat,canEnhance,tradeable,gainOf,enhRate,enhCost,enhance,roll,rollDrop,create,derive,targets,equip,unequip,stance,isTwo,pairOk,setSkill,unsetSkill,toggleBook,element,money,shopPrice,buy,sell,sellPrice,addItem,cast,
    questAccept,questProgress,questTurnIn,hireNpc,addMerc,mercEquip,mercUnequip,dismissMerc,makeMerc,cleanItem,serialize,restore,restorePlayer,merge,applyOp,allItems};
})();

<script>
/* ================= CHỢ PHIÊN: trang riêng mua bán giữa người chơi =================
   Dùng chung tài khoản và máy chủ với game. Đồ và tiền nằm trên máy chủ nên mua bán ở đây là nhân vật trong game nhận ngay. */
(()=>{
  const $=s=>document.querySelector(s),root=$('#cho-phien'),info=Player.info;
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const svg=id=>`<svg class="icon" aria-hidden="true"><use href="#i-${id}"/></svg>`;
  const qColor=it=>Player.rar(it).color;
  const tintOf=it=>{const d=info(it);return d?(d.element?Player.ELEMENTS[d.element].color:d.tint||null):null;};
  const icon=(type,color)=>{const d=Player.items[type],id=d?(d.icon||d.kind):type;return LH_IMG.icon('vat_pham:'+type,id,color);};
  const coins=c=>{const m=Player.money(c),o=[];if(m.gold)o.push(`<span class="coin gold"><i></i>${m.gold}</span>`);if(m.silver)o.push(`<span class="coin silver"><i></i>${m.silver}</span>`);if(m.copper||!o.length)o.push(`<span class="coin"><i></i>${m.copper}</span>`);return `<span class="money">${o.join('')}</span>`;};

  const chips=it=>{const s=Player.stat(it),o=[];if(s.atk)o.push(chip('sword','Công +'+s.atk));if(s.def)o.push(chip('shield','Thủ +'+s.def));if(s.speed)o.push(chip('speed','Tốc \u{d7}'+s.speed));for(const [k,v] of Object.entries(it.add||{})){const A=Player.ADD[k];if(A)o.push(`<i class="ch add">${A.name} +${v}${A.unit}</i>`);}const d=info(it);if(d&&d.fxText)o.push(`<i class="ch fx">${esc(d.fxText)}</i>`);return `<span class="chips">${o.join('')}</span>`;};
  const ERR={MONEY:'Không đủ tiền',BAG_FULL:'Túi đồ đã đầy'};

  const pane=()=>$('#chPane');
  const card=(it,price,foot,attrs='')=>`<div class="card" ${attrs} style="--q:${qColor(it)}"><div class="ci" style="color:${tintOf(it)||'#e4cc8d'}">${icon(it.type)}${it.lv?`<b class="lv">+${it.lv}</b>`:''}</div><b class="nm" style="color:${qColor(it)}">${esc(Player.nameOf(it))}</b><small class="q" style="color:${qColor(it)}">${Player.rar(it).name}</small>${chips(it)}${price!=null?`<div class="pr">${coins(price)}</div>`:''}${foot||''}</div>`;
  async function paneMarket(){
    const p=pane();
    if(!S.market){p.innerHTML='<p class="hint">Đang tải hàng\u{2026}</p>';try{S.market=await Net.call('marketList');}catch(e){p.innerHTML=`<p class="hint">${esc(errMsg(e))}</p>`;return;}S.claim=S.market.claim;S.claimRuby=S.market.claimRuby||0;}
    const q=S.filter,list=S.market.open.map(r=>({...r,it:Player.cleanItem(r.item)})).filter(r=>r.it&&(q==='all'||Player.qOf(r.it)===q));
    const flt=[['all','Tất cả'],...Object.entries(Player.RAR).filter(([,r])=>r.trade).map(([k,r])=>[k,r.name])];
    const money=S.state?S.state.copper:0;
    p.innerHTML=`<div class="flt">${flt.map(([k,t])=>`<button data-f="${k}" class="${q===k?'on':''}" ${Player.RAR[k]?`style="color:${Player.RAR[k].color}"`:''}>${t}</button>`).join('')}<button id="reload" class="ghost">${svg('next')}Làm mới</button></div>`+
      (list.length?`<div class="grid">${list.map(r=>card(r.it,r.price,r.mine?`<button data-cancel="${r.id}">${svg('out')}Lấy lại</button><small class="seller">Của bạn</small>`:`<button class="primary" data-buy="${r.id}"${!S.state||money<r.price?' disabled':''}>${svg('bag')}Mua</button><small class="seller">${esc(r.seller||'')}</small>`)).join('')}</div>`:`<div class="empty">${svg('coin')}<span>Chợ chưa có hàng.</span></div>`);
    p.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;paneMarket();});
    $('#reload').onclick=()=>{S.market=null;paneMarket();};
    p.querySelectorAll('[data-buy]').forEach(b=>b.onclick=async()=>{busy(b,true);try{const r=await Net.call('marketBuy',{charId:S.charId,id:b.dataset.buy});S.state=r.state;S.market=null;toast(svg('check')+`${esc(cur().name)} đã mua <b style="color:${qColor(r.item)}">${esc(Player.nameOf(r.item))}</b>`);draw();}catch(e){toast(svg('close')+errMsg(e),true);busy(b,false);}});
    p.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{busy(b,true);try{const r=await Net.call('marketCancel',{id:b.dataset.cancel});if(r.charId===S.charId)S.state=r.state;S.market=null;toast(svg('check')+'Đã lấy lại món đồ về túi nhân vật đã ký gửi');draw();}catch(e){toast(svg('close')+errMsg(e),true);busy(b,false);}});
  }
  function paneSell(){
    const p=pane(),st=S.state;
    if(!st){p.innerHTML='<div class="empty"><span>Chọn nhân vật trước.</span></div>';return;}
    const fee=Player.CFG.phi_cho||0,tr=Object.values(Player.RAR).filter(r=>r.trade).map(r=>`<b style="color:${r.color}">${r.name}</b>`).join(', ');
    const own=st.bag.map((it,i)=>it&&Player.tradeable(it)?{it,i}:null).filter(Boolean);
    const sel=S.sel!=null?st.bag[S.sel]:null;
    p.innerHTML=`<p class="hint">Chỉ đồ ${tr} trong túi của ${esc(cur().name)} mới ký gửi được. Bán được, thương nhân giữ ${fee}%, tiền về mục Tiền bán hàng.</p>`+
      (own.length?`<div class="grid">${own.map(({it,i})=>card(it,null,`<button data-pick="${i}" class="${S.sel===i?'primary':''}">${svg('check')}${S.sel===i?'Đã chọn':'Chọn'}</button>`,S.sel===i?'data-on':'')).join('')}</div>`:`<div class="empty">${svg('bag')}<span>Túi không có đồ ký gửi được.</span></div>`)+
      (sel?`<div class="sellbar"><span>Giá bán <b style="color:${qColor(sel)}">${esc(Player.nameOf(sel))}</b></span><label>Vàng<input id="pg" type="number" min="0" value="1"></label><label>Bạc<input id="ps" type="number" min="0" max="99" value="0"></label><label>Đồng<input id="pc" type="number" min="0" max="99" value="0"></label><button class="primary" id="sGo">${svg('coin')}Ký gửi</button></div>`:'');
    p.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.pick);S.sel=S.sel===i?null:i;paneSell();});
    const go=$('#sGo');if(go)go.onclick=async()=>{
      const v=id=>Math.max(0,Math.floor(+$(id).value||0)),price=v('#pg')*10000+Math.min(99,v('#ps'))*100+Math.min(99,v('#pc'));
      if(price<1)return toast(svg('close')+'Nhập giá bán',true);
      busy(go,true);try{const r=await Net.call('marketSell',{charId:S.charId,i:S.sel,price});S.state=r.state;S.sel=null;S.market=null;toast(svg('check')+'Đã bày hàng ra chợ');draw();}catch(e){toast(svg('close')+errMsg(e),true);busy(go,false);}
    };
  }
  const statLine=s=>`<small class="stats">SM ${s.strength} \u{b7} NN ${s.agility} \u{b7} SK ${s.vitality} \u{b7} TT ${s.intelligence}</small>`;
  const gear=eq=>Player.slots.map(k=>eq&&eq[k]&&info(eq[k])?`<span title="${esc(Player.nameOf(eq[k]))}" style="color:${qColor(eq[k])}">${icon(eq[k].type)}</span>`:'').join('');
  async function paneMercs(){
    const p=pane();
    if(!S.mercs){p.innerHTML='<p class="hint">Đang tải\u{2026}</p>';try{S.mercs=(await Net.call('mercList')).list;}catch(e){S.mercs=[];}}
    const st=S.state,full=st&&st.mercs.length>=Player.MAX_MERC,money=st?st.copper:0,rubies=st?st.rubies:0;
    const look=m=>{const k=m.look||{},a=k.main;const eq=Player.slots.map(s=>m.equipment&&m.equipment[s]&&info(m.equipment[s])?m.equipment[s]:null).filter(Boolean);
      return `<div class="mlook"><span class="mlv">Lv. ${k.level||m.level||1}</span>${a?`<small class="stats">Sức mạnh ${a.str} \u{b7} Nhanh nhẹn ${a.agi} \u{b7} Sức khỏe ${a.vit} \u{b7} Trí tuệ ${a.int}${k.dmg?` \u{b7} Sát thương ${k.dmg[0]}\u{2013}${k.dmg[1]}`:''}${k.hp?` \u{b7} Máu ${k.hp}`:''}</small>`:statLine(m.stats)}
        <div class="mgear">${eq.length?eq.map(it=>`<span class="gi" title="${esc(Player.nameOf(it))}" style="color:${qColor(it)}">${icon(it.type)}<small>${esc(Player.nameOf(it))}</small></span>`).join(''):'<small class="stats">Chưa mặc đồ</small>'}</div></div>`;};
    const list=S.mercs.length?S.mercs.map(m=>`<div class="row merc"><span class="g">${m.gender==='f'?'Nữ':'Nam'}</span><div><b>${esc(m.name)}</b>${look(m)}</div><div class="end">${price(m.price,m.ruby)}<button class="primary" data-mbuy="${m.id}"${!st||full||money<m.price||rubies<(m.ruby||0)?' disabled':''}>${svg('user')}Mua về đi theo</button></div></div>`).join(''):`<div class="empty">${svg('user')}<span>Chưa có ai cho thuê nhân vật.</span></div>`;
    const mine=S.chars.filter(c=>c.id!==S.charId).map(c=>`<div class="row mine"><span class="g">${c.gender==='f'?'Nữ':'Nam'}</span><div><b>${esc(c.name)}</b>${statLine(c.stats)}${c.status==='merc'?`<small class="tag">Đang cho thuê \u{b7} ${price(c.price,c.ruby)}</small>`:''}</div><div class="end">${c.status==='merc'?`<button data-mcancel="${c.id}">Hủy cho thuê</button>`:`<div class="price-in"><label>Vàng<input data-mg="${c.id}" type="number" min="0" value="2"></label><label>Bạc<input data-ms="${c.id}" type="number" min="0" max="99" value="0"></label><label>Hồng ngọc<input data-mr="${c.id}" type="number" min="0" value="0"></label></div><button data-mreg="${c.id}">Cho thuê</button>`}</div></div>`).join('');
    p.innerHTML=`<p class="hint">Mua nhân vật của người chơi khác về làm lính đi theo ${st?esc(cur().name):''} (${st?st.mercs.length:0}/${Player.MAX_MERC}). Lính mua về thuộc về bạn và ra trận cùng (tối đa ${Player.MAX_MERC} lính).</p><div class="rows">${list}</div>
      <h3>Cho thuê nhân vật của tôi</h3><p class="hint">Nhân vật đang cho thuê không vào game được. Có người mua thì nhân vật thuộc về họ, bạn nhận tiền (trừ ${Player.CFG.phi_cho||0}% phí). Không cho thuê được nhân vật đang chọn giao dịch.</p><div class="rows">${mine||'<div class="empty"><span>Không có nhân vật nào khác.</span></div>'}</div>`;
    p.querySelectorAll('[data-mbuy]').forEach(b=>b.onclick=async()=>{busy(b,true);try{const r=await Net.call('mercBuy',{charId:S.charId,targetId:b.dataset.mbuy});S.state=r.state;S.mercs=null;toast(svg('check')+`${esc(r.name)} sẽ đi theo ${esc(cur().name)}`);draw();}catch(e){toast(svg('close')+errMsg(e),true);busy(b,false);}});
    p.querySelectorAll('[data-mreg]').forEach(b=>b.onclick=async()=>{const id=b.dataset.mreg,g=+p.querySelector(`[data-mg="${id}"]`).value||0,s=+p.querySelector(`[data-ms="${id}"]`).value||0,r=Math.max(0,Math.floor(+p.querySelector(`[data-mr="${id}"]`).value||0)),pr=Math.max(0,Math.floor(g))*10000+Math.min(99,Math.max(0,Math.floor(s)))*100;busy(b,true);try{await Net.call('mercRegister',{charId:id,price:pr,ruby:r});await boot();toast(svg('check')+'Đã đăng cho thuê');}catch(e){toast(svg('close')+errMsg(e),true);busy(b,false);}});
    p.querySelectorAll('[data-mcancel]').forEach(b=>b.onclick=async()=>{busy(b,true);try{await Net.call('mercCancel',{charId:b.dataset.mcancel});await boot();toast(svg('check')+'Đã hủy cho thuê');}catch(e){toast(svg('close')+errMsg(e),true);busy(b,false);}});
  }
  function paneClaim(){
    const p=pane(),c=cur();
    p.innerHTML=`<div class="claim">${svg('coin')}<div><span>Tiền bán hàng đang chờ</span><b>${price(S.claim,S.claimRuby)}</b></div>${(S.claim||S.claimRuby)&&c?`<button class="primary" id="cGo">Nhận vào ${esc(c.name)}</button>`:''}</div><p class="hint">Gồm tiền bán đồ ký gửi và tiền bán nhân vật cho thuê, đã trừ phí thương nhân.</p>`;
    const go=$('#cGo');if(go)go.onclick=async()=>{busy(go,true);try{const r=await Net.call('claim',{charId:S.charId});S.state=r.state;S.claim=0;S.claimRuby=0;toast(svg('check')+'Đã nhận '+price(r.amount,r.ruby));draw();}catch(e){toast(svg('close')+errMsg(e),true);busy(go,false);}};
  }
  // ---------- khởi động ----------
  // tài khoản đăng nhập ở thiết bị khác: thoát về khung đăng nhập
  window.addEventListener('lh-kicked',e=>{if(e.detail!=='DANG_NHAP_NOI_KHAC')return;Net.setToken('');S.charId=null;login();const m=$('#lMsg');if(m)m.textContent=NET_ERR.DANG_NHAP_NOI_KHAC+'. Đăng nhập lại để tiếp tục.';});
  $('#chMode').textContent=Net.online?'Máy chủ Việt Nam':'Chế độ ngoại tuyến \u{b7} dữ liệu lưu trên trình duyệt này';
  (async()=>{
    if(Net.online){try{const d=await Net.call('data');if(d.data&&d.data.vat_pham){Player.load(d.data);LH_IMG.set(d.data.hinh_anh);}}catch(e){}}
    if(Net.token)await boot();else login();
  })();
})();
</script>
</body></html>

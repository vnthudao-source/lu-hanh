  function tick(ts){
    raf=requestAnimationFrame(tick);const t=ts/1000;

    if(target<cap)target=Math.min(cap-1,target+(cap-target)*.006+.01);
    shown+=(target-shown)*.12;if(Math.abs(target-shown)<.05)shown=target;

        const words=String(opt.story).split(' ');let i=0;
        // chạm màn hình để hiện hết lời dẫn
        el.onclick=()=>{i=words.length-1;};

    },
    hide(){if(!el)return;el.classList.add('out');setTimeout(()=>{el.hidden=true;},500);cancelAnimationFrame(raf);raf=0;},

  };

})();

    const a=A.rows('tai_khoan').find(x=>x.token&&x.token===token);
    // Mỗi tài khoản chỉ một thiết bị: đăng nhập nơi khác thì phiên cũ bị đẩy ra
    if(!a){if(token&&A.rows('tai_khoan').some(x=>x.token_cu&&x.token_cu===token))fail('DANG_NHAP_NOI_KHAC');fail('PHIEN_HET_HAN');}
    if(Number(a.token_het_han)<A.now())fail('PHIEN_HET_HAN');
    return a;
  }
  function ownChar(a,id,status){
    const c=A.rows('nhan_vat').find(x=>x.id===id);
    if(!c||c.tai_khoan!==a.id)fail('KHONG_THAY_NHAN_VAT');
    if(status&&c.trang_thai!==status)fail('SAI_TRANG_THAI');
    return c;
  }
  const charView=c=>({id:c.id,name:c.ten,gender:c.gioi_tinh,stats:{strength:+c.suc_manh,agility:+c.nhanh_nhen,vitality:+c.suc_khoe,intelligence:+c.tri_tue},status:c.trang_thai,level:+c.cap||1,price:+c.gia_danh_thue||0,ruby:+c.gia_hong_ngoc||0,created:+c.tao_luc});
  function newToken(a){a.token_cu=a.token&&Number(a.token_het_han)>A.now()?a.token:'';a.token=A.uid()+A.uid();a.token_het_han=A.now()+TOKEN_DAYS*864e5;A.update('tai_khoan',a);return a.token;}
  // Trạng thái nhân vật lưu trên máy chủ (cột luu): {v, player, pos, seen, srv}
  function stateOf(c){
    A.rules&&A.rules();
    let save=null;try{save=c.luu?JSON.parse(c.luu):null;}catch(e){}save=save||{};
    const ch=charView(c);
    return {save,player:save.player?Player.restore(save,ch,()=>true,null).player:Player.create(ch)};
  }
  function storeState(c,st,player,soft){
    soft=soft||{};
    const okPos=v=>v&&Number.isFinite(+v.x)&&Number.isFinite(+v.y)?{x:+v.x,y:+v.y}:null;
    const save={v:Player.VERSION,player,pos:soft.pos!==undefined?okPos(soft.pos):(st.save.pos||null),seen:Array.isArray(soft.seen)?soft.seen.slice(0,60).map(String):(st.save.seen||[]),srv:st.save.srv||{}};
    const j=JSON.stringify(save);if(j.length>45000)fail('DU_LIEU_QUA_LON');
    c.luu=j;c.cap=player.level;c.kinh_nghiem=player.exp;c.cap_nhat=A.now();A.update('nhan_vat',c);st.save=save;
  }
  // Dáng vẻ nhân vật (cho căn lều chọn nhân vật và chợ cho thuê): cấp, đồ đang mặc, hào quang sách, số lính, chỉ số
  function lookOf(c){
    try{const p=stateOf(c).player,D=Player.derive(p),ab=p.activeBook!=null?p.skillSlots[p.activeBook]:p.skillSlots.find(Boolean);
      return {level:p.level,equipment:p.equipment,el:ab&&Player.info(ab)?Player.info(ab).element:null,mercs:p.mercs.length,pets:(p.pets||[]).length,main:D.main,dmg:[D.tot.dmgMin,D.tot.dmgMax],hp:D.tot.hp,def:D.tot.def};}catch(e){return null;}
  }
  const claimSum=acc=>pendingClaims(acc).reduce((s,r)=>({copper:s.copper+Number(r.tien_nhan||0),ruby:s.ruby+Number(r.hong_ngoc_nhan||0)}),{copper:0,ruby:0});
  function pendingClaims(acc){return A.rows('cho').filter(r=>r.trang_thai==='da_ban'&&r.nguoi_ban===acc&&String(r.da_nhan)!=='1');}
  const H={
    ping:()=>({msg:'Lữ Hành API'}),
    // kiểm tra phiên còn giữ (game gọi định kỳ): bị đăng nhập nơi khác thì báo DANG_NHAP_NOI_KHAC
    alive(p){auth(p.token);return {};},
    data:()=>({data:A.staticData()}),
    register(p){
      const username=lower(p.username),email=lower(p.email),pw=String(p.password||'');
      if(!/^[a-z0-9_]{3,20}$/.test(username))fail('TEN_DANG_NHAP_SAI');
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))fail('EMAIL_SAI');
      if(pw.length<6)fail('MAT_KHAU_NGAN');
      return A.lock(()=>{
        const all=A.rows('tai_khoan');
        if(all.some(a=>a.username===username))fail('TEN_DANG_NHAP_DA_CO');
        if(all.some(a=>a.email===email))fail('EMAIL_DA_CO');
        const salt=A.uid(),a={id:'tk-'+A.uid(),username,email,muoi:salt,mat_khau:A.hash(salt+pw),tao_luc:A.now(),token:'',token_het_han:0,ma_khoi_phuc:'',ma_het_han:0};
        A.insert('tai_khoan',a);
        return {token:newToken(a),account:pub(a)};
      });
    },
    login(p){
      const key=lower(p.username),pw=String(p.password||'');
      const a=A.rows('tai_khoan').find(x=>x.username===key||x.email===key);
      if(!a||A.hash(a.muoi+pw)!==a.mat_khau)fail('SAI_DANG_NHAP');
      return {token:newToken(a),account:pub(a)};
    },
    logout(p){const a=auth(p.token);a.token='';a.token_cu='';a.token_het_han=0;A.update('tai_khoan',a);return {};},
    forgot(p){
      const email=lower(p.email),a=A.rows('tai_khoan').find(x=>x.email===email);
      if(!a)fail('KHONG_THAY_EMAIL');
      const code=String(100000+Math.floor(Math.random()*900000));
      a.ma_khoi_phuc=code;a.ma_het_han=A.now()+RESET_MIN*6e4;A.update('tai_khoan',a);
      A.mail(a.email,'Lữ Hành \u{b7} Khôi phục tài khoản',`Tên đăng nhập của bạn: ${a.username}\nMã khôi phục: ${code}\nMã có hiệu lực ${RESET_MIN} phút.`);
      return {sent:true,devCode:A.devMail?code:undefined,username:A.devMail?a.username:undefined};
    },
    reset(p){
      const email=lower(p.email),a=A.rows('tai_khoan').find(x=>x.email===email);
      if(!a||!a.ma_khoi_phuc||String(a.ma_khoi_phuc)!==String(p.code).trim()||Number(a.ma_het_han)<A.now())fail('MA_SAI');
      if(String(p.password||'').length<6)fail('MAT_KHAU_NGAN');
      a.muoi=A.uid();a.mat_khau=A.hash(a.muoi+p.password);a.ma_khoi_phuc='';a.ma_het_han=0;
      return {token:newToken(a),account:pub(a)};
    },
    chars(p){
      const a=auth(p.token),list=A.rows('nhan_vat').filter(c=>c.tai_khoan===a.id&&(c.trang_thai==='active'||c.trang_thai==='merc')).map(c=>({...charView(c),look:lookOf(c)}));
      const cs=claimSum(a.id);
      return {account:pub(a),chars:list,max:cfg('so_nhan_vat_toi_da')||5,claim:cs.copper,claimRuby:cs.ruby};
    },
    createChar(p){
      const a=auth(p.token),name=String(p.name||'').trim().replace(/\s+/g,' '),gender=p.gender==='f'?'f':'m',st=p.stats||{};
      if(name.length<2||name.length>16||!/^[\p{L}\p{N} ]+$/u.test(name))fail('TEN_NHAN_VAT_SAI');
      const keys=['strength','agility','vitality','intelligence'],vals=keys.map(k=>Number(st[k]));
      if(vals.some(v=>!Number.isInteger(v)||v<0))fail('DIEM_SAI');
      if(vals.reduce((s,v)=>s+v,0)!==(cfg('diem_khoi_tao')||50))fail('DIEM_SAI');
      return A.lock(()=>{
        const all=A.rows('nhan_vat'),max=cfg('so_nhan_vat_toi_da')||5;
        if(all.filter(c=>c.tai_khoan===a.id&&(c.trang_thai==='active'||c.trang_thai==='merc')).length>=max)fail('DU_NHAN_VAT');
        if(all.some(c=>c.ten_khoa===lower(name)&&c.trang_thai!=='deleted'))fail('TEN_DA_CO');
        const c={id:'nv-'+A.uid(),tai_khoan:a.id,ten:name,ten_khoa:lower(name),gioi_tinh:gender,suc_manh:vals[0],nhanh_nhen:vals[1],suc_khoe:vals[2],tri_tue:vals[3],trang_thai:'active',gia_danh_thue:0,nguoi_mua:'',luu:'',tao_luc:A.now(),cap_nhat:A.now()};
        A.insert('nhan_vat',c);return {char:charView(c)};
      });
    },
    load(p){
      const a=auth(p.token);
      return A.lock(()=>{const c=ownChar(a,p.charId,'active'),st=stateOf(c);if(!c.luu)storeState(c,st,st.player);return {char:charView(c),save:{player:st.player,pos:st.save.pos||null,seen:st.save.seen||[]}};});
    },
    // Đồng bộ: nhận cách sắp xếp đồ + lệnh, máy chủ tự tính kết quả (rơi đồ, tiền, gia cường\u{2026}) rồi trả lại trạng thái chuẩn
    play(p){
      const a=auth(p.token);
      return A.lock(()=>{
        const c=ownChar(a,p.charId,'active'),st=stateOf(c),C=p.save&&p.save.player;
        const R=C?Player.merge(st.player,C):st.player,srv=st.save.srv=st.save.srv||{},now=A.now();
        const results=(Array.isArray(p.ops)?p.ops.slice(0,60):[]).map(op=>{try{return {ok:true,...Player.applyOp(R,op,srv,now)};}catch(e){return {ok:false,error:String(e.message||e)};}});
        storeState(c,st,R,{pos:p.save&&p.save.pos,seen:p.save&&p.save.seen});
        return {state:R,results,savedAt:c.cap_nhat};
      });
    },
    save(p){return H.play({...p,ops:[]});},
    mercRegister(p){
      const a=auth(p.token),c=ownChar(a,p.charId,'active'),price=Math.max(0,Math.floor(Number(p.price)||0)),ruby=Math.max(0,Math.floor(Number(p.ruby)||0));
      if(!(price>=100)&&!(ruby>=1))fail('GIA_SAI');
      c.trang_thai='merc';c.gia_danh_thue=price;c.gia_hong_ngoc=ruby;c.cap_nhat=A.now();A.update('nhan_vat',c);return {char:charView(c)};
    },
    mercCancel(p){const a=auth(p.token),c=ownChar(a,p.charId,'merc');c.trang_thai='active';c.gia_danh_thue=0;c.gia_hong_ngoc=0;A.update('nhan_vat',c);return {char:charView(c)};},
    mercList(p){
      const a=auth(p.token);
      return {list:A.rows('nhan_vat').filter(c=>c.trang_thai==='merc'&&c.tai_khoan!==a.id).map(c=>{let eq={};try{eq=(JSON.parse(c.luu||'{}').player||{}).equipment||{};}catch(e){}return {...charView(c),equipment:eq,look:lookOf(c)};})};
    },
    mercBuy(p){
      const a=auth(p.token);
      return A.lock(()=>{
        const b=ownChar(a,p.charId,'active'),t=A.rows('nhan_vat').find(c=>c.id===p.targetId);
        if(!t||t.trang_thai!=='merc'||t.tai_khoan===a.id)fail('LINH_KHONG_CON');
        let eq={};try{eq=(JSON.parse(t.luu||'{}').player||{}).equipment||{};}catch(e){}
        const price=Number(t.gia_danh_thue)||0,ruby=Number(t.gia_hong_ngoc)||0,fee=(cfg('phi_cho')||0)/100,st=stateOf(b);
        if(st.player.copper<price)fail('KHONG_DU_TIEN');if(st.player.rubies<ruby)fail('KHONG_DU_HONG_NGOC');if(st.player.mercs.length>=Player.MAX_MERC)fail('DU_LINH');
        Player.addMerc(st.player,{name:t.ten,gender:t.gioi_tinh,stats:charView(t).stats,equipment:eq,src:'player',from:t.id,cmd:10});
        st.player.copper-=price;st.player.rubies-=ruby;storeState(b,st,st.player);
        t.trang_thai='sold';t.nguoi_mua=p.charId;t.cap_nhat=A.now();A.update('nhan_vat',t);
        A.insert('cho',{id:'ch-'+A.uid(),loai:'linh',nguoi_ban:t.tai_khoan,nhan_vat_ban:t.id,vat_pham:'',gia:price,tien_nhan:Math.floor(price*(1-fee)),hong_ngoc:ruby,hong_ngoc_nhan:Math.floor(ruby*(1-fee)),trang_thai:'da_ban',nguoi_mua:p.charId,tao_luc:A.now(),ban_luc:A.now(),da_nhan:0});
        return {name:t.ten,price,ruby,state:st.player};
      });
    },
    marketList(p){
      const a=auth(p.token),rows=A.rows('cho').filter(r=>r.loai==='do');
      const view=r=>({id:r.id,item:JSON.parse(r.vat_pham||'null'),price:Number(r.gia),mine:r.nguoi_ban===a.id,seller:r.ten_nguoi_ban||''});
      return {open:rows.filter(r=>r.trang_thai==='mo').map(view),claim:claimSum(a.id).copper,claimRuby:claimSum(a.id).ruby};
    },
    // Ký gửi: lấy món đồ ra khỏi túi nhân vật trên máy chủ
    marketSell(p){
      const a=auth(p.token),price=Math.floor(Number(p.price));
      if(!(price>=1))fail('GIA_SAI');
      return A.lock(()=>{
        const c=ownChar(a,p.charId,'active'),st=stateOf(c),i=Math.floor(Number(p.i)),it=st.player.bag[i];
        if(!it||!Player.tradeable(it))fail('VAT_PHAM_SAI');
        st.player.bag[i]=null;storeState(c,st,st.player);
        const fee=(cfg('phi_cho')||0)/100,r={id:'ch-'+A.uid(),loai:'do',nguoi_ban:a.id,nhan_vat_ban:c.id,ten_nguoi_ban:c.ten,vat_pham:JSON.stringify(it),gia:price,tien_nhan:Math.floor(price*(1-fee)),trang_thai:'mo',nguoi_mua:'',tao_luc:A.now(),ban_luc:0,da_nhan:0};
        A.insert('cho',r);return {id:r.id,state:st.player};
      });
    },
    // Hủy ký gửi: trả món đồ về túi nhân vật đã ký gửi
    marketCancel(p){
      const a=auth(p.token);
      return A.lock(()=>{
        const r=A.rows('cho').find(x=>x.id===p.id);if(!r||r.nguoi_ban!==a.id||r.trang_thai!=='mo')fail('KHONG_HUY_DUOC');
        const c=ownChar(a,r.nhan_vat_ban,'active'),st=stateOf(c),it=Player.cleanItem(JSON.parse(r.vat_pham));
        if(it)Player.addItem(st.player,it);storeState(c,st,st.player);
        r.trang_thai='huy';A.update('cho',r);return {charId:c.id,state:st.player};
      });
    },
    marketBuy(p){
      const a=auth(p.token);
      return A.lock(()=>{
        const c=ownChar(a,p.charId,'active'),r=A.rows('cho').find(x=>x.id===p.id);
        if(!r||r.trang_thai!=='mo')fail('DA_BAN');if(r.nguoi_ban===a.id)fail('DO_CUA_MINH');
        const st=stateOf(c),price=Number(r.gia),it=Player.cleanItem(JSON.parse(r.vat_pham));
        if(st.player.copper<price)fail('KHONG_DU_TIEN');if(!it)fail('VAT_PHAM_SAI');
        Player.addItem(st.player,it);st.player.copper-=price;storeState(c,st,st.player);
        r.trang_thai='da_ban';r.nguoi_mua=p.charId;r.ban_luc=A.now();A.update('cho',r);
        return {item:it,price,state:st.player};
      });
    },
    // Nhận tiền bán hàng vào một nhân vật
    claim(p){
      const a=auth(p.token);
      return A.lock(()=>{
        const c=ownChar(a,p.charId,'active'),st=stateOf(c);let sum=0,rsum=0;
        for(const r of pendingClaims(a.id)){sum+=Number(r.tien_nhan||0);rsum+=Number(r.hong_ngoc_nhan||0);r.da_nhan=1;A.update('cho',r);}
        st.player.copper+=sum;st.player.rubies+=rsum;storeState(c,st,st.player);return {amount:sum,ruby:rsum,state:st.player};
      });
    }
  };
  return {handle(action,p){try{if(!H[action])fail('KHONG_CO_LENH');return {ok:true,...H[action](p||{})};}catch(e){return {ok:false,error:String(e.message||e)};}}};
}
</script>
<script>
/* ================= KẾT NỐI MÁY CHỦ =================
   Dán URL Web App của Apps Script vào LH_API. Để trống = chế độ ngoại tuyến (lưu trên trình duyệt này, dùng để thử). */
const LH_API=(typeof window!=='undefined'&&window.LH_API)||'';
function sha256(s){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=Array.from(new TextEncoder().encode(s)),l=b.length*8;b.push(0x80);while(b.length%64!==56)b.push(0);for(let i=7;i>=0;i--)b.push(Math.floor(l/2**(i*8))&255);
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const r=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
    for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
    let [a,bb,c,d,e,f,g,hh]=h;for(let i=0;i<64;i++){const t1=(hh+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&c)^(bb&c)))|0;hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;}
    h=h.map((v,i)=>(v+[a,bb,c,d,e,f,g,hh][i])|0);}
  return h.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
}
// Máy chủ giả trên trình duyệt: dùng chung LH_Core với Apps Script
const LocalServer=(()=>{
  const KEY='lh-offline-db';let db;
  const load=()=>{if(db)return db;try{db=JSON.parse(localStorage.getItem(KEY))||null;}catch(e){}return db=db||{tai_khoan:[],nhan_vat:[],cho:[]};};
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}};
  const core=LH_Core({
    rows:t=>load()[t],insert:(t,o)=>{load()[t].push(o);persist();},update:(t,o)=>{const a=load()[t],i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;persist();},
    mail:()=>{},devMail:true,hash:sha256,now:()=>Date.now(),uid:()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4),
    staticData:()=>GAME_DATA,lock:fn=>fn()
  });
  // đọc lại mỗi lệnh: game và Chợ phiên mở ở 2 thẻ vẫn dùng chung dữ liệu
  return {handle:(action,p)=>{db=null;return JSON.parse(JSON.stringify(core.handle(action,p)));}};
})();
const Net={
  online:!!LH_API,token:(()=>{try{return localStorage.getItem('lh-token')||'';}catch(e){return '';}})(),
  setToken(t){this.token=t||'';try{t?localStorage.setItem('lh-token',t):localStorage.removeItem('lh-token');}catch(e){}},
  async call(action,payload={}){
    const body={...payload,action,token:this.token};let r;
    if(!LH_API)r=LocalServer.handle(action,body);
    else{
      const json=JSON.stringify(body),small=json.length<1800;
      const parse=txt=>{try{return JSON.parse(txt);}catch(e){throw Error(/<html/i.test(txt)?'MAY_CHU_LOI':'Failed to fetch');}};
      // POST giống hệt bản 8.4 (không thêm tùy chọn nào: Safari thêm header là bị chặn CORS)
      const viaPost=async()=>parse(await (await fetch(LH_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:json})).text());
      // Đường dự phòng: lệnh nhỏ gửi bằng GET (?p=\u{2026}) khi trình duyệt không POST được
      const viaGet=async()=>{const x=parse(await (await fetch(LH_API+(LH_API.includes('?')?'&':'?')+'p='+encodeURIComponent(json))).text());if(x&&x.msg!==undefined&&action!=='ping')throw Error('POST_LOI');return x;};
      if(small&&Net.useGet){try{r=await viaGet();}catch(e){}}
      // mạng chập chờn (điện thoại chuyển 4G/Wi-Fi): lệnh chỉ đọc thì thử lại tối đa 2 lần
      for(let k=0;!r;k++){
        try{r=await viaPost();}
        catch(e){
          if(small&&(NET_SAFE.has(action)||action==='register'||action==='reset')&&netErr(e).message==='Failed to fetch'){try{r=await viaGet();Net.useGet=true;break;}catch(g){if(g.message==='POST_LOI')throw g;}}
          if(k>=2||e.message==='MAY_CHU_LOI'||!NET_SAFE.has(action))throw await netDiag(netErr(e));await new Promise(ok=>setTimeout(ok,900*(k+1)));
        }
      }
    }
    // cùng trình duyệt (game và Chợ phiên ở 2 thẻ) đã đăng nhập lại: dùng phiên mới rồi thử lại một lần
    if(!r.ok&&r.error==='DANG_NHAP_NOI_KHAC'&&!payload._retry){let st='';try{st=localStorage.getItem('lh-token')||'';}catch(e){}if(st&&st!==this.token){this.token=st;return this.call(action,{...payload,_retry:1});}}
    // phiên bị thay (đăng nhập ở thiết bị khác): báo cho game / Chợ phiên dừng lại
    if(!r.ok&&(r.error==='DANG_NHAP_NOI_KHAC'||(r.error==='PHIEN_HET_HAN'&&this.token))&&typeof window!=='undefined')window.dispatchEvent(new CustomEvent('lh-kicked',{detail:r.error}));
    if(!r.ok){const e=Error(r.error||'LOI');throw e;}
    return r;
  }
};
const NET_ERR={PHIEN_HET_HAN:'Phiên đăng nhập hết hạn, hãy đăng nhập lại',TEN_DANG_NHAP_SAI:'Tên đăng nhập 3\u{2013}20 ký tự: chữ thường, số, dấu _',EMAIL_SAI:'Email không hợp lệ',MAT_KHAU_NGAN:'Mật khẩu tối thiểu 6 ký tự',TEN_DANG_NHAP_DA_CO:'Tên đăng nhập đã có người dùng',EMAIL_DA_CO:'Email đã được đăng ký',SAI_DANG_NHAP:'Sai tên đăng nhập hoặc mật khẩu',KHONG_THAY_EMAIL:'Không có tài khoản dùng email này',MA_SAI:'Mã khôi phục sai hoặc hết hạn',TEN_NHAN_VAT_SAI:'Tên nhân vật 2\u{2013}16 ký tự, chỉ chữ và số',DIEM_SAI:'Phải chia đủ số điểm',DU_NHAN_VAT:'Tài khoản đã đủ số nhân vật',TEN_DA_CO:'Tên nhân vật đã có người dùng',KHONG_THAY_NHAN_VAT:'Không tìm thấy nhân vật',SAI_TRANG_THAI:'Nhân vật đang đi đánh thuê',GIA_SAI:'Giá không hợp lệ',LINH_KHONG_CON:'Lính này đã có người thuê',DA_BAN:'Món này đã được bán',DO_CUA_MINH:'Đây là đồ bạn ký gửi',KHONG_HUY_DUOC:'Không hủy được',DU_LIEU_QUA_LON:'Dữ liệu lưu quá lớn',KHONG_DU_TIEN:'Nhân vật không đủ tiền',DU_LINH:'Nhân vật đã đủ lính',BAG_FULL:'Túi đồ đã đầy',VAT_PHAM_SAI:'Món đồ không hợp lệ',NHANH_QUA:'Quái chưa kịp hồi sinh',KHONG_DU_HONG_NGOC:'Nhân vật không đủ hồng ngọc',DANG_NHAP_NOI_KHAC:'Tài khoản vừa đăng nhập trên thiết bị khác',KHONG_CO_LENH:'Máy chủ chưa cập nhật bản mới',MAY_CHU_LOI:'Máy chủ Apps Script đang lỗi hoặc chưa mở quyền truy cập cho mọi người',POST_LOI:'Máy chủ có chạy nhưng không nhận lệnh: dán Code.gs mới rồi Triển khai \u{2192} Quản lý triển khai \u{2192} Sửa \u{2192} Phiên bản mới',KHONG_TRUY_CAP:'Trình duyệt này không gọi được máy chủ: trong Apps Script, Triển khai \u{2192} Quản lý triển khai \u{2192} Sửa, mục "Ai có quyền truy cập" chọn "Bất kỳ ai"'};
// Không gọi được máy chủ: thử GET (lệnh ping) để biết lỗi ở đâu
//  - GET được, POST không: Code.gs mới chưa được triển khai (hoặc doPost lỗi)
//  - GET cũng không: quyền truy cập Web App chưa đặt "Bất kỳ ai" (trình duyệt điện thoại chặn cookie Google bên thứ ba)
async function netDiag(e){
  if(e.message!=='Failed to fetch'||(typeof navigator!=='undefined'&&navigator.onLine===false))return e;
  try{const r=await fetch(LH_API+(LH_API.includes('?')?'&':'?')+'t='+Date.now());const j=JSON.parse(await r.text());return Error(j&&j.ok?'POST_LOI':'KHONG_TRUY_CAP');}
  catch(x){return Error('KHONG_TRUY_CAP');}
}
const NET_SAFE=new Set(['ping','data','login','chars','load','alive','marketList','mercList']);
// lỗi mạng mỗi trình duyệt báo một kiểu: Chrome "Failed to fetch", Safari "Load failed", Firefox "NetworkError\u{2026}"
const netErr=e=>/failed to fetch|load failed|networkerror|network request failed|the internet connection/i.test(String(e&&e.message))?Error('Failed to fetch'):e;
const netMsg=e=>NET_ERR[e&&e.message]||(e&&e.message==='Failed to fetch'?'Không kết nối được máy chủ Việt Nam, kiểm tra mạng rồi thử lại':'Lỗi: '+(e&&e.message||e));
</script>
<script>
/* ================= ẢNH TĨNH (Sheet "LH \u{b7} Hình ảnh", tab hinh_anh) =================
   Mỗi dòng: nhom + ma + link_anh. Dán link ảnh Google Drive (chia sẻ "Bất kỳ ai có đường liên kết") hoặc link ảnh bất kỳ.
   Ô link để trống, hoặc ảnh không tải được: dùng biểu tượng / hình vẽ mặc định của game.
   nhom: bieu_tuong (biểu tượng giao diện) \u{b7} vat_pham (đồ dùng) \u{b7} quai (quái vật) \u{b7} npc (dân làng) \u{b7} giao_dien (logo, nền, chân dung, túi đồ rơi) */
const LH_IMG=(()=>{
  const KEY='lh-img',MAP={},PIC={},ORIG={};
  // Link Drive (file/d/ID/view, open?id=ID, uc?id=ID\u{2026}) \u{2192} link ảnh xem trực tiếp
  function direct(u){
    u=String(u||'').trim();if(!u)return '';
    const m=/(?:drive|docs)\.google\.com/.test(u)&&(u.match(/\/d\/([\w-]{20,})/)||u.match(/[?&]id=([\w-]{20,})/));
    if(m)return 'https://lh3.googleusercontent.com/d/'+m[1];
    return /^https?:\/\/\S+$/.test(u)||/^data:image\//.test(u)?u:'';
  }
  const url=key=>MAP[key]||'';
  const attr=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  // Biểu tượng HTML: ảnh nếu có, lỗi thì quay về biểu tượng mặc định
  function icon(key,fb,color){
    const s=`<svg class="icon" aria-hidden="true"${color?` style="color:${color}"`:''}><use href="#i-${fb}"/></svg>`,u=url(key);
    // ảnh nằm trong khung <svg class="icon"> để giữ đúng cỡ biểu tượng ở mọi chỗ
    return u?`<svg class="icon pic" viewBox="0 0 32 32" aria-hidden="true"${color?` style="color:${color}"`:''}><image href="${attr(u)}" width="32" height="32" preserveAspectRatio="xMidYMid meet" onerror="const e=document.createElementNS('http://www.w3.org/2000/svg','use');e.setAttribute('href','#i-${fb}');this.replaceWith(e)"/></svg>`:s;
  }
  // Ảnh cho canvas (quái, NPC, túi đồ): chỉ trả về khi đã tải xong
  function pic(key){const p=PIC[key];return p&&p.complete&&p.naturalWidth>0?p:null;}
  // Biểu tượng giao diện: thay nội dung <symbol id="i-\u{2026}"> bằng ảnh, mọi chỗ dùng biểu tượng đó tự đổi theo
  function applyIcons(){
    if(typeof document==='undefined')return;
    for(const [id,html] of Object.entries(ORIG)){const s=document.getElementById('i-'+id);if(s&&!MAP['bieu_tuong:'+id]){s.innerHTML=html;delete ORIG[id];}}
    for(const [k,u] of Object.entries(MAP)){
      if(!k.startsWith('bieu_tuong:'))continue;const id=k.slice(11),s=document.getElementById('i-'+id);if(!s)continue;
      if(!(id in ORIG))ORIG[id]=s.innerHTML;
      const vb=(s.getAttribute('viewBox')||'0 0 32 32').split(/\s+/).map(Number);
      // thử tải trước: lỗi thì giữ biểu tượng cũ
      const im=new Image();im.referrerPolicy='no-referrer';im.onload=()=>{s.innerHTML=`<image href="${attr(u)}" x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" preserveAspectRatio="xMidYMid meet"/>`;};im.src=u;
    }
  }
  function load(map){
    for(const k of Object.keys(MAP))delete MAP[k];Object.assign(MAP,map);
    for(const [k,u] of Object.entries(MAP)){if(/^(bieu_tuong|vat_pham):/.test(k)||(PIC[k]&&PIC[k].src===u))continue;const im=new Image();im.referrerPolicy='no-referrer';im.src=u;PIC[k]=im;}
    applyIcons();
  }
  // rows: [{nhom, ma, link_anh}] từ máy chủ
  function set(rows){
    const map={};for(const r of rows||[]){const u=direct(r.link_anh),k=String(r.nhom||'').trim()+':'+String(r.ma||'').trim();if(u&&k.length>2)map[k]=u;}
    try{localStorage.setItem(KEY,JSON.stringify(map));}catch(e){}
    load(map);
  }
  try{const c=JSON.parse(localStorage.getItem(KEY)||'{}');if(c&&typeof c==='object')load(c);}catch(e){}
  return {set,url,icon,pic,direct,get map(){return {...MAP};}};
})();
</script>
<script>
/* ================= THẾ GIỚI: làng Việt xưa ================= */
const World=(()=>{
  const T=48,W=60,H=32;
  // 0 cỏ \u{b7} 1 vật cản \u{b7} 2 nước \u{b7} 3 cầu \u{b7} 4 đường đất \u{b7} 5 đồng cỏ khô (bờ đông) \u{b7} 6 ruộng lúa
  const grid=Array.from({length:H},()=>Array(W).fill(0)),objects=[];
  const riverX=y=>30+Math.round(Math.sin(y*.28)*1.3);
  const ROAD={y0:15,y1:16,x0:5,x1:42},BRIDGE={x0:28,x1:35};
  const buildings=[
    {x:7,y:5,w:6,h:4,style:'hall'},
    {x:14,y:5,w:3,h:4,style:'shrine'},
    {x:19,y:6,w:5,h:4,style:'forge'},
    {x:7,y:19,w:5,h:4,style:'inn'},
    {x:13,y:20,w:5,h:3,style:'stable'},
    {x:20,y:20,w:4,h:4,style:'barn'}
  ];
  const monsterSpawns=[{type:'chua-son-lam',x:51,y:5},{type:'ngu-tinh',x:44,y:28},{type:'deer',x:43,y:8},{type:'deer',x:47,y:24},{type:'lion',x:50,y:12},{type:'elephant',x:52,y:21},{type:'croc',x:35,y:7},{type:'croc',x:35,y:25}];
  // Giếng cổ ở vùng săn (mỗi bản đồ 2\u{2013}3 giếng): chạm/nói chuyện để hồi đầy máu, dùng xong cạn nước một lúc
  const WELLS=[{id:'gieng-1',x:39,y:9},{id:'gieng-2',x:48,y:18},{id:'gieng-3',x:54,y:26}];
  const spurs=[[9,10,9,14],[15,15,9,14],[21,22,10,14],[9,10,17,18],[15,16,17,19],[21,22,17,19]];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const r=riverX(y);
    if(x>=r&&x<r+3)grid[y][x]=2;else if(x>=r+3)grid[y][x]=5;
    if(y>=ROAD.y0&&y<=ROAD.y1&&x>=ROAD.x0&&x<=ROAD.x1)grid[y][x]=grid[y][x]===2?3:4;
    if(y>=27&&y<=H-2&&x>=2&&x<=27&&grid[y][x]===0)grid[y][x]=6; // ruộng lúa phía nam làng
    if(x===0||y===0||x===W-1||y===H-1)grid[y][x]=1;
  }
  for(let y=9;y<=12;y++)for(let x=2;x<=4;x++)grid[y][x]=2; // ao sen
  spurs.forEach(([x0,x1,y0,y1])=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)grid[y][x]=4;});
  const reserved=(x,y)=>monsterSpawns.some(s=>Math.abs(s.x-x)<=1&&Math.abs(s.y-y)<=1)||WELLS.some(w=>Math.abs(w.x-x)<=1&&Math.abs(w.y-y)<=1)||(y>=13&&y<=18&&x<=44);
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const v=grid[y][x];if(reserved(x,y))continue;
    const town=x>=5&&x<=26&&y>=3&&y<=26;
    let tree=false;
    if(v===0&&!town&&(x*71+y*43)%13<5)tree=true; // lũy tre, cau, chuối bao quanh làng
    if(v===5&&(x>=56?(x*71+y*43)%13<9:(x*37+y*29)%31===0&&x>riverX(y)+5))tree=true;
    if(tree){grid[y][x]=1;objects.push({kind:'tree',x:(x+.5)*T,y:(y+.6)*T,seed:x*31+y*17,dry:v===5});}
  }
  buildings.forEach(b=>{for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)grid[y][x]=1;objects.push({kind:'house',...b,foot:(b.y+b.h)*T});});
  grid[11][25]=1;objects.push({kind:'banyan',x:25.5*T,y:11.8*T}); // cây đa đầu làng
  grid[18][12]=1;objects.push({kind:'well',x:12.5*T,y:18.7*T});   // giếng làng
  // Đống lửa trong làng
  const fires=[{x:14,y:13},{x:25,y:21}].map(f=>{grid[f.y][f.x]=1;const o={kind:'fire',x:(f.x+.5)*T,y:(f.y+.6)*T};objects.push(o);return o;});
  const wells=WELLS.map(w=>{grid[w.y][w.x]=1;const o={kind:'well',ancient:true,id:w.id,x:(w.x+.5)*T,y:(w.y+.7)*T};objects.push(o);return o;});
  const npcs=[
    {id:'elder',role:'elder',panel:'quests',name:'Lý trưởng',x:9*T,y:11.4*T,x0:8.4*T,x1:13.2*T,lines:['Chào lữ khách. Thanh Mộc là nơi bắt đầu hành trình của bạn.','Trong làng là vùng an toàn: không cưỡi thú, không dùng kỹ năng.','Làng có việc gì ta sẽ giao, xong việc có thưởng tiền và đồ.']},
    {id:'smith',role:'smith',shop:'smith',panel:'shop',name:'Thợ rèn',x:20.4*T,y:11.7*T,lines:['Dao, kiếm, khiên, nỏ\u{2026} lò rèn này có đủ.','Có hồng ngọc thì ta gia cường đồ cho, càng lên cao càng dễ vỡ.']},
    {id:'guide',role:'guide',panel:'mercs',name:'Người dẫn đường',x:27.3*T,y:14.4*T,lines:['Qua sông chỉ có cây cầu này.','Sư tử, cá sấu dữ. Voi chỉ nổi giận khi bị đánh.','Đi một mình nguy hiểm, ta có lính đánh thuê cho thuê.']},
    {id:'trainer',role:'trainer',shop:'trainer',panel:'shop',name:'Người nuôi thú cưỡi',x:18.8*T,y:21.7*T,lines:['Ngựa, hổ, voi\u{2026} con nào ở đây cũng đã thuần.','Mỗi loài có một ngón nghề riêng: ngựa đá hậu, hổ vồ mồi, voi dày xéo.']},
    {id:'wizard',role:'wizard',shop:'wizard',panel:'shop',name:'Đạo sĩ',x:17.4*T,y:10.3*T,lines:['Ngũ hành: Hỏa, Thủy, Thổ, Kim, Mộc. Bí truyền: Lôi, Phong, Băng, Ánh sáng, Ma công.','Gắn nhiều sách cùng lúc, chỉ số cộng dồn. Ta luyện sách cho mạnh thêm.']},
    {id:'merchant',role:'merchant',panel:'market',name:'Thương nhân',x:9.6*T,y:24.4*T,lines:['Ta buôn bán khắp các làng.','Đồ Hoàn hảo, Huyền thoại và đồ Thần, ta bán hộ cho người chơi khác.','Bán được ta giữ một ít tiền công.']}
  ];
  npcs.forEach(n=>Object.assign(n,{hx:n.x,hy:n.y,facing:n.role==='guide'||n.role==='smith'?1:-1,moving:false,walk:0,dir:1,pause:0,turnAt:0,phase:Math.random()}));
  const spawn={x:16*T,y:16*T};
  // Vùng an toàn: từ cột 0 đến cột vung_an_toan_x (Sheet cấu hình)
  const isSafe=x=>x<((typeof Player!=='undefined'&&Number(Player.CFG.vung_an_toan_x))||27)*T+T;
  const blocked=(x,y)=>x<0||y<0||x>=W||y>=H||grid[y][x]===1||grid[y][x]===2;
  function canStand(x,y,r=11){
    if(!Number.isFinite(x)||!Number.isFinite(y))return false;
    for(let gy=Math.floor((y-r)/T);gy<=Math.floor((y+r)/T);gy++)for(let gx=Math.floor((x-r)/T);gx<=Math.floor((x+r)/T);gx++)if(blocked(gx,gy)){
      const cx=Math.max(gx*T,Math.min(x,(gx+1)*T)),cy=Math.max(gy*T,Math.min(y,(gy+1)*T));
      if((x-cx)**2+(y-cy)**2<r*r)return false;
    }
    return true;
  }
  function move(p,dx,dy,r=11){
    const n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/6));
    for(let i=0;i<n;i++){if(canStand(p.x+dx/n,p.y,r))p.x+=dx/n;if(canStand(p.x,p.y+dy/n,r))p.y+=dy/n;}
    return p;
  }
  function nearestOpen(tx,ty){
    if(!blocked(tx,ty))return {x:tx,y:ty};
    for(let d=1;d<=4;d++)for(let y=ty-d;y<=ty+d;y++)for(let x=tx-d;x<=tx+d;x++)if(Math.max(Math.abs(x-tx),Math.abs(y-ty))===d&&!blocked(x,y))return {x,y};
    return null;
  }
  function findPath(from,to){
    const sx=Math.floor(from.x/T),sy=Math.floor(from.y/T),goal=nearestOpen(Math.floor(to.x/T),Math.floor(to.y/T));
    if(blocked(sx,sy)||!goal)return null;
    const ex=goal.x,ey=goal.y,key=(x,y)=>y*W+x,start=key(sx,sy),end=key(ex,ey),queue=[start],parent=new Map([[start,-1]]);
    for(let i=0;i<queue.length;i++){
      const k=queue[i];if(k===end)break;const x=k%W,y=Math.floor(k/W);
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,nk=key(nx,ny);if(!blocked(nx,ny)&&!parent.has(nk)){parent.set(nk,k);queue.push(nk);}}
    }
    if(!parent.has(end))return null;
    const path=[];let k=end;while(k!==-1){path.push({x:(k%W+.5)*T,y:(Math.floor(k/W)+.5)*T});k=parent.get(k);}
    path.reverse();
    if(ex===Math.floor(to.x/T)&&ey===Math.floor(to.y/T)&&canStand(to.x,to.y))path[path.length-1]={x:to.x,y:to.y};
    return path;
  }
  return {isSafe,T,W,H,grid,objects,buildings,npcs,wells,fires,spawn,monsterSpawns,riverX,ROAD,BRIDGE,blocked,canStand,move,findPath,nearestOpen};
})();
</script>
<script>
/* ================= LUẬT CHƠI: chỉ số, trang bị, phẩm chất, bộ đồ, gia cường, nhiệm vụ, lính đánh thuê ================= */
const Player=(()=>{
  const VERSION=7,BAG_SIZE=40,SKILL_SLOTS=10,MAX_LV=15,MAX_ACTIVE_QUEST=3,MAX_MERC=4;
  const slots=['mount','hat','wings','left','armor','right','gloves','pants','shoes'];
  const STAT_KEYS=['strength','agility','vitality','intelligence'];
  const ELEMENTS={

    const skillSlots=Array.from({length:SKILL_SLOTS},(_,i)=>take(Array.isArray(C.skillSlots)?C.skillSlots[i]:null));
    const bag=Array.from({length:BAG_SIZE},(_,i)=>take(Array.isArray(C.bag)?C.bag[i]:null));
    for(const it of pool.values()){const i=bag.indexOf(null);if(i<0)return softOnly();bag[i]=it;}
    const R=restorePlayer({...S,...soft,activeBook:C.activeBook,equipment,skillSlots,bag,mercs,pets},chOf);

  }
  // Các lệnh làm thay đổi tiền/đồ, chạy trên máy chủ (và trên trình duyệt ở chế độ ngoại tuyến)
  const KILL_LIMIT=id=>MON[id].boss?1:3;
  const PREDICT=new Set(['kill','buy','sell','enh','enhSk','qa','qt','hire','dismiss','pt','petOff']);
  function applyOp(s,op,srv,now=Date.now(),rng=Math.random){
    const t=op&&op.t;if(PREDICT.has(t))rng=seqRng(s);
    if(t==='kill'){
      const M=MON[op.mon];if(!M)throw Error('MON');
      srv.kills=srv.kills||{};const win=Math.max(5,M.respawn)*1000,log=(srv.kills[op.mon]||[]).filter(x=>now-x<win);
      if(log.length>=KILL_LIMIT(op.mon))throw Error('NHANH_QUA');log.push(now);srv.kills[op.mon]=log;
      s.copper+=M.copper;s.flags.kills[op.mon]=(s.flags.kills[op.mon]||0)+1;
      const drop=rollDrop(op.mon,rng),items=[],lost=[];s.rubies+=drop.rubies;
      for(const it of drop.items){try{addItem(s,it);items.push(it);}catch(e){lost.push(it);}}
      const done=questProgress(s,op.mon).filter(id=>s.quests.active[id]>=QUESTS[id].count);
      let bonus=0;const k=s.flags.kills;if(!s.flags.hunted&&k.deer&&k.lion&&k.elephant&&k.croc){s.flags.hunted=true;s.copper+=100;bonus=100;}
      const up=gainExp(s,M.exp);
      // Sách Ma công: tỉ lệ thu phục quái (không áp dụng cho trùm), tăng theo Mệnh lệnh và cấp sách
      let pet=null;if(!M.boss&&(s.pets=s.pets||[]).length<petMax()){const D=derive(s);if(D.bfx.demon>=0){const ch=num(CFG.ma_ti_le_goc,2)+D.main.cmd*num(CFG.ma_phan_van_moi_menh_lenh,20)/100+num(CFG.sach_ti_le_cap,1)*D.bfx.demon;if(rng()*100<ch){pet={pid:'pet-'+rnd36(rng),type:op.mon,hpFrac:1};s.pets.push(pet);}}}
      return {mon:op.mon,copper:M.copper,rubies:drop.rubies,items,lost,done,bonus,exp:M.exp,up,level:s.level,pet};
    }

    if(t==='sell'){const i=Math.floor(op.i),it=s.bag[i];const v=sell(s,i);return {v,item:it};}
    if(t==='enh'){const bag=op.where==='bag',key=bag?Math.floor(op.key):String(op.key);if(!bag&&!slots.includes(key))throw Error('SLOT');const r=enhance(s,{where:bag?'bag':'equipment',key},rng,op.shop);return {...r,item:bag?s.bag[key]:s.equipment[key]};}

    if(t==='qa'){questAccept(s,String(op.id));return {};}
    if(t==='qt'){return questTurnIn(s,String(op.id),rng);}
    if(t==='hire'){const m=hireNpc(s,String(op.id),rng);return {mid:m.mid,name:m.name};}
    if(t==='petOff'){const i=(s.pets||[]).findIndex(x=>x.pid===op.pid);if(i<0)throw Error('PET');const x=s.pets.splice(i,1)[0];return {type:x.type};}
    if(t==='pt'){spendPoints(s,String(op.k),op.n);return {k:op.k,points:s.points};}
    if(t==='dismiss'){const i=Math.floor(op.i),m=s.mercs[i];dismissMerc(s,i);return {name:m?m.name:''};}
    throw Error('LENH');
  }
  load(typeof GAME_DATA!=='undefined'?GAME_DATA:{});

  const busy=()=>!!dialogNPC||!overlayEl.hidden;

  /* ---------- Nền: đường đất, sân gạch, ruộng lúa, ao sen ---------- */
  function groundDraw(){

    for(let y=0;y<H;y++)for(let x=0;x<W;x++){

        c.strokeStyle='#4f7a36';c.lineWidth=1.6;for(let ry=6;ry<T;ry+=10)for(let rx=5;rx<T;rx+=9){c.beginPath();c.moveTo(x*T+rx,y*T+ry+5);c.lineTo(x*T+rx-2,y*T+ry);c.moveTo(x*T+rx,y*T+ry+5);c.lineTo(x*T+rx+2,y*T+ry);c.stroke();}
        c.fillStyle='#9c8a5c';if(x%3===0)c.fillRect(x*T,y*T,4,T);if(y%2===1)c.fillRect(x*T,y*T+T-4,T,4);
      }
      else if(east){c.strokeStyle='#86844f88';c.lineWidth=1.4;for(let k=0;k<3;k++){const gx=x*T+(n*7+k*13)%44,gy=y*T+(n*11+k*17)%44;c.beginPath();c.moveTo(gx,gy+6);c.lineTo(gx+2,gy);c.moveTo(gx+3,gy+6);c.lineTo(gx+6,gy+1);c.stroke();}}
      else{
        c.strokeStyle='#6a8a5288';c.lineWidth=1.2;for(let k=0;k<3;k++){const gx=x*T+(n*7+k*13)%44,gy=y*T+(n*11+k*17)%42;c.beginPath();c.moveTo(gx,gy+5);c.lineTo(gx+1.5,gy);c.moveTo(gx+3,gy+5);c.lineTo(gx+5,gy+1);c.stroke();}
        if(v===0&&(x*13+y*7)%17===0){const cols=['#f2d16b','#e98aa0','#f4f0e6'];for(let k=0;k<4;k++){const fx2=x*T+10+(k*11+n*5)%28,fy2=y*T+12+(k*7+n*3)%24;c.fillStyle=cols[(k+n)%3];c.beginPath();c.arc(fx2,fy2,2,0,PI2);c.fill();}}

    const sx0=13.2*T,sy0=17.1*T,sw=4.6*T,sh=2.8*T;c.fillStyle='#b5674a';c.fillRect(sx0,sy0,sw,sh);
    c.strokeStyle='#97513a';c.lineWidth=1.5;for(let gx=sx0;gx<=sx0+sw;gx+=24){c.beginPath();c.moveTo(gx,sy0);c.lineTo(gx,sy0+sh);c.stroke();}for(let gy=sy0;gy<=sy0+sh;gy+=24){c.beginPath();c.moveTo(sx0,gy);c.lineTo(sx0+sw,gy);c.stroke();}

  function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);width=r.width;height=r.height;canvas.width=Math.round(width*d);canvas.height=Math.round(height*d);ctx.setTransform(d,0,0,d,0,0);scale=width<700?.95:1.1;camera.x=clamp(hero.x-width/scale/2,0,Math.max(0,W*T-width/scale));camera.y=clamp(hero.y-height/scale/2,0,Math.max(0,H*T-height/scale));}

  /* ---------- Cây: tre, cau, chuối, đa ---------- */
  function tree(o){
    const x=o.x,y=o.y,v=o.seed%5,sway=Math.sin(time*1.2+o.seed)*2;

      const tx=x+2+sway,ty=y-h;for(let f=0;f<7;f++){const a=-Math.PI/2+(f-3)*.5;ctx.strokeStyle=f%2?'#4f7a36':'#5f8a3e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(tx,ty);ctx.quadraticCurveTo(tx+Math.cos(a)*22,ty+Math.sin(a)*22-8,tx+Math.cos(a)*34,ty+Math.sin(a)*20+10);ctx.stroke();}
      ctx.fillStyle='#d98a2e';for(let k=0;k<5;k++){ctx.beginPath();ctx.arc(tx-3+(k%3)*3,ty+6+Math.floor(k/3)*4,2.4,0,PI2);ctx.fill();}return;
    }

    for(let f=0;f<6;f++){const a=-Math.PI/2+(f-2.5)*.55+Math.sin(time+f)*.04,len=34;ctx.save();ctx.translate(x+2,y-28);ctx.rotate(a+Math.PI/2);ell(ctx,0,-len/2,7,len/2,f%2?'#6aa040':'#7cb34c');line(ctx,[0,0,0,-len],'#5a8a34',1);ctx.restore();}
  }
  function banyan(o){ // cây đa đầu làng
    const x=o.x,y=o.y;ell(ctx,x+20,y+6,70,18,'#1f322236');
    roundRect(ctx,x-14,y-58,28,62,10,'#6b5a42');line(ctx,[x-14,y,x-26,y+4],'#6b5a42',8);line(ctx,[x+14,y,x+28,y+5],'#6b5a42',8);line(ctx,[x-6,y-50,x-34,y-80],'#6b5a42',9);line(ctx,[x+6,y-52,x+36,y-84],'#6b5a42',9);
    ctx.strokeStyle='#5c4e38';ctx.lineWidth=1.4;for(let r=0;r<9;r++){const rx=x-60+r*15,top=y-86+((r*13)%10);ctx.beginPath();ctx.moveTo(rx,top);ctx.quadraticCurveTo(rx+Math.sin(time+r)*2,top+40,rx+1,top+66+((r*7)%18));ctx.stroke();}
    const blobs=[[-50,-96,40,26],[50,-98,40,26],[0,-118,56,34],[-30,-128,34,24],[34,-130,34,22],[0,-92,60,24]];blobs.forEach(([dx,dy,rx,ry],i)=>ell(ctx,x+dx,y+dy,rx,ry,['#2f5233','#35593a','#3d6340','#457046','#3a6040','#2c4c30'][i]));

  function oldWell(o){
    const x=o.x,y=o.y,full=!((player.flags.wells[o.id]||0)>Date.now());
    ell(ctx,x+6,y+4,32,9,'#22392640');
    roundRect(ctx,x-26,y-24,52,26,5,'#a0603c');ctx.strokeStyle='#7a4428';ctx.lineWidth=1;
    for(const yy of [y-15,y-6]){ctx.beginPath();ctx.moveTo(x-26,yy);ctx.lineTo(x+26,yy);ctx.stroke();}
    for(let i=-2;i<=2;i++){const xx=x+i*11+(i%2?5:0);ctx.beginPath();ctx.moveTo(xx,y-24);ctx.lineTo(xx,y-15);ctx.moveTo(xx-5,y-15);ctx.lineTo(xx-5,y-6);ctx.stroke();}
    ell(ctx,x-17,y-3,8,3,'#5f8a4a');ell(ctx,x+15,y-1,7,3,'#6f9a52');ell(ctx,x-22,y-20,4,2,'#6f9a52');
    ell(ctx,x,y-24,26,9,'#7a4a2e');ell(ctx,x,y-24,20,6,full?'#3f8fa8':'#4a3a2a');
    if(full){ell(ctx,x-4+Math.sin(time*2)*4,y-25,7,1.6,'#d6f2ffaa');ell(ctx,x+6+Math.cos(time*1.6)*3,y-23,4,1.2,'#d6f2ff77');}
    else{ell(ctx,x-5,y-23,4,1.5,'#6a5440');ell(ctx,x+6,y-24,3,1.2,'#6a5440');}
    line(ctx,[x-22,y-24,x-22,y-62],'#5a3a24',4);line(ctx,[x+22,y-24,x+22,y-62],'#5a3a24',4);
    poly(ctx,[x-36,y-58,x-30,y-64,x-26,y-74,x+26,y-74,x+30,y-64,x+36,y-58,x+24,y-63,x-24,y-63],'#8d3b2a');
    line(ctx,[x-26,y-74,x+26,y-74],'#5e2418',3);line(ctx,[x-30,y-66,x+30,y-66],'#a8503a',1.2);
    line(ctx,[x-22,y-58,x+22,y-58],'#6b4a2e',3);line(ctx,[x+4,y-58,x+4,full?y-40:y-30],'#c9b07a',1);roundRect(ctx,x-1,full?y-42:y-32,10,8,2,'#7a5a3a');
    ell(ctx,x+36,y-5,10,12,'#7a4a2e');ell(ctx,x+36,y-16,7,2.6,'#3a2418');ell(ctx,x+33,y-9,2,4,'#9a6a46');
  }
  function well(o){if(o.ancient)return oldWell(o);const x=o.x,y=o.y;ell(ctx,x+6,y+4,26,8,'#22392640');roundRect(ctx,x-22,y-24,44,26,6,'#8a8070');ell(ctx,x,y-24,22,8,'#6f6658');ell(ctx,x,y-24,16,5,'#2f4a52');line(ctx,[x-20,y-24,x-20,y-56],'#6b4a2e',3);line(ctx,[x+20,y-24,x+20,y-56],'#6b4a2e',3);line(ctx,[x-24,y-56,x+24,y-56],'#6b4a2e',4);line(ctx,[x,y-56,x,y-36],'#c9b07a',1);roundRect(ctx,x-5,y-38,10,8,2,'#7a5a3a');}

  /* ---------- Nhà kiểu làng Việt: mái ngói cong, mái rạ, vách tre ---------- */
  function thatch(x0,eave,x1,ridge,over,col='#b8954e'){ // mái rạ
    poly(ctx,[x0-over,eave,x0+over*1.4,ridge,x1-over*1.4,ridge,x1+over,eave],col);
    ctx.strokeStyle='#9c7a3c';ctx.lineWidth=1.3;for(let i=0;i<=40;i++){const k=i/40,bx=lerp(x0-over,x1+over,k),tx=lerp(x0+over*1.4,x1-over*1.4,k);ctx.beginPath();ctx.moveTo(bx,eave);ctx.lineTo(lerp(bx,tx,.55),lerp(eave,ridge,.55));ctx.stroke();}
    line(ctx,[x0+over*1.4,ridge,x1-over*1.4,ridge],'#7d5f2e',5);ctx.fillStyle='#d1b06a55';ctx.fillRect(x0-over,eave-6,x1-x0+over*2,4);
  }
  function tileRoof(x0,eave,x1,ridge,over,col='#9a4630'){ // mái ngói, đầu đao cong
    poly(ctx,[x0-over,eave,x0+over,ridge,x1-over,ridge,x1+over,eave],col);
    for(let i=0;i<=36;i++){const k=i/36,bx=lerp(x0-over,x1+over,k),tx=lerp(x0+over,x1-over,k);ctx.strokeStyle=i%2?'#7c3424':'#b25a3e';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(bx,eave);ctx.lineTo(tx,ridge);ctx.stroke();}
    line(ctx,[x0-over,eave,x1+over,eave],'#5e2a1c',4);
    ctx.strokeStyle='#5e2a1c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x0-over+10,eave);ctx.quadraticCurveTo(x0-over-6,eave,x0-over-10,eave-18);ctx.moveTo(x1+over-10,eave);ctx.quadraticCurveTo(x1+over+6,eave,x1+over+10,eave-18);ctx.stroke();
    line(ctx,[x0+over-4,ridge,x1-over+4,ridge],'#5e2a1c',7);
    ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x0+over-4,ridge);ctx.quadraticCurveTo(x0+over-14,ridge,x0+over-12,ridge-14);ctx.moveTo(x1-over+4,ridge);ctx.quadraticCurveTo(x1-over+14,ridge,x1-over+12,ridge-14);ctx.stroke();
  }
  function lantern(x,y,col){const sw=Math.sin(time*2+x)*2;line(ctx,[x,y-10,x+sw,y],'#3a2a1c',1.2);ctx.save();ctx.shadowColor=col;ctx.shadowBlur=12;ell(ctx,x+sw,y+7,6,8,col);ctx.restore();ctx.fillStyle='#e8c56a';ctx.fillRect(x+sw-4,y-1,8,2);ctx.fillRect(x+sw-4,y+14,8,2);line(ctx,[x+sw,y+16,x+sw,y+22],'#e8c56a',1);}
  function smoke(x,y){for(let i=0;i<4;i++){const ph=(time*.35+i/4)%1;ctx.globalAlpha=(1-ph)*.45;ell(ctx,x+Math.sin(ph*5+i)*8+ph*14,y-ph*70,6+ph*12,5+ph*10,'#d9d6cf');}ctx.globalAlpha=1;}
  function lattice(x,y,w,h){roundRect(ctx,x,y,w,h,2,'#6e4526');ctx.strokeStyle='#4a2c16';ctx.lineWidth=1.5;for(let lx=x+5;lx<x+w;lx+=6){ctx.beginPath();ctx.moveTo(lx,y+3);ctx.lineTo(lx,y+h-3);ctx.stroke();}ctx.strokeRect(x+2,y+2,w-4,h-4);}
  function house(b){
    const x=b.x*T,y=b.y*T,w=b.w*T,h=b.h*T,bot=y+h;
    ctx.fillStyle='#21302440';ctx.fillRect(x+12,y+30,w,h-20);
    if(b.style==='hall'){ // nhà ngói ba gian của lý trưởng
      roundRect(ctx,x-8,bot-16,w+16,18,3,'#a35a40');ctx.strokeStyle='#8a4a34';ctx.lineWidth=1;for(let gx=x-8;gx<x+w+8;gx+=16){ctx.beginPath();ctx.moveTo(gx,bot-16);ctx.lineTo(gx,bot+2);ctx.stroke();}
      roundRect(ctx,x+8,y+52,w-16,h-68,2,'#7a4a2a');
      const bay=(w-16)/3;for(let i=0;i<3;i++){lattice(x+16+i*bay,y+64,bay-16,h-88);}
      for(let i=0;i<=3;i++)roundRect(ctx,x+6+i*bay,y+50,10,h-64,3,'#3e2414');
      roundRect(ctx,x+w/2-34,y+54,68,14,2,'#2a1a10');ctx.strokeStyle='#d9b45f';ctx.lineWidth=1.5;ctx.strokeRect(x+w/2-32,y+56,64,10);
      tileRoof(x,y+56,x+w,y-8,26);
      lantern(x+22,y+60,'#d8402c');lantern(x+w-22,y+60,'#d8402c');
    }else if(b.style==='shrine'){ // miếu nhỏ của đạo sĩ: mái chồng diêm, lư hương, cờ phướn
      const cx=x+w/2;roundRect(ctx,x+4,bot-14,w-8,16,3,'#8d8a80');
      roundRect(ctx,x+20,y+82,w-40,h-96,2,'#c9a26a');roundRect(ctx,cx-16,bot-62,32,48,[14,14,0,0],'#6e1f18');
      roundRect(ctx,x+16,y+80,8,h-94,2,'#9a2c1e');roundRect(ctx,x+w-24,y+80,8,h-94,2,'#9a2c1e');
      tileRoof(x+14,y+86,x+w-14,y+50,16,'#5e6e46');tileRoof(x+30,y+50,x+w-30,y+14,12,'#5e6e46');
      ctx.save();ctx.shadowColor='#ffd27a';ctx.shadowBlur=10;ell(ctx,cx,y+6,7,7,'#e7c46a');ctx.restore();
      for(const s of [-1,1]){const fx2=cx+s*(w/2-4),wave=Math.sin(time*2+s)*4;line(ctx,[fx2,y+40,fx2,bot-10],'#5a4028',2);poly(ctx,[fx2,y+44,fx2+s*12+wave,y+50,fx2+s*10+wave,y+110,fx2,y+104],'#d9b44a');line(ctx,[fx2+s*3,y+60,fx2+s*8+wave*.6,y+64],'#b33a2e',2);}
      ell(ctx,cx,bot-4,14,5,'#7a5a2e');roundRect(ctx,cx-11,bot-16,22,12,[2,2,6,6],'#8a6a3a');line(ctx,[cx-12,bot-16,cx+12,bot-16],'#c9a46a',2);
      for(let k=-1;k<=1;k++){line(ctx,[cx+k*4,bot-16,cx+k*4,bot-30],'#c98a5a',1.2);ell(ctx,cx+k*4,bot-30,1.2,1.2,'#ff6a3a');}
      ctx.strokeStyle='#e6e1d888';ctx.lineWidth=1.2;for(let k=0;k<2;k++){ctx.beginPath();for(let s=0;s<20;s++){const yy=bot-32-s*3,xx=cx+(k?4:-4)+Math.sin(time*2+s*.4+k)*3;s?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}ctx.stroke();}
    }else if(b.style==='forge'){ // lò rèn: mái rạ, lò đất, ống bễ, giá dao kiếm
      roundRect(ctx,x+6,y+44,w-12,h-44,3,'#a07a52');ctx.strokeStyle='#8a6640';ctx.lineWidth=1;for(let ry=y+54;ry<bot;ry+=12){ctx.beginPath();ctx.moveTo(x+8,ry);ctx.lineTo(x+w-8,ry+2);ctx.stroke();}
      roundRect(ctx,x+14,y+60,w-28,h-64,3,'#2a1e16');
      ell(ctx,x+52,bot-30,28,32,'#8a5a3a');ell(ctx,x+52,bot-46,22,14,'#9a6a46');
      const g=ctx.createRadialGradient(x+52,bot-24,2,x+52,bot-24,18);g.addColorStop(0,'#ffe08a');g.addColorStop(.6,'#ff7a2e');g.addColorStop(1,'#ff7a2e00');ctx.save();ctx.globalAlpha=.8+Math.sin(time*9)*.15;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x+52,bot-24,18,0,PI2);ctx.fill();ctx.restore();
      for(let k=0;k<2;k++){roundRect(ctx,x+86+k*12,bot-70,9,64,4,'#b59a5c');line(ctx,[x+86+k*12,bot-50,x+95+k*12,bot-50],'#8a7a3c',1.5);}
      const rx=x+w-110;line(ctx,[rx,bot-96,rx+96,bot-96],'#5a4028',4);
      [[10,'#d5dde2',36],[30,'#cfd6db',30],[52,'#d5dde2',40]].forEach(([dx,col,len])=>{line(ctx,[rx+dx,bot-96,rx+dx,bot-90],'#3a2a1a',1);line(ctx,[rx+dx,bot-90,rx+dx,bot-90+len],col,4);line(ctx,[rx+dx,bot-90,rx+dx,bot-84],'#6b4a2e',5);});
      ctx.strokeStyle='#cfd6db';ctx.lineWidth=3;ctx.beginPath();ctx.arc(rx+80,bot-74,12,Math.PI*.1,Math.PI*1.1);ctx.stroke();line(ctx,[rx+80,bot-62,rx+80,bot-52],'#6b4a2e',4);
      for(const px of [x+6,x+w-12])roundRect(ctx,px,y+40,7,h-40,2,'#7a6a3a');
      thatch(x,y+52,x+w,y-6,16);smoke(x+52,y-4);
    }else if(b.style==='inn'){ // quán nước: vách tre, chõng, ấm trà, nón lá treo
      roundRect(ctx,x+6,y+46,w-12,h-46,3,'#c9ad6e');ctx.strokeStyle='#a98d52';ctx.lineWidth=1.5;for(let lx=x+12;lx<x+w-6;lx+=8){ctx.beginPath();ctx.moveTo(lx,y+48);ctx.lineTo(lx,bot);ctx.stroke();}
      roundRect(ctx,x+20,y+64,w-40,h-84,3,'#3a2c1c');
      roundRect(ctx,x+30,bot-34,88,8,2,'#b8964f');line(ctx,[x+34,bot-26,x+34,bot-8],'#8a6a3a',3);line(ctx,[x+114,bot-26,x+114,bot-8],'#8a6a3a',3);ctx.strokeStyle='#9a7a3a';for(let sx=x+34;sx<x+118;sx+=6){ctx.beginPath();ctx.moveTo(sx,bot-34);ctx.lineTo(sx,bot-27);ctx.stroke();}
      ell(ctx,x+60,bot-40,8,6,'#6b3a24');line(ctx,[x+67,bot-42,x+73,bot-46],'#6b3a24',2);ell(ctx,x+80,bot-37,3,2.5,'#e8e0cc');ell(ctx,x+90,bot-37,3,2.5,'#e8e0cc');
      poly(ctx,[x+w-60,y+86,x+w-44,y+70,x+w-28,y+86],'#e1cd8e');line(ctx,[x+w-58,y+86,x+w-30,y+86],'#b49c62',1.5);
      const sw=Math.sin(time*1.6)*4;line(ctx,[x+w-14,y+40,x+w-14,bot],'#7a5a3a',3);poly(ctx,[x+w-14,y+44,x+w+14+sw,y+48,x+w+12+sw,y+76,x+w-14,y+72],'#3e5f8a');
      thatch(x,y+54,x+w,y-4,16);lantern(x+30,y+56,'#ffb347');
    }else if(b.style==='barn'){ // kho thóc nhà sàn
      for(const px of [x+16,x+w/2-4,x+w-24])roundRect(ctx,px,bot-48,8,48,2,'#6b4a2e');
      roundRect(ctx,x+8,bot-54,w-16,8,2,'#8a6a42');
      roundRect(ctx,x+12,y+60,w-24,h-114,3,'#b8975a');ctx.strokeStyle='#9a7a40';ctx.lineWidth=1.2;for(let k=0;k<12;k++){ctx.beginPath();ctx.moveTo(x+12,y+64+k*6);ctx.lineTo(x+w-12,y+64+k*6);ctx.stroke();}
      roundRect(ctx,x+w/2-14,y+76,28,38,2,'#6e4a2a');
      line(ctx,[x+w/2-10,bot-46,x+w/2-18,bot],'#8a6a3a',3);line(ctx,[x+w/2+10,bot-46,x+w/2+2,bot],'#8a6a3a',3);for(let k=1;k<5;k++)line(ctx,[x+w/2-10-k*2,bot-46+k*9,x+w/2+10-k*2,bot-46+k*9],'#8a6a3a',2);
      thatch(x+4,y+64,x+w-4,y-24,18);
      ell(ctx,x+14,bot-8,12,9,'#a68048');ell(ctx,x+14,bot-14,12,4,'#c9a058');ell(ctx,x+w-16,bot-10,13,10,'#d8c49a');
    }else if(b.style==='stable'){ // chuồng ngựa: mái rạ, rào tre
      for(let px=x+4;px<=x+w;px+=58)roundRect(ctx,px,y+30,7,h-30,2,'#7a6a3a');
      roundRect(ctx,x+10,y+50,w-20,h-58,3,'#2c2016');
      const bob=Math.sin(time*1.3)*3,hx=x+w/2+10;
      ell(ctx,hx-10,y+90,22,14,'#7a4b2a');line(ctx,[hx+4,y+84,hx+14,y+68+bob],'#7a4b2a',10);ell(ctx,hx+20,y+66+bob,12,7,'#7a4b2a',.5);line(ctx,[hx+8,y+76,hx+16,y+62+bob],'#2e1c10',4);
      ell(ctx,x+40,y+108,22,9,'#e3c35a');
      thatch(x,y+40,x+w,y-2,14,'#b08a48');
      for(const ry of [bot-24,bot-12]){line(ctx,[x-4,ry,x+w+4,ry],'#b59a5c',4);for(let nx=x+20;nx<x+w;nx+=40)line(ctx,[nx,ry-2,nx,ry+2],'#8a7a3c',1.5);}for(let px=x;px<=x+w;px+=30)roundRect(ctx,px-3,bot-32,6,32,2,'#9c8a45');
    }
  }

  /* ---------- NPC trang phục Việt xưa + hoạt động lặp lại ---------- */
  function npcLegs(c,n,col){const s=n.moving?Math.sin(n.walk)*4:0;line(c,[-3,-6,-4-s,6],col,5);line(c,[3,-6,4+s,6],col,5);ell(c,-4-s+1,6,4,2,'#2e241a');ell(c,4+s+1,6,4,2,'#2e241a');}
  function head(c,skin,hair,beard){ell(c,0,-35,10.5,11,skin);if(hair)ell(c,-1,-42,11.5,6,hair);c.fillStyle='#30372e';c.fillRect(4,-37,2,2);if(beard){c.fillStyle=beard;c.beginPath();c.moveTo(-2,-30);c.quadraticCurveTo(5,-12,10,-30);c.closePath();c.fill();}}
  function khanXep(c,col='#1e1b19'){ell(c,0,-43,12.5,6,col);c.strokeStyle='#3a3430';c.lineWidth=1;for(let k=0;k<3;k++){c.beginPath();c.ellipse(0,-43+k*2-2,12,3,0,Math.PI*.1,Math.PI*.9);c.stroke();}}
  function nonLa(c,col='#e1cd8e'){poly(c,[-20,-41,0,-60,20,-41],col);line(c,[-20,-41,20,-41],'#b49c62',1.5);c.strokeStyle='#c9b070';c.lineWidth=1;for(let k=1;k<4;k++){c.beginPath();c.moveTo(-20+k*4.5,-41-k*4.3);c.lineTo(20-k*4.5,-41-k*4.3);c.stroke();}}
  function drawNPC(n){
    const c=ctx,t=time;ell(c,n.x,n.y+5,14,6,'#243d3544');
    c.save();c.translate(n.x,n.y);c.scale(n.facing,1);
    const pic=LH_IMG.pic('npc:'+n.id);
    if(pic)drawPic(c,pic,66,n.moving?-Math.abs(Math.sin(n.walk))*2:0);
    else if(n.role==='elder'){ // lý trưởng: áo the đen, khăn xếp, gậy trúc, đi đi lại lại
      const s=n.moving?Math.sin(n.walk)*4:0;ell(c,-3-s,5,4,2,'#2e241a');ell(c,4+s,5,4,2,'#2e241a');line(c,[-3,-2,-3-s,4],'#e8e2d2',4);line(c,[3,-2,3+s,4],'#e8e2d2',4);
      poly(c,[-12,-28,12,-28,14,0,-14,0],'#2b2724');line(c,[2,-27,9,-8],'#4a4440',1.5);line(c,[-14,-1,14,-1],'#3a3430',2);
      line(c,[-10,-24,-14,-10],'#2b2724',6);
      const cane=n.moving?Math.sin(n.walk)*3:0;line(c,[14+cane,-16,17+cane,6],'#c9b26a',2.5);for(let k=0;k<3;k++)line(c,[13.5+cane+k*1,-10+k*6,16+cane+k,-10+k*6],'#9c8a45',1);line(c,[10,-22,14+cane,-16],'#2b2724',6);ell(c,14+cane,-16,3,3,'#e1c295');
      head(c,'#e1c295',null,'#f2efe6');khanXep(c);
    }else if(n.role==='smith'){ // thợ rèn: cởi trần, khăn quấn đầu, búa gõ đe
      const ph=(t*1.1+n.phase)%1,raise=ph<.45?E(ph/.45):ph<.55?1-((ph-.45)/.1):0,ang=lerp(.5,-2.3,raise);
      ell(c,25,0,10,4,'#5a4028');roundRect(c,18,-12,14,12,2,'#6b4a2e');poly(c,[14,-17,34,-17,31,-12,17,-12],'#3d4248');
      c.save();c.shadowColor='#ff8a3d';c.shadowBlur=10;roundRect(c,19,-20,12,3,1,ph>.45&&ph<.7?'#fff0b0':'#ff9a3d');c.restore();
      npcLegs(c,n,'#5a3e28');
      roundRect(c,-13,-28,26,24,8,'#b9875a');line(c,[-6,-22,0,-18,6,-22],'#9c6e46',1.5);poly(c,[-9,-16,9,-16,10,-2,-10,-2],'#5a3a22');line(c,[-9,-16,-11,-25],'#5a3a22',1.5);
      c.fillStyle='#4a3020';c.fillRect(-13,-8,26,4);
      line(c,[-10,-24,10,-17],'#b9875a',6);ell(c,12,-17,3.5,3.5,'#b9875a');line(c,[12,-17,22,-19],'#2c2c2c',2.5);
      head(c,'#b9875a','#2a2622','#3a2a1a');ell(c,0,-42,12,4.5,'#7a5a3a');line(c,[-10,-42,-15,-36],'#7a5a3a',2.5);
      c.save();c.translate(9,-23);c.rotate(ang);line(c,[0,0,13,0],'#b9875a',6.5);ell(c,13,0,3.8,3.8,'#b9875a');line(c,[13,0,13,-18],'#6b4a2e',3);roundRect(c,7,-24,13,8,2,'#4a4f56');c.restore();
    }else if(n.role==='guide'){ // người dẫn đường: áo nâu, nón lá, tay nải, ống nhòm
      const cyc=(t+n.phase*6)%6,up=cyc<.7?E(cyc/.7):cyc<4.5?1:cyc<5.2?1-E((cyc-4.5)/.7):0;
      line(c,[-14,-30,-6,-6],'#6b4a2e',2);ell(c,-15,-24,7,8,'#3e5f8a');

  function updateNPCs(dt){

      if(n.role==='elder'){
        if(time<n.pause)continue;const tx=n.dir>0?n.x1:n.x0,d=tx-n.x;

      }else if(n.role==='guide'){if(time>n.turnAt){n.turnAt=time+5+Math.random()*3;if(Math.random()<.5)n.facing*=-1;}}

  function drawPet(e){const M=MON[e.type];ctx.save();ctx.globalAlpha=.5+Math.sin(time*3)*.15;ctx.strokeStyle=EL.demon.color;ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(e.x,e.y+3,M.r*1.3,M.r*.45,0,0,PI2);ctx.stroke();ctx.restore();drawMonster(e);if(safe)label(M.name,e.x,e.y-M.h-12,EL.demon.glow);}
  function center(m){return {x:m.x,y:m.y-MON[m.type].h*.5};}
  function floater(x,y,text,color,size=14){floaters.push({x,y,text,color,size,age:0,life:.9});}
  function burst(x,y,color,n=10,spd=120){for(let i=0;i<n;i++){const a=Math.random()*PI2,v=spd*(.4+Math.random()*.8);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-30,age:0,life:.45+Math.random()*.35,color,size:2+Math.random()*2.5,grav:180});}}
  function shake(a){shakeAmp=Math.max(shakeAmp,a);}
  const rarColor=q=>(Player.RAR[q]||{}).color||'#fff';
  function refreshHD(){HD=Player.derive(player,{safe});}
  function healHero(v){if(v>0&&!hero.dead)player.hp=Math.min(HD.tot.hp,player.hp+v);}

  /* ---------- Sát thương: dao động min-max, chính xác, x2/x3, hoàn hảo/huyền thoại/thần thoại, sát thương chuẩn ---------- */
  function rollHit(D,mul,owner){
    const S=D.tot,lo=S.dmgMin,hi=Math.max(lo,S.dmgMax);
    let v=Math.random()*100<S.acc?hi:lo+Math.random()*(hi-lo);
    v*=mul*D.dmgMul*(1+(HD.fx.aura||0)/100);
    let tag='',color='#fff1c4',size=14;
    const c=Math.random()*100;
    if(c<S.crit3){v*=3;tag='x3';color='#ff9a5a';size=18;}else if(c<S.crit3+S.crit2){v*=2;tag='x2';color='#ffd27a';size=16;}
    const q=Math.random()*100;
    if(q<S.mythDmg){v*=3;tag='Thần thoại';color=rarColor('m');size=18;}
    else if(q<S.mythDmg+S.legDmg){v*=2;tag='Huyền thoại';color=rarColor('l');size=17;}
    else if(q<S.mythDmg+S.legDmg+S.perfDmg){v*=1.5;tag='Hoàn hảo';color=rarColor('p');size=16;}
    if(owner==='hero'&&hero.counter){v*=1+(HD.fx.counter||0)/100;hero.counter=false;tag=tag||'Phản công';}
    return {dmg:Math.max(1,Math.round(v+S.trueDmg)),tag,color,size};
  }
  function hitMonster(m,atk,dx,dy,opt={}){
    if(m.dead)return 0;const M=MON[m.type];
    const r=atk.abs?{dmg:Math.max(1,Math.round(atk.abs)),tag:'',color:atk.color||'#fff1c4',size:13}:rollHit(atk.D,atk.mul,atk.owner);
    let dmg=r.dmg;const f=atk.owner==='hero'&&!atk.abs?HD.fx:{};
    if(f.execute&&!M.boss&&(m.hp-dmg)/m.max<f.execute/100){dmg=Math.max(dmg,m.hp);r.tag='Kết liễu';}
    m.hp-=dmg;m.hurt=time;m.aggro=time+8;
    const c=center(m);floater(c.x+(Math.random()*16-8),c.y-M.h*.5,(r.tag?r.tag+' ':'')+dmg,atk.el&&!r.tag?EL[atk.el].glow:r.color,atk.el&&!r.tag?16:r.size);
    burst(c.x,c.y,atk.el?EL[atk.el].color:'#f1e2b5',6);
    const kb=(atk.knock||30)*M.knock;if(kb)World.move(m,dx*kb*.25,dy*kb*.25,Math.min(M.r,16));
    if(m.type==='deer')m.flee=time+3;
    if(atk.owner==='hero'&&!atk.abs){
      if(f.lifesteal)healHero(dmg*f.lifesteal/100);
      if(f.stun&&Math.random()*100<f.stun){m.stunUntil=time+1;m.atk=null;floater(c.x,c.y-M.h*.5-18,'Choáng','#ffe69a',12);}
      if(f.burn)m.burn={dps:dmg*f.burn/100/3,until:time+3};
      const B=HD.bfx||{},bossK=M.boss?.5:1;
      if(B.thunder&&Math.random()*100<B.thunder)thunder(m,dmg*(Number(CFG.loi_sat_thuong)||150)/100);
      if(B.wind&&Math.random()*100<B.wind){m.slowUntil=time+(Number(CFG.phong_ms)||3000)/1000;m.slowK=Math.max(.1,1-(Number(CFG.phong_cham)||45)/100);floater(c.x,c.y-M.h*.5-18,'Chậm',EL.wind.color,12);burst(c.x,m.y-6,EL.wind.color,10,120);}
      if(B.ice&&Math.random()*100<B.ice){m.frozenUntil=time+(Number(CFG.bang_ms)||1800)/1000*bossK;m.atk=null;m.leap=null;floater(c.x,c.y-M.h*.5-18,'Đóng băng',EL.ice.glow,13);burst(c.x,c.y,EL.ice.color,16,140);}
      if(f.cleave&&atk.skill==='normal'&&!opt.cleave)for(const o of monsters)if(o!==m&&!o.dead&&Math.hypot(o.x-m.x,o.y-m.y)<90)hitMonster(o,{abs:dmg*f.cleave/100,owner:'hero',color:'#ffc8a0'},dx,dy,{cleave:true});
    }
    if(m.hp<=0)kill(m,atk.owner);
    return dmg;
  }
  // Sách Lôi: một đạo lôi quang từ trời đánh xuống quái, nổ sau 0,15 giây
  const strikes=[];
  function thunder(m,v){const c=center(m),x0=c.x+(Math.random()-.5)*70,pts=[x0,c.y-320];for(let i=1;i<8;i++)pts.push(lerp(x0,c.x,i/8)+(Math.random()-.5)*26,c.y-320+40*i);pts.push(c.x,c.y);fx.push({kind:'sky',pts,color:EL.thunder.color,glow:EL.thunder.glow,age:0,life:.32});strikes.push({m,v,at:time+.12});}
  function updateStrikes(){for(let i=strikes.length-1;i>=0;i--){const k=strikes[i];if(time<k.at)continue;strikes.splice(i,1);if(k.m.dead)continue;const c=center(k.m);fx.push({kind:'ring',x:k.m.x,y:k.m.y,r0:6,r1:60,color:EL.thunder.glow,age:0,life:.3,lw:4});burst(c.x,c.y,EL.thunder.color,16,200);shake(3);hitMonster(k.m,{abs:k.v,owner:'thunder',color:EL.thunder.glow},0,0);}}
  function hitArc(ox,oy,ang,range,arc,atk){
    for(const m of monsters){if(m.dead)continue;const M=MON[m.type],c=center(m),dx=c.x-ox,dy=c.y-oy,d=Math.hypot(dx,dy);if(d-M.r>range)continue;
      const da=Math.abs(((Math.atan2(dy,dx)-ang)%PI2+PI2*1.5)%PI2-Math.PI);if(arc<PI2-.01&&da>arc/2&&d>M.r+12)continue;hitMonster(m,atk,dx/(d||1),dy/(d||1));}
  }
  function hitLine(ox,oy,ang,len,w,atk){
    const ux=Math.cos(ang),uy=Math.sin(ang);
    for(const m of monsters){if(m.dead)continue;const M=MON[m.type],c=center(m),dx=c.x-ox,dy=c.y-oy,along=dx*ux+dy*uy,perp=Math.abs(dx*uy-dy*ux);if(along>-M.r&&along<len+M.r&&perp<w/2+M.r)hitMonster(m,atk,ux,uy);}
  }
  function nova(x,y,r,atk,except){fx.push({kind:'ring',x,y,r0:10,r1:r,color:atk.el?EL[atk.el].color:'#ffd9a0',age:0,life:.45,lw:5});for(const m of monsters){if(m.dead||m===except)continue;const c=center(m),d=Math.hypot(c.x-x,c.y-y);if(d<r+MON[m.type].r)hitMonster(m,{...atk,knock:60},(c.x-x)/(d||1),(c.y-y)/(d||1));}}
  function spawnProjectile(o,ang,atk,d){
    const ox=o.x+Math.cos(ang)*26,oy=o.y-20-(o.seat||0)+Math.sin(ang)*20;
    projectiles.push({kind:d.kind,x:ox,y:oy,vx:Math.cos(ang)*d.speed,vy:Math.sin(ang)*d.speed,sp:d.speed,age:0,life:(d.range||400)/d.speed,atk:{...atk,knock:d.kind==='bolt'?50:25},el:atk.el,pierce:d.pierce||0,splash:d.splash||0,hit:new Set(),gy:20+(o.seat||0)});
  }
  function resolveAttack(a,idx=0){
    const d=ATK[a.type],sk=SK[a.skill],el=HD.books.fire?'fire':a.elem;
    const atk={D:HD,mul:d.dmg*sk.mul*(a.empowered?1.6:1),el,owner:'hero',knock:d.knock,skill:a.skill};
    const ang=Math.atan2(a.aim.y,a.aim.x),ox=hero.x,oy=hero.y-18,col=el?EL[el].color:'#f4ead0';
    if(d.kind==='melee'){
      const whirl=!!sk.multi,range=d.range*(whirl?1.15:1)*(a.skill==='basic'?1.2:1);
      hitArc(ox,oy,ang,range,whirl?PI2:d.arc,{...atk,knock:d.knock*(a.type==='shield'&&a.skill!=='normal'?1.6:1)});
      fx.push(whirl?{kind:'ring',x:ox,y:oy,r0:range*.5,r1:range,color:col,age:0,life:.35,lw:6}:{kind:'arc',x:ox,y:oy,ang,r:range*.8,arc:a.type==='punch'?.8:a.type==='shield'?1.1:1.7,color:col,age:0,life:.22});
      if(a.type==='shield'){shake(3);fx.push({kind:'ring',x:ox+Math.cos(ang)*34,y:oy+Math.sin(ang)*34,r0:4,r1:30,color:'#f4dd9a',age:0,life:.25,lw:3});}
    }else if(d.kind==='thrust'){
      const n=sk.multi?3:1;for(let i=0;i<n;i++){const an=ang+(i-(n-1)/2)*.28;hitLine(ox,oy,an,d.range*(a.skill==='basic'?1.25:1),d.width,atk);fx.push({kind:'thrust',x:ox,y:oy,ang:an,len:d.range,color:col,age:0,life:.2});}
    }else{
      const n=sk.multi?3:1,o={x:hero.x,y:hero.y,seat:seatH()};for(let i=0;i<n;i++)spawnProjectile(o,ang+(i-(n-1)/2)*.16,atk,d);
      if(a.stance&&a.stance.dual&&a.type==='staff')spawnProjectile(o,ang+.08,{...atk,mul:atk.mul*.6},d);
      if(a.type==='crossbow')shake(3);
    }
    if(a.skill==='basic')burst(ox+Math.cos(ang)*30,oy+Math.sin(ang)*20,col,14,160);
    if(sk.nova&&idx===a.cycles-1){nova(hero.x,hero.y-12,sk.nova,{...atk,mul:atk.mul*(sk.finale||.9)},null);burst(hero.x,hero.y-20,col,26,220);shake(6);}
    if(a.skill==='normal'&&HD.fx.wave&&++hero.waveCount%4===0){nova(hero.x,hero.y-12,150,{...atk,mul:atk.mul*HD.fx.wave/100},null);burst(hero.x,hero.y-20,'#ffb070',20,200);}
  }
  function kill(m,owner){
    const M=MON[m.type];m.dead=true;m.deadAt=time;m.respawn=time+M.respawn;m.atk=null;m.burn=null;m.leap=null;
    floater(m.x,m.y-M.h-6,'+'+M.copper+' đồng','#f3d27a',13);burst(m.x,m.y-M.h*.4,'#e9dcb4',16);
    // Phần thưởng tính ngay trên máy người chơi (cùng luật, cùng chuỗi ngẫu nhiên với máy chủ): túi rơi xuống là mở liền,
    // lệnh gom lại gửi máy chủ sau; máy chủ tính lại y hệt để lưu
    const sack={x:m.x+(Math.random()-.5)*10,y:m.y+4,born:time,boss:!!M.boss};loot.push(sack);
    op({t:'kill',mon:m.type},M.boss?300:2500).then(r=>{sack.r=r;sack.openAt=time+.22;},()=>{sack.gone=time;});
    if(HD.fx.haste&&owner==='hero')hero.hasteUntil=time+4;
    if(M.boss){shake(10);message(svg('check')+'Đã hạ '+M.name);}
    window.GameUI?.refresh();
  }

  function openSack(sack,r){

    sack.open=time;const x=sack.x,y=sack.y-30;let dy=0;

  /* ---------- Đồng bộ với máy chủ: gom lệnh, gửi kèm cách sắp xếp đồ, nhận lại trạng thái chuẩn ---------- */
  /* Đồng bộ kiểu "hiện trước, lưu sau":
     - Mua, bán, gia cường, nhiệm vụ, thuê lính, cộng điểm: máy người chơi tính ngay bằng cùng luật + cùng chuỗi ngẫu nhiên với máy chủ,
       hiện kết quả liền, rồi gom lệnh gửi lên máy chủ. Máy chủ tính lại y hệt và lưu; trạng thái máy chủ luôn là chuẩn.
     - Lệnh chưa được máy chủ xác nhận nằm trong `pending`; mỗi lần nhận trạng thái mới thì áp lại các lệnh đó lên trên. */
  const sync={queue:[],busy:false,timer:null,at:0,fail:0},pending=[];
  function schedule(ms){const at=Date.now()+ms;if(sync.timer&&sync.at<=at)return;clearTimeout(sync.timer);sync.at=at;sync.timer=setTimeout(()=>{sync.timer=null;flush();},ms);}
  function queueOp(o,delay=0,ent=null){return new Promise((resolve,reject)=>{sync.queue.push({op:o,resolve,reject,ent});schedule(delay);});}
  function adopt(S){
    const before=JSON.parse(JSON.stringify(player));
    let R=Player.merge(S,before);
    if(pending.length){for(const p of pending){try{Player.applyOp(R,p.op,{},Date.now());}catch(e){}}R=Player.merge(R,before);}
    for(const k of Object.keys(player))if(!(k in R))delete player[k];
    Object.assign(player,R);refreshHD();syncMerc();window.GameUI?.refresh();
  }
  async function flush(){
    if(sync.busy){schedule(300);return false;}
    sync.busy=true;const batch=sync.queue.splice(0);nextSave=time+60;
    try{
      const r=await Net.call('play',{charId:session.charId,save:Player.serialize(player,hero,seen),ops:batch.map(b=>b.op)});
      sync.fail=0;
      for(const b of batch)if(b.ent){const i=pending.indexOf(b.ent);if(i>=0)pending.splice(i,1);}
      adopt(r.state);
      batch.forEach((b,i)=>{const res=r.results[i]||{ok:false,error:'LOI'};if(b.ent&&!res.ok)message(svg('close')+'Máy chủ không nhận lệnh, đã đồng bộ lại');b.resolve(res);});return true;
    }catch(e){
      sync.fail++;const keep=batch.filter(b=>(b.op.t==='kill'||b.ent)&&sync.fail<6&&e.message==='Failed to fetch');
      batch.filter(b=>!keep.includes(b)).forEach(b=>{if(b.ent){const i=pending.indexOf(b.ent);if(i>=0)pending.splice(i,1);}b.reject(e);});sync.queue.unshift(...keep);if(keep.length)schedule(3000*sync.fail);

  const op=(o,delay=400)=>{

  };

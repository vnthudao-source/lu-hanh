#lu-hanh .mk-bar input,#lu-hanh .mk-end input{width:64px;padding:6px;border-radius:8px;border:1px solid var(--line);background:#0b1a13;color:#f4ead0}
#lu-hanh .mk-rows{display:flex;flex-direction:column;gap:6px}
#lu-hanh .mk-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:#0f201980}
#lu-hanh .mk-row>div:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
#lu-hanh .mk-row small{font-size:11px;color:#a8b4a7}
#lu-hanh .mk-g{font-size:10px;padding:3px 6px;border-radius:6px;background:#0b1a13;color:#ecd29a}
#lu-hanh .mk-end{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#lu-hanh .mk-end button.sel{outline:2px solid var(--gold)}
#lu-hanh .mk-claim{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#0b1a13}
#lu-hanh .mk-claim>svg{width:30px;height:30px;color:#e7c46a}
#lu-hanh .mk-claim div{flex:1;display:flex;flex-direction:column;gap:4px}
#lu-hanh .mk-claim span{font-size:12px;color:#a8b4a7}
#lu-hanh #modalCard.mk-wait{cursor:progress}
#lu-hanh #modalCard.mk-wait .tile,#lu-hanh #modalCard.mk-wait .mk-row{opacity:.6}
@media(max-width:760px){#lu-hanh .mk-row{flex-wrap:wrap}
#lu-hanh .mk-end{flex-basis:100%}
}
#lu-hanh .qbar [data-mreload]{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
#lu-hanh .qbar [data-mreload] svg{width:15px;height:15px}
@media(max-width:760px){#lu-hanh [data-mtab] span{display:none}
#lu-hanh [data-mtab].on span{display:inline}
#lu-hanh [data-mtab]{padding:7px 9px}
}
#lu-hanh .dg{display:flex;flex-direction:column;gap:6px}
#lu-hanh .dg-row{display:flex;justify-content:space-between;gap:10px;padding:6px 9px;border:1px solid var(--line);border-radius:9px;background:#0b1a13;font-size:12px}
#lu-hanh .dg-row span{text-align:right;color:#c9d2c4}
#lu-hanh .dg-bad{font-style:normal;color:#ff9a8a}
#lu-hanh .dg-err{display:flex;flex-direction:column;gap:2px;padding:7px 9px;border:1px solid #ff9a8a55;border-radius:9px;background:#2a1512;font-size:12px}
#lu-hanh .dg-err small{color:#a8b4a7;word-break:break-all;font-size:10px}
#lu-hanh #dgClear{align-self:flex-start;margin-top:6px}
#lu-hanh .qgroup{display:flex;align-items:center;gap:6px;margin:8px 2px 0;font-size:12px;color:#d8c48f}
#lu-hanh .qgroup:first-child{margin-top:0}
#lu-hanh .qgroup svg{width:16px;height:16px}
#lu-hanh .qgroup span{margin-left:auto;color:#a8b4a7}
#lu-hanh .qgroup.qlock{color:#8c958a}
#lu-hanh .qrow.dim{opacity:.5}
#lu-hanh .qprog svg{width:14px;height:14px;vertical-align:-2px;margin-right:2px}
#lu-hanh .map-ic{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#ffffff0d;color:var(--gold);flex:none}
#lu-hanh .map-ic svg{width:22px;height:22px}
#lu-hanh .sel-bar .sel-info{flex:1 1 200px}
#lu-hanh .sel-bar>button{flex:0 0 auto}
@media(max-width:760px){#lu-hanh .sel-bar>button{flex:1 1 auto;justify-content:center}
}
#lu-hanh .skill.lockon{right:88px;bottom:228px;width:44px;height:44px;color:#c9d2c4}

#lu-hanh .av-tile .av-dot{width:34px;height:34px;border-radius:50%;border:5px solid #2a2622;box-shadow:0 0 0 1px #00000055 inset}

#lu-hanh .nap-grid .tile small{color:var(--muted);font-size:11px}

#lu-hanh .nap-info>div{display:flex;justify-content:space-between;gap:10px}

  // Tranh làng lúc hoàng hôn: núi xa, lũy tre, nhà sàn có đèn, người cha đội nón đi trên đường đất
  function paint(t){
    const w=cv.clientWidth||innerWidth,h=cv.clientHeight||innerHeight,d=Math.min(2,devicePixelRatio||1);
    if(cv.width!==Math.round(w*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d);}
    const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);
    if(bgImg&&bgImg.complete&&bgImg.naturalWidth){const s=Math.max(w/bgImg.naturalWidth,h/bgImg.naturalHeight),iw=bgImg.naturalWidth*s,ih=bgImg.naturalHeight*s;c.drawImage(bgImg,(w-iw)/2,(h-ih)/2,iw,ih);
      const v=c.createRadialGradient(w/2,h/2,Math.min(w,h)*.2,w/2,h/2,Math.max(w,h)*.75);v.addColorStop(0,'#00000022');v.addColorStop(1,'#000000aa');c.fillStyle=v;c.fillRect(0,0,w,h);return;}
    const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#1d2b3a');g.addColorStop(.45,'#7a4a3a');g.addColorStop(.62,'#e3a15a');g.addColorStop(.63,'#3d4a2e');g.addColorStop(1,'#141c12');c.fillStyle=g;c.fillRect(0,0,w,h);

  };

})();

    const j=JSON.stringify(save);if(j.length>45000)fail('DU_LIEU_QUA_LON');

  }
  // Dáng vẻ nhân vật (cho căn lều chọn nhân vật và chợ cho thuê): cấp, đồ đang mặc, hào quang sách, số lính, chỉ số

        const skew=Number.isFinite(+p.sentAt)&&+p.sentAt>0?now-(+p.sentAt):0;let prev=Math.max(+srv.lastAt||0,now-864e5);
        const results=dup?ops.map(()=>({ok:true,dup:true})):ops.map(op=>{
          let at=Number.isFinite(+(op&&op.at))?+op.at+skew:now;at=Math.min(now,Math.max(prev,at));prev=at;
          try{if(op&&op.lay)R=Player.relayout(R,op.lay);return {ok:true,...Player.applyOp(R,op,srv,at)};}catch(e){return {ok:false,error:String(e.message||e)};}
        });
        if(!dup&&ops.length&&C)R=Player.merge(R,C);
        if(bid&&!dup)srv.bids=[...(srv.bids||[]),bid].slice(-8);
        srv.lastAt=now;
        storeState(c,st,R,{pos:p.save&&p.save.pos,seen:p.save&&p.save.seen});
        return {state:R,results,savedAt:c.cap_nhat};
      });
    },
    save(p){return H.play({...p,ops:[]});},
    // Cho thuê / hủy cho thuê: đọc và ghi dòng nhân vật trong khóa (không ghi đè phần lưu mới hơn của lệnh khác)
    mercRegister(p){
      const a=auth(p.token),price=Math.max(0,Math.floor(Number(p.price)||0)),ruby=Math.max(0,Math.floor(Number(p.ruby)||0));
      if(!(price>=100)&&!(ruby>=1))fail('GIA_SAI');
      if(p.playing&&p.playing===p.charId)fail('DANG_CHOI');
      return A.lock(()=>{const c=ownChar(a,p.charId,'active');c.trang_thai='merc';c.gia_danh_thue=price;c.gia_hong_ngoc=ruby;c.cap_nhat=A.now();A.update('nhan_vat',c);return {char:charView(c)};});
    },
    mercCancel(p){const a=auth(p.token);return A.lock(()=>{const c=ownChar(a,p.charId,'merc');c.trang_thai='active';c.gia_danh_thue=0;c.gia_hong_ngoc=0;A.update('nhan_vat',c);return {char:charView(c)};});},
    mercList(p){
      const a=auth(p.token);
      return {list:where('nhan_vat','trang_thai','merc').filter(c=>c.tai_khoan!==a.id).map(c=>{let eq={};try{eq=(JSON.parse(c.luu||'{}').player||{}).equipment||{};}catch(e){}return {...charView(c),equipment:eq,look:lookOf(c)};})};
    },
    mercBuy(p){
      const a=auth(p.token);
      return A.lock(()=>{
        const b=ownChar(a,p.charId,'active'),t=find('nhan_vat','id',p.targetId);
        if(!t||t.trang_thai!=='merc'||t.tai_khoan===a.id)fail('LINH_KHONG_CON');
        let eq={};try{eq=(JSON.parse(t.luu||'{}').player||{}).equipment||{};}catch(e){}
        const price=Number(t.gia_danh_thue)||0,ruby=Number(t.gia_hong_ngoc)||0,fee=(cfg('phi_cho')||0)/100,st=stateOf(b);
        if(st.player.copper<price)fail('KHONG_DU_TIEN');if(st.player.rubies<ruby)fail('KHONG_DU_HONG_NGOC');if(st.player.mercs.length>=Player.MAX_MERC)fail('DU_LINH');
        Player.addMerc(st.player,{name:t.ten,gender:t.gioi_tinh,stats:charView(t).stats,equipment:eq,src:'player',from:t.id,cmd:10});
        st.player.copper-=price;st.player.rubies-=ruby;storeState(b,st,st.player);
        t.trang_thai='sold';t.nguoi_mua=p.charId;t.cap_nhat=A.now();A.update('nhan_vat',t);
        A.insert('cho',{id:'ch-'+A.uid(),loai:'linh',nguoi_ban:t.tai_khoan,nhan_vat_ban:t.id,vat_pham:'',gia:price,tien_nhan:Math.floor(price*(1-fee)),hong_ngoc:ruby,hong_ngoc_nhan:Math.floor(ruby*(1-fee)),trang_thai:'da_ban',nguoi_mua:p.charId,tao_luc:A.now(),ban_luc:A.now(),da_nhan:0});
        return {name:t.ten,price,ruby,state:st.player};
      });
    },
    marketList(p){
      const a=auth(p.token),rows=where('cho','trang_thai','mo').filter(r=>r.loai==='do');
      const view=r=>({id:r.id,item:JSON.parse(r.vat_pham||'null'),price:Number(r.gia),ruby:Number(r.hong_ngoc)||0,mine:r.nguoi_ban===a.id,seller:r.ten_nguoi_ban||''});
      return {open:rows.filter(r=>r.trang_thai==='mo').map(view),claim:claimSum(a.id).copper,claimRuby:claimSum(a.id).ruby};
    },
    // Ký gửi: lấy món đồ ra khỏi túi nhân vật trên máy chủ
    marketSell(p){
      const a=auth(p.token),price=Math.max(0,Math.floor(Number(p.price)||0)),ruby=Math.max(0,Math.floor(Number(p.ruby)||0));
      if(!(price>=1)&&!(ruby>=1))fail('GIA_SAI');
      return A.lock(()=>{
        const c=ownChar(a,p.charId,'active'),st=stateOf(c),i=p.uid?st.player.bag.findIndex(x=>x&&x.uid===String(p.uid)):Math.floor(Number(p.i)),it=st.player.bag[i];
        if(!it||!Player.tradeable(it))fail('VAT_PHAM_SAI');
        st.player.bag[i]=null;storeState(c,st,st.player);
        const fee=(cfg('phi_cho')||0)/100,r={id:'ch-'+A.uid(),loai:'do',nguoi_ban:a.id,nhan_vat_ban:c.id,ten_nguoi_ban:c.ten,vat_pham:JSON.stringify(it),gia:price,tien_nhan:Math.floor(price*(1-fee)),hong_ngoc:ruby,hong_ngoc_nhan:Math.floor(ruby*(1-fee)),trang_thai:'mo',nguoi_mua:'',tao_luc:A.now(),ban_luc:0,da_nhan:0};
        A.insert('cho',r);return {id:r.id,state:st.player};
      });
    },
    // Hủy ký gửi: trả món đồ về túi nhân vật đã ký gửi
    marketCancel(p){
      const a=auth(p.token);
      return A.lock(()=>{
        const r=find('cho','id',p.id);if(!r||r.nguoi_ban!==a.id||r.trang_thai!=='mo')fail('KHONG_HUY_DUOC');
        const c=ownChar(a,r.nhan_vat_ban,'active'),st=stateOf(c),it=Player.cleanItem(JSON.parse(r.vat_pham));
        if(it)Player.addItem(st.player,it);storeState(c,st,st.player);
        r.trang_thai='huy';A.update('cho',r);return {charId:c.id,state:st.player};
      });
    },
    marketBuy(p){
      const a=auth(p.token);
      return A.lock(()=>{
        const c=ownChar(a,p.charId,'active'),r=find('cho','id',p.id);
        if(!r||r.trang_thai!=='mo')fail('DA_BAN');if(r.nguoi_ban===a.id)fail('DO_CUA_MINH');
        const st=stateOf(c),price=Number(r.gia)||0,ruby=Number(r.hong_ngoc)||0,it=Player.cleanItem(JSON.parse(r.vat_pham));
        if(st.player.copper<price)fail('KHONG_DU_TIEN');if(st.player.rubies<ruby)fail('KHONG_DU_HONG_NGOC');if(!it)fail('VAT_PHAM_SAI');
        Player.addItem(st.player,it);st.player.copper-=price;st.player.rubies-=ruby;storeState(c,st,st.player);
        r.trang_thai='da_ban';r.nguoi_mua=p.charId;r.ban_luc=A.now();A.update('cho',r);
        return {item:it,price,ruby,state:st.player};
      });
    },
    // Nhận tiền bán hàng vào một nhân vật
    claim(p){
      const a=auth(p.token);
      return A.lock(()=>{
        const c=ownChar(a,p.charId,'active'),st=stateOf(c);let sum=0,rsum=0;
        for(const r of pendingClaims(a.id)){sum+=Number(r.tien_nhan||0);rsum+=Number(r.hong_ngoc_nhan||0);r.da_nhan=1;A.update('cho',r);}
        st.player.copper+=sum;st.player.rubies+=rsum;storeState(c,st,st.player);return {amount:sum,ruby:rsum,state:st.player};
      });
    }
  };
  return {handle(action,p){try{if(!H[action])fail('KHONG_CO_LENH');return {ok:true,...H[action](p||{})};}catch(e){return {ok:false,error:String(e.message||e)};}}};
}
</script>
<script>
/* ================= KẾT NỐI MÁY CHỦ =================
   Dán URL Web App của Apps Script vào LH_API. Để trống = chế độ ngoại tuyến (lưu trên trình duyệt này, dùng để thử). */
const LH_API=(typeof window!=='undefined'&&window.LH_API)||'';
function sha256(s){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=Array.from(new TextEncoder().encode(s)),l=b.length*8;b.push(0x80);while(b.length%64!==56)b.push(0);for(let i=7;i>=0;i--)b.push(Math.floor(l/2**(i*8))&255);
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const r=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
    for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
    let [a,bb,c,d,e,f,g,hh]=h;for(let i=0;i<64;i++){const t1=(hh+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&c)^(bb&c)))|0;hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;}
    h=h.map((v,i)=>(v+[a,bb,c,d,e,f,g,hh][i])|0);}
  return h.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
}
// Máy chủ giả trên trình duyệt: dùng chung LH_Core với Apps Script
const LocalServer=(()=>{
  const KEY='lh-offline-db';let db;
  const load=()=>{if(db)return db;try{db=JSON.parse(localStorage.getItem(KEY))||null;}catch(e){}return db=db||{tai_khoan:[],nhan_vat:[],cho:[]};};
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}};
  const core=LH_Core({
    rows:t=>load()[t],insert:(t,o)=>{load()[t].push(o);persist();},update:(t,o)=>{const a=load()[t],i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;persist();},
    mail:()=>{},devMail:true,hash:sha256,now:()=>Date.now(),uid:()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4),
    staticData:()=>GAME_DATA,lock:fn=>fn()
  });
  // đọc lại mỗi lệnh: game và Chợ phiên mở ở 2 thẻ vẫn dùng chung dữ liệu
  return {handle:(action,p)=>{db=null;return JSON.parse(JSON.stringify(core.handle(action,p)));}};
})();
const Net={
  online:!!LH_API,token:(()=>{try{return localStorage.getItem('lh-token')||'';}catch(e){return '';}})(),
  setToken(t){this.token=t||'';try{t?localStorage.setItem('lh-token',t):localStorage.removeItem('lh-token');}catch(e){}},
  async call(action,payload={}){
    const body={...payload,action,token:this.token};let r;
    // lệnh ghi mang mã riêng: gửi lại (rớt mạng, đổi GET/POST) máy chủ trả kết quả cũ, không làm hai lần
    if(!NET_SAFE.has(action)&&!body.rid)body.rid=Date.now().toString(36)+Math.random().toString(36).slice(2,10);
    if(!LH_API)r=LocalServer.handle(action,body);
    else{
      const json=JSON.stringify(body),small=json.length<1800;
      const parse=txt=>{try{return JSON.parse(txt);}catch(e){throw Error(/<html/i.test(txt)?'MAY_CHU_LOI':'Failed to fetch');}};
      // POST giống hệt bản 8.4 (không thêm tùy chọn nào: Safari thêm header là bị chặn CORS)
      // quá 25 giây (lệnh đọc) / 45 giây (lệnh ghi) không trả lời thì coi như rớt mạng (lệnh ghi có mã rid nên gửi lại không bị làm hai lần)
      const timed=pr=>Promise.race([pr,new Promise((_,no)=>setTimeout(()=>no(Error('Failed to fetch')),NET_SAFE.has(action)?25000:45000))]);
      const viaPost=async()=>parse(await timed(fetch(LH_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:json}).then(x=>x.text())));
      // Đường dự phòng: lệnh nhỏ gửi bằng GET (?p=\u{2026}) khi trình duyệt không POST được
      const viaGet=async()=>{const x=parse(await timed(fetch(LH_API+(LH_API.includes('?')?'&':'?')+'p='+encodeURIComponent(json)).then(x=>x.text())));if(x&&x.msg!==undefined&&action!=='ping')throw Error('POST_LOI');return x;};
      if(small&&Net.useGet){try{r=await viaGet();}catch(e){}}
      // mạng chập chờn (điện thoại chuyển 4G/Wi-Fi): lệnh đọc thử lại tối đa 2 lần, lệnh ghi (có mã rid) thử lại 1 lần
      for(let k=0;!r;k++){
        try{r=await viaPost();}
        catch(e){
          if(small&&(NET_SAFE.has(action)||action==='register'||action==='reset')&&netErr(e).message==='Failed to fetch'){try{r=await viaGet();Net.useGet=true;break;}catch(g){if(g.message==='POST_LOI')throw g;}}
          if(k>=2||e.message==='MAY_CHU_LOI'||(!NET_SAFE.has(action)&&(k>=1||!body.rid))){const d=await netDiag(netErr(e));LH_DIAG.net(action,d.message);throw d;}await new Promise(ok=>setTimeout(ok,900*(k+1)));
        }
      }
    }
    // cùng trình duyệt (game và Chợ phiên ở 2 thẻ) đã đăng nhập lại: dùng phiên mới rồi thử lại một lần
    if(!r.ok&&r.error==='DANG_NHAP_NOI_KHAC'&&!payload._retry){let st='';try{st=localStorage.getItem('lh-token')||'';}catch(e){}if(st&&st!==this.token){this.token=st;return this.call(action,{...payload,_retry:1});}}
    // phiên bị thay (đăng nhập ở thiết bị khác): báo cho game / Chợ phiên dừng lại
    if(!r.ok&&(r.error==='DANG_NHAP_NOI_KHAC'||(r.error==='PHIEN_HET_HAN'&&this.token))&&typeof window!=='undefined')window.dispatchEvent(new CustomEvent('lh-kicked',{detail:r.error}));
    Net.okOnce=true;LH_DIAG.net(action,r.ok?'':r.error);
    if(!r.ok){const e=Error(r.error||'LOI');throw e;}
    return r;
  }
};
/* Tiến trình chơi giữ trên máy (localStorage), mỗi nhân vật một khóa: {save, inflight:{bid,ops}, ops}
   Game ghi liên tục; chỉ gửi lên máy chủ ở các mốc lưu. Lần vào game / Chợ phiên sau, phần còn sót được gửi trước khi tải nhân vật. */
/* Nhật ký tình trạng (menu \u{2192} Tình trạng): lỗi trò chơi gần đây, lần gọi máy chủ gần nhất. Giữ trên máy để chụp gửi khi cần. */
const LH_DIAG=(()=>{
  const K='lh-diag',st={err:[],net:[]};try{Object.assign(st,JSON.parse(localStorage.getItem(K)||'{}'));}catch(e){}
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(st));}catch(e){}};
  const t=()=>new Date().toLocaleTimeString('vi-VN');
  return {
    error(e,where){const m=String(e&&e.message||e).slice(0,160),s=String(e&&e.stack||'').split('\n').slice(0,3).join(' | ').slice(0,300);st.err.unshift({t:t(),where,m,s});st.err=st.err.slice(0,8);save();},
    net(a,err){st.net.unshift({t:t(),a,err:err||''});st.net=st.net.slice(0,8);save();},
    get data(){return st;},clear(){st.err=[];st.net=[];save();}
  };
})();
if(typeof window!=='undefined'){window.addEventListener('error',e=>LH_DIAG.error(e.error||e.message,'trang'));window.addEventListener('unhandledrejection',e=>LH_DIAG.error(e.reason,'lệnh'));}
const LH_Local={
  key:id=>'lh-local-'+id,
  get(id){try{return JSON.parse(localStorage.getItem(this.key(id))||'null');}catch(e){return null;}},
  set(id,v){try{localStorage.setItem(this.key(id),JSON.stringify(v));return true;}catch(e){return false;}},
  clear(id){try{localStorage.removeItem(this.key(id));}catch(e){}},
  async push(id){
    const L=this.get(id);if(!L||!L.save)return false;
    let last=null;const fix=ops=>{if(ops.length&&!ops[0].lay&&last)ops[0]={...ops[0],lay:last};for(const o of ops)if(o.lay)last=o.lay;return ops;};
    try{
      do{
        if(!L.inflight)L.inflight={bid:Date.now().toString(36)+Math.random().toString(36).slice(2,8),ops:fix((L.ops||[]).splice(0,500))};
        else fix(L.inflight.ops);
        this.set(id,L);
        await Net.call('play',{charId:id,bid:L.inflight.bid,sentAt:Date.now(),save:L.save,ops:L.inflight.ops});
        L.inflight=null;this.set(id,L);
      }while((L.ops||[]).length);
    }catch(e){
      // nhân vật không còn / đang đi đánh thuê: bỏ phần lưu tạm; lỗi mạng: giữ lại, báo lỗi
      if(['KHONG_THAY_NHAN_VAT','SAI_TRANG_THAI'].includes(e.message)){this.clear(id);return false;}
      throw e;
    }
    this.clear(id);return true;
  }
};
const NET_ERR={CHAP_CHON:'Mạng chập chờn hoặc máy chủ trả lời chậm \u{b7} phần chơi vẫn giữ trên máy, sẽ gửi lại',CHUA_LUU:'Chưa lưu được phần chơi lên máy chủ, thử lại',DANG_CHOI:'Nhân vật đang chơi, không cho thuê được',PHIEN_HET_HAN:'Phiên đăng nhập hết hạn, hãy đăng nhập lại',TEN_DANG_NHAP_SAI:'Tên đăng nhập 3\u{2013}20 ký tự: chữ thường, số, dấu _',EMAIL_SAI:'Email không hợp lệ',MAT_KHAU_NGAN:'Mật khẩu tối thiểu 6 ký tự',TEN_DANG_NHAP_DA_CO:'Tên đăng nhập đã có người dùng',EMAIL_DA_CO:'Email đã được đăng ký',SAI_DANG_NHAP:'Sai tên đăng nhập hoặc mật khẩu',KHONG_THAY_EMAIL:'Không có tài khoản dùng email này',MA_SAI:'Mã khôi phục sai hoặc hết hạn',TEN_NHAN_VAT_SAI:'Tên nhân vật 2\u{2013}16 ký tự, chỉ chữ và số',DIEM_SAI:'Phải chia đủ số điểm',DU_NHAN_VAT:'Tài khoản đã đủ số nhân vật',TEN_DA_CO:'Tên nhân vật đã có người dùng',KHONG_THAY_NHAN_VAT:'Không tìm thấy nhân vật',SAI_TRANG_THAI:'Nhân vật đang đi đánh thuê',GIA_SAI:'Giá không hợp lệ',LINH_KHONG_CON:'Lính này đã có người thuê',DA_BAN:'Món này đã được bán',DO_CUA_MINH:'Đây là đồ bạn ký gửi',KHONG_HUY_DUOC:'Không hủy được',DU_LIEU_QUA_LON:'Dữ liệu lưu quá lớn',KHONG_DU_TIEN:'Nhân vật không đủ tiền',DU_LINH:'Nhân vật đã đủ lính',BAG_FULL:'Túi đồ đã đầy',VAT_PHAM_SAI:'Món đồ không hợp lệ',NHANH_QUA:'Quái chưa kịp hồi sinh',KHONG_DU_HONG_NGOC:'Nhân vật không đủ hồng ngọc',DANG_NHAP_NOI_KHAC:'Tài khoản vừa đăng nhập trên thiết bị khác',KHONG_CO_LENH:'Máy chủ chưa cập nhật bản mới',MAY_CHU_LOI:'Máy chủ Apps Script đang lỗi hoặc chưa mở quyền truy cập cho mọi người',POST_LOI:'Máy chủ có chạy nhưng không nhận lệnh: dán Code.gs mới rồi Triển khai \u{2192} Quản lý triển khai \u{2192} Sửa \u{2192} Phiên bản mới',KHONG_TRUY_CAP:'Trình duyệt này không gọi được máy chủ: trong Apps Script, Triển khai \u{2192} Quản lý triển khai \u{2192} Sửa, mục "Ai có quyền truy cập" chọn "Bất kỳ ai"'};
// Không gọi được máy chủ: thử GET (lệnh ping) để biết lỗi ở đâu
//  - GET được, POST không: Code.gs mới chưa được triển khai (hoặc doPost lỗi)

async function netDiag(e){
  if(e.message!=='Failed to fetch'||(typeof navigator!=='undefined'&&navigator.onLine===false))return e;
  // đã gọi được máy chủ trong phiên này: lỗi lúc này là mạng chập chờn / máy chủ chậm, không phải do cài đặt
  if(Net.okOnce)return Error('CHAP_CHON');
  try{const r=await fetch(LH_API+(LH_API.includes('?')?'&':'?')+'t='+Date.now());const j=JSON.parse(await r.text());return Error(j&&j.ok?'POST_LOI':'KHONG_TRUY_CAP');}
  catch(x){return Error('KHONG_TRUY_CAP');}
}
const NET_SAFE=new Set(['ping','data','login','chars','load','alive','marketList','mercList']);
// lỗi mạng mỗi trình duyệt báo một kiểu: Chrome "Failed to fetch", Safari "Load failed", Firefox "NetworkError\u{2026}"

<script>
/* ================= ẢNH TĨNH (Sheet "LH \u{b7} Hình ảnh", tab hinh_anh) =================
   Mỗi dòng: nhom + ma + link_anh. Dán link ảnh Google Drive (chia sẻ "Bất kỳ ai có đường liên kết") hoặc link ảnh bất kỳ.
   Ô link để trống, hoặc ảnh không tải được: dùng biểu tượng / hình vẽ mặc định của game.
   Thay ảnh bằng cách tải phiên bản mới lên cùng file Drive: chạy lamMoiAnh (Apps Script) để game tải lại ảnh đó.
   nhom: bieu_tuong (biểu tượng giao diện) \u{b7} vat_pham (đồ dùng) \u{b7} quai (quái vật) \u{b7} npc (dân làng) \u{b7} giao_dien (logo, nền, chân dung, túi đồ rơi) */
const LH_IMG=(()=>{
  const KEY='lh-img',MAP={},PIC={},ORIG={};
  // Link Drive (file/d/ID/view, open?id=ID, uc?id=ID\u{2026}) \u{2192} link ảnh xem trực tiếp
  function direct(u){
    u=String(u||'').trim();if(!u)return '';
    const m=/(?:drive|docs)\.google\.com/.test(u)&&(u.match(/\/d\/([\w-]{20,})/)||u.match(/[?&]id=([\w-]{20,})/));
    if(m)return 'https://lh3.googleusercontent.com/d/'+m[1];
    return /^https?:\/\/\S+$/.test(u)||/^data:image\//.test(u)?u:'';
  }
  const url=key=>MAP[key]||'';
  const attr=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  // Biểu tượng HTML: ảnh nếu có, lỗi thì quay về biểu tượng mặc định
  function icon(key,fb,color){
    const s=`<svg class="icon" aria-hidden="true"${color?` style="color:${color}"`:''}><use href="#i-${fb}"/></svg>`,u=url(key);
    // ảnh nằm trong khung <svg class="icon"> để giữ đúng cỡ biểu tượng ở mọi chỗ
    return u?`<svg class="icon pic" viewBox="0 0 32 32" aria-hidden="true"${color?` style="color:${color}"`:''}><image href="${attr(u)}" width="32" height="32" preserveAspectRatio="xMidYMid meet" onerror="const e=document.createElementNS('http://www.w3.org/2000/svg','use');e.setAttribute('href','#i-${fb}');this.replaceWith(e)"/></svg>`:s;
  }
  // Ảnh cho canvas (quái, NPC, túi đồ, vũ khí cầm tay): chỉ trả về khi đã tải xong
  function pic(key){const p=PIC[key];return p&&p.complete&&p.naturalWidth>0?p:null;}
  // Biểu tượng giao diện: thay nội dung <symbol id="i-\u{2026}"> bằng ảnh, mọi chỗ dùng biểu tượng đó tự đổi theo
  function applyIcons(){
    if(typeof document==='undefined')return;
    for(const [id,html] of Object.entries(ORIG)){const s=document.getElementById('i-'+id);if(s&&!MAP['bieu_tuong:'+id]){s.innerHTML=html;delete ORIG[id];}}
    for(const [k,u] of Object.entries(MAP)){
      if(!k.startsWith('bieu_tuong:'))continue;const id=k.slice(11),s=document.getElementById('i-'+id);if(!s)continue;
      if(!(id in ORIG))ORIG[id]=s.innerHTML;
      const vb=(s.getAttribute('viewBox')||'0 0 32 32').split(/\s+/).map(Number);
      // thử tải trước: lỗi thì giữ biểu tượng cũ
      const im=new Image();im.referrerPolicy='no-referrer';im.onload=()=>{s.innerHTML=`<image href="${attr(u)}" x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" preserveAspectRatio="xMidYMid meet"/>`;};im.src=u;
    }
  }
  function load(map){
    for(const k of Object.keys(MAP))delete MAP[k];Object.assign(MAP,map);
    for(const [k,u] of Object.entries(MAP)){if(/^bieu_tuong:/.test(k)||(PIC[k]&&PIC[k].src===u))continue;const im=new Image();im.referrerPolicy='no-referrer';im.src=u;PIC[k]=im;}
    applyIcons();
  }
  // rows: [{nhom, ma, link_anh}] từ máy chủ
  function set(rows){
    const map={};for(const r of rows||[]){let u=direct(r.link_anh);const k=String(r.nhom||'').trim()+':'+String(r.ma||'').trim();
      // v: phiên bản ảnh (giờ sửa file trên Drive, hàm lamMoiAnh ghi vào cột phien_ban) \u{2192} thay file cùng link thì trình duyệt vẫn tải ảnh mới
      if(u&&r.v&&!/^data:/.test(u))u+=(u.includes('?')?'&':'?')+'v='+encodeURIComponent(String(r.v));
      if(u&&k.length>2)map[k]=u;}
    try{localStorage.setItem(KEY,JSON.stringify(map));}catch(e){}
    load(map);
  }
  try{const c=JSON.parse(localStorage.getItem(KEY)||'{}');if(c&&typeof c==='object')load(c);}catch(e){}
  return {set,url,icon,pic,direct,get map(){return {...MAP};}};
})();
</script>
<script>
/* ================= HÌNH VẼ THEO BẢN ĐỒ (gói bản đồ tải khi cần) =================
   Mỗi bản đồ ngoài Thanh Mộc là một gói dist/maps/<mã>.js: dữ liệu bản đồ + hình vẽ riêng (nền, cây đá, quái, hiệu ứng trời).
   Gói gọi LH_PACK(mã, dữ liệu, hàm vẽ). Hàm vẽ nhận bộ bút K (ell, line, poly, rr, shade\u{2026}) và trả về:
     theme:{ten:{tile(c,x,y,v,n,T,G), over?(c,v)}}  \u{b7} obj:{loai(c,o,t)}  \u{b7} mon:{ma_quai(c,m,M,s)}  \u{b7} sky:{ten(c,s)}  \u{b7} ring:{ma_quai:'#màu'}
   File game chính chỉ giữ khung này (vài trăm byte), nên thêm bản đồ không làm game nặng thêm. */
const LH_ART=(()=>{
  const PI2=Math.PI*2,memo={};
  const shade=(hex,f)=>{const k=hex+f;if(memo[k])return memo[k];const m=/^#([0-9a-f]{6})/i.exec(hex||'');if(!m)return hex;const n=parseInt(m[1],16),ch=i=>{const v=(n>>i)&255;return Math.round(f<0?v*(1+f):v+(255-v)*f);};return memo[k]='#'+[16,8,0].map(i=>ch(i).toString(16).padStart(2,'0')).join('');};
  const K={PI2,shade,
    ell(c,x,y,rx,ry,col,rot=0){c.fillStyle=col;c.beginPath();c.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),rot,0,PI2);c.fill();},
    line(c,p,col,w){c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.stroke();},
    poly(c,p,col){c.fillStyle=col;c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();c.fill();},
    rr(c,x,y,w,h,r,col){c.fillStyle=col;c.beginPath();c.roundRect(x,y,w,h,r);c.fill();},
    // nhiễu mượt theo ô (đổi màu nền dần dần, không thành ô bàn cờ)
    noise(x,y,sc=4,s=0){const fx=x/sc,fy=y/sc,ix=Math.floor(fx),iy=Math.floor(fy),u=fx-ix,v=fy-iy,a=K.hash(ix,iy,s),b=K.hash(ix+1,iy,s),c=K.hash(ix,iy+1,s),d=K.hash(ix+1,iy+1,s),su=u*u*(3-2*u),sv=v*v*(3-2*v);return a+(b-a)*su+(c-a)*sv+(a-b-c+d)*su*sv;},
    // trộn hai màu #rrggbb theo tỉ lệ k (0..1)
    mix(a,b,k){const p=parseInt(a.slice(1,7),16),q=parseInt(b.slice(1,7),16),f=i=>Math.round(((p>>i)&255)*(1-k)+((q>>i)&255)*k);return '#'+[16,8,0].map(i=>f(i).toString(16).padStart(2,'0')).join('');},
    // vẽ mép mềm cho vùng ô loại v (hồ, cỏ, băng\u{2026}): mỗi ô một hình tròn bán kính r ô, chồng lên nhau thành bờ cong
    blob(c,G,w,h,T,v,r,col,dy=0){c.fillStyle=col;c.beginPath();for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(G(x,y)===v){c.moveTo((x+.5+r)*T,(y+.5+dy)*T);c.arc((x+.5)*T,(y+.5+dy)*T,r*T,0,PI2);}c.fill();},
    // số giả ngẫu nhiên cố định theo tọa độ (nền không nhấp nháy khi vẽ lại)
    hash(x,y,s=0){let h=(x*374761393+y*668265263+s*1442695041)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)/4294967296;}
  };
  const A={theme:{},obj:{},mon:{},sky:{},ring:{},K,packs:{}};
  // nạp phần hình vẽ của một gói
  A.add=(id,fn)=>{if(A.packs[id]||typeof fn!=='function')return;A.packs[id]=true;const r=fn(K)||{};for(const k of ['theme','obj','mon','sky','ring'])Object.assign(A[k],r[k]||{});};
  return A;
})();
// Gói bản đồ tự đăng ký khi tải xong
window.LH_MAPS=window.LH_MAPS||{};
window.LH_PACK=(id,def,art)=>{window.LH_MAPS[id]=def;LH_ART.add(id,art);};
</script>
<script>
/* ================= BỘ SINH HÌNH THEO THAM SỐ (dùng cho các gói bản đồ từ v10.2) =================
   Gói bản đồ mới không vẽ tay từng con quái, từng ô nền nữa: chỉ khai báo tham số (dáng, màu, cỡ, chi tiết),
   bộ sinh ở đây vẽ ra. Một gói bản đồ chỉ còn vài trăm byte hình vẽ, tải rất nhanh.
     LH_ART.gen({ theme:{ten:{...}}, obj:{ten:{...}}, mon:{ma:{...}}, npc:{vai:{...}}, sky:{ten:{...}} })
   Dáng quái (body): quad (thú 4 chân) \u{b7} bird (chim) \u{b7} snake (rắn) \u{b7} human (người, ma, lính) \u{b7} blob (hồn, nhầy) \u{b7} bug (cua, bọ) \u{b7} golem (đá chồng) \u{b7} dragon (rồng)
   Vai NPC vẽ bằng bộ phận có sẵn của game (đầu, nón, khăn, chân\u{2026}) do game truyền vào H. */
(()=>{
  const A=LH_ART,K=A.K,{ell,line,poly,rr,shade,hash,mix,noise,PI2}=K;
  A.npc=A.npc||{};
  // ---------- nền ----------
  // spec: {g:[màu1,màu2] cỏ/đất \u{b7} d:'grass|bamboo|moss|ash|ice|brick|cloud|bone' chi tiết \u{b7} r:[mặt trên, vách, tối] đá \u{b7} w:[nông,sâu] nước \u{b7} p:màu đường \u{b7} s:màu ô đặc biệt (6) \u{b7} sd:màu ô khô (5)}
  function theme(S){
    const g0=S.g[0],g1=S.g[1],R=S.r||['#8a8a86','#5e5e5a','#3e3e3a'],P=S.p||mix(g1,'#7a5a3a',.6),SD=S.sd||mix(g0,'#b89a5a',.45),SP=S.s||mix(g1,'#ff8040',.5);
    const detail={
      grass(c,X,Y,h){for(let i=0;i<3;i++){const px=X+8+hash(X,Y,i)*32,py=Y+10+hash(X,Y,i+5)*30;line(c,[px,py,px+2,py-7],shade(g1,-.2),1.2);}},
      bamboo(c,X,Y,h){if(h>.55)for(let i=0;i<2;i++){const px=X+10+hash(X,Y,i)*28,py=Y+12+hash(X,Y,i+5)*26;line(c,[px,py,px+5,py-9],shade(g1,-.3),1.3);line(c,[px+5,py-9,px+2,py-15],shade(g1,-.3),1.3);}},
      moss(c,X,Y,h){ell(c,X+12+h*20,Y+14+hash(X,Y,2)*18,7+h*5,4,shade(g1,.12));if(h>.7)ell(c,X+30,Y+34,4,2.5,shade(g0,-.18));},
      ash(c,X,Y,h){c.fillStyle=shade(g1,-.35);for(let i=0;i<3;i++)c.fillRect(X+hash(X,Y,i)*44,Y+hash(X,Y,i+7)*44,2,2);if(h>.8)ell(c,X+24,Y+26,9,3,'#ff6a2a22');},
      ice(c,X,Y,h){if(h>.6){c.strokeStyle='#ffffff88';c.lineWidth=1;c.beginPath();c.moveTo(X+8,Y+14);c.lineTo(X+22,Y+20);c.lineTo(X+38,Y+12);c.stroke();}},
      brick(c,X,Y,h){c.strokeStyle=shade(g1,-.18);c.lineWidth=1;c.strokeRect(X+.5,Y+.5,T0-1,T0-1);c.beginPath();c.moveTo(X,Y+T0/2);c.lineTo(X+T0,Y+T0/2);c.moveTo(X+T0/2,Y);c.lineTo(X+T0/2,Y+T0/2);c.stroke();},
      cloud(c,X,Y,h){ell(c,X+14+h*20,Y+20+hash(X,Y,3)*10,12,5,'#ffffff55');},
      bone(c,X,Y,h){if(h>.78){line(c,[X+10,Y+30,X+24,Y+24],'#d8d2c4',2);ell(c,X+10,Y+30,2.5,2.5,'#d8d2c4');ell(c,X+24,Y+24,2.5,2.5,'#d8d2c4');}}
    }[S.d||'grass'];
    let T0=48;
    function tile(c,x,y,v,n,T,G){
      T0=T;const X=x*T,Y=y*T,h=hash(x,y);
      if(v===1){ // chắn: mặt trên, mép sáng trái / tối phải, vách đứng dưới
        c.fillStyle=mix(R[0],shade(R[0],-.18),noise(x,y,4,2));c.fillRect(X,Y,T,T);
        if(h>.7){ell(c,X+12+h*20,Y+14+hash(x,y,9)*16,7,4,shade(R[0],.18));}
        if(G(x-1,y)!==1){c.fillStyle=shade(R[0],.25);c.fillRect(X,Y,4,T);}
        if(G(x+1,y)!==1){c.fillStyle=R[2];c.fillRect(X+T-4,Y,4,T);}
        if(G(x,y-1)!==1){c.fillStyle=shade(R[0],.35);c.fillRect(X,Y,T,3);}
        if(G(x,y+1)!==1){const top=Y+T-24;c.fillStyle=R[1];c.beginPath();c.moveTo(X,Y+T);for(let k=0;k<=6;k++)c.lineTo(X+k*T/6,top+hash(x*6+k,y,22)*7);c.lineTo(X+T,Y+T);c.fill();c.fillStyle=R[2];for(let k=0;k<3;k++)c.fillRect(X+6+k*15+(h*5|0),top+8,2,15);ell(c,X+T/2,Y+T+3,T*.55,5,'#00000022');}
        return;
      }
      const k=noise(x,y,5,1);c.fillStyle=mix(g0,g1,k);c.fillRect(X,Y,T,T);
      if(v===4){c.fillStyle=mix(P,shade(P,-.12),hash(x,y,4));c.fillRect(X,Y,T,T);for(let i=0;i<3;i++)ell(c,X+6+hash(x,y,i)*36,Y+6+hash(x,y,i+9)*36,2,1.4,shade(P,-.3));return;}
      if(v===5){c.fillStyle=mix(SD,shade(SD,-.1),k);c.fillRect(X,Y,T,T);}
      if(v===6){c.fillStyle=mix(SP,shade(SP,.15),hash(x,y,6));c.fillRect(X,Y,T,T);if(S.sg){c.save();c.globalAlpha=.35+hash(x,y,7)*.3;ell(c,X+T/2,Y+T/2,T*.55,T*.4,S.sg);c.restore();}return;}
      detail(c,X,Y,h);
    }
    function over(c,def,T,G){const {w,h}=def,W=S.w||['#7fb4c9','#4f8aa5'];K.blob(c,G,w,h,T,2,.95,W[0]);K.blob(c,G,w,h,T,2,.7,W[1]);
      for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(G(x,y)===2&&hash(x,y,10)>.7){c.fillStyle='#ffffff66';c.fillRect(x*T+8,y*T+10,14,2);}}
    return {tile,over,ripple:S.ripple||'#ffffff55'};
  }

  function shadeL(hex,k){const n=parseInt(String(hex).slice(1,7),16);if(!Number.isFinite(n))return hex;let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(k<0?v*(1+k):v+(255-v)*k)));return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');}
  const P=(c,pts,fill,stroke,lw)=>{c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath();if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||1;c.stroke();}};
  const E=(c,x,y,rx,ry,fill)=>{c.fillStyle=fill;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill();};

  /* ---------- Ô cánh: áo choàng / cờ / cánh (vẽ sau lưng, trước khi vẽ thân) ---------- */
  function back(c,L,t,moving){

      c.strokeStyle=L.trim;c.lineWidth=1.2;c.stroke();E(c,-19,-52+fl*.5,3.2,3.2,L.alt);E(c,-19,-52+fl*.5,1.6,1.6,L.trim);
    }

      const f=Math.sin(t*4)*.12,col=L.main,W=L.wing||'feather';c.save();c.translate(-4,-22);
      for(const s of [1,.8]){c.save();c.rotate(-.1+f*s);c.scale(s,s);c.globalAlpha=s<1?.7:.92;c.fillStyle=col;c.strokeStyle=L.trim;c.lineWidth=1;
        if(W==='bat'){c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-18,-34,-42,-30);c.lineTo(-34,-16);c.lineTo(-44,-4);c.lineTo(-30,0);c.lineTo(-34,12);c.lineTo(-18,4);c.lineTo(-10,10);c.closePath();c.fill();c.stroke();
          c.strokeStyle=shadeL(col,-.35);for(const [x,y] of [[-34,-16],[-30,0],[-18,4]]){c.beginPath();c.moveTo(-2,-2);c.lineTo(x,y);c.stroke();}}

          for(const [x,y,x2,y2] of [[-14,-20,-30,-6],[-24,-26,-40,-12],[-34,-27,-46,-18]]){c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.stroke();E(c,x2,y2,2.2,2.2,col);}

          c.restore();c.strokeStyle=shadeL(col,.4);for(let i=1;i<4;i++){c.beginPath();c.moveTo(-4,2);c.lineTo(-12-i*8,-14+i*5);c.stroke();}}
        else{c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-26,-40,-40,-12);c.quadraticCurveTo(-28,-12,-22,4);c.quadraticCurveTo(-12,0,0,8);c.closePath();c.fill();c.stroke();
          c.strokeStyle=shadeL(col,-.25);for(let i=1;i<4;i++){c.beginPath();c.moveTo(-4,2);c.lineTo(-12-i*8,-14+i*5);c.stroke();}}

    }

  /* ---------- Áo choàng: vạt trước vắt qua vai (vẽ sau thân) ---------- */
  function front(c,L){if(L.kind!=='cloak')return;P(c,[-9,-26,7,-26,4,-21,-6,-21],L.main);E(c,0,-23,2.2,2.2,L.trim);}

  /* ---------- Áo, quần, găng, giày: màu + hoa văn theo kiểu ---------- */

  /* ---------- Hiệu ứng đồ thần ---------- */
  function mythAura(c,list,t){

      const [a,b]=FX[L.fx]||FX.gold;c.save();

  /* ---------- Ảnh biểu tượng (túi đồ) cho đồ mặc: vẽ riêng từng món, giữa khung ---------- */
  function iconWear(c,L,t=0){

  // số lần hạ một loài quái trong một lượt hồi sinh: bãi quái lớn có nhiều con cùng loài (Sheet cau_hinh gioi_han_ha_quai)
  const KILL_LIMIT=id=>MON[id].boss?1:num(CFG.gioi_han_ha_quai,16);
  const PREDICT=new Set(['kill','buy','sell','enh','enhSk','qa','qt','hire','dismiss','pt','petOff','av','fuse']);

    const t=op&&op.t;if(PREDICT.has(t))rng=seqRng(s);

      srv.kills=srv.kills||{};const win=Math.max(5,M.respawn)*1000,log=(srv.kills[op.mon]||[]).filter(x=>now-x<win);
      if(log.length>=KILL_LIMIT(op.mon))throw Error('NHANH_QUA');log.push(now);srv.kills[op.mon]=log;
      const D=derive(s),F=D.fx||{},copper=Math.round(M.copper*(1+num(F.coinUp)/100)),exp=Math.round(M.exp*(1+num(F.expUp)/100));

      const drop=rollDrop(op.mon,rng,1+num(F.luck)/100),items=[],lost=[];s.rubies+=drop.rubies;

      const done=questProgress(s,op.mon).filter(id=>s.quests.active[id]>=QUESTS[id].count);
      let bonus=0;const k=s.flags.kills;if(!s.flags.hunted&&k.deer&&k.lion&&k.elephant&&k.croc){s.flags.hunted=true;s.copper+=100;bonus=100;}
      const up=gainExp(s,exp);
      // Sách Ma công: tỉ lệ thu phục quái (không áp dụng cho trùm), tăng theo Mệnh lệnh và cấp sách
      let pet=null;if(!M.boss&&(s.pets=s.pets||[]).length<petMax()){if(D.bfx.demon>=0){const ch=num(CFG.ma_ti_le_goc,2)+D.main.cmd*num(CFG.ma_phan_van_moi_menh_lenh,20)/100+num(CFG.sach_ti_le_cap,1)*D.bfx.demon;if(rng()*100<ch){pet={pid:'pet-'+rnd36(rng),type:op.mon,hpFrac:1};s.pets.push(pet);}}}
      return {mon:op.mon,copper,rubies:drop.rubies,items,lost,done,bonus,exp,up,level:s.level,pet};
    }
    if(t==='buy'){const i=buy(s,String(op.type),op.q==='g'||op.q==='p'?op.q:'n',rng,op.shop?String(op.shop):undefined);return {i,item:s.bag[i]};}
    // Diện mạo (NPC Thợ truyền thần ở thành trì): mua rồi đổi; diện mạo giá 0 ai cũng đổi được
    if(t==='av'){const id=String(op.id||'');if(!id){s.avatar='';return {id};}const V=AVATARS[id];if(!V)throw Error('AV');if(V.gender&&V.gender!==s.gender)throw Error('GENDER');s.avatars=s.avatars||[];
      if(!s.avatars.includes(id)&&(V.price||V.ruby)){if(s.copper<V.price)throw Error('MONEY');if(s.rubies<V.ruby)throw Error('RUBY');s.copper-=V.price;s.rubies-=V.ruby;s.avatars.push(id);}
      s.avatar=id;return {id,bought:!!(V.price||V.ruby)};}
    if(t==='sell'){const i=Math.floor(op.i),it=s.bag[i];const v=sell(s,i);return {v,item:it};}
    if(t==='fuse'){const mi=Math.floor(op.m),xi=Math.floor(op.x);if(!(mi>=0&&mi<BAG_SIZE&&xi>=0&&xi<BAG_SIZE))throw Error('SLOT');return fuse(s,mi,xi,rng);}
    if(t==='enh'){const bag=op.where==='bag',key=bag?Math.floor(op.key):String(op.key);if(!bag&&!slots.includes(key))throw Error('SLOT');const r=enhance(s,{where:bag?'bag':'equipment',key},rng,op.shop);return {...r,item:bag?s.bag[key]:s.equipment[key]};}

    if(t==='qt'){return questTurnIn(s,String(op.id),rng);}
    if(t==='hire'){const m=hireNpc(s,String(op.id),rng);return {mid:m.mid,name:m.name};}

  }

  // 4 kỹ năng mặc định: đánh thường \u{b7} combo (3 đòn) \u{b7} diện rộng \u{b7} liên hoàn (5 đòn + nổ)
  const SK={normal:{mul:1,dur:1,cycles:1},basic:{mul:.85,dur:.7,cycles:3},intermediate:{mul:1.15,dur:1.2,cycles:1,multi:3,nova:130},advanced:{mul:.75,dur:.55,cycles:5,nova:160,finale:2}};

  let lastAllyKey='',safe=World.isSafe(hero.x,hero.y),HD=Player.derive(player,{safe}),hdAt=-1,bridgeSide=[],travelling=false;
  const ground=document.createElement('canvas'),miniGround=document.createElement('canvas');
  hero.name=player.name;
  const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,seg=(p,a,b)=>clamp((p-a)/(b-a),0,1),E=t=>t<.5?2*t*t:1-((-2*t+2)**2)/2;
  const svg=id=>`<svg class="icon"><use href="#i-${id}"/></svg>`;
  // Thông báo ngắn: icon + vài chữ/số

  // Ảnh tĩnh (Sheet hinh_anh) vẽ thay hình mặc định: chân chạm gốc, quay mặt sang phải
  function drawPic(c,im,h,bob){const w=h*im.naturalWidth/im.naturalHeight;c.drawImage(im,-w/2,-h+bob,w,h);}

  /* ---------- Nền: đường đất, sân gạch, ruộng lúa, ao sen ---------- */

      else if(v===4){c.strokeStyle='#9c7f5233';c.lineWidth=2;c.beginPath();c.moveTo(x*T,y*T+16);c.lineTo(x*T+T,y*T+16);c.moveTo(x*T,y*T+34);c.lineTo(x*T+T,y*T+34);c.stroke();if(n===2){c.fillStyle='#9c8256';c.fillRect(x*T+30,y*T+9,4,3);}}

        c.strokeStyle='#4f7a36';c.lineWidth=1.6;for(let ry=6;ry<T;ry+=10)for(let rx=5;rx<T;rx+=9){c.beginPath();c.moveTo(x*T+rx,y*T+ry+5);c.lineTo(x*T+rx-2,y*T+ry);c.moveTo(x*T+rx,y*T+ry+5);c.lineTo(x*T+rx+2,y*T+ry);c.stroke();}
        c.fillStyle='#9c8a5c';if(x%3===0)c.fillRect(x*T,y*T,4,T);if(y%2===1)c.fillRect(x*T,y*T+T-4,T,4);
      }
      else if(east){c.strokeStyle='#86844f88';c.lineWidth=1.4;for(let k=0;k<3;k++){const gx=x*T+(n*7+k*13)%44,gy=y*T+(n*11+k*17)%44;c.beginPath();c.moveTo(gx,gy+6);c.lineTo(gx+2,gy);c.moveTo(gx+3,gy+6);c.lineTo(gx+6,gy+1);c.stroke();}}
      else{
        c.strokeStyle='#6a8a5288';c.lineWidth=1.2;for(let k=0;k<3;k++){const gx=x*T+(n*7+k*13)%44,gy=y*T+(n*11+k*17)%42;c.beginPath();c.moveTo(gx,gy+5);c.lineTo(gx+1.5,gy);c.moveTo(gx+3,gy+5);c.lineTo(gx+5,gy+1);c.stroke();}
        if(v===0&&(x*13+y*7)%17===0){const cols=['#f2d16b','#e98aa0','#f4f0e6'];for(let k=0;k<4;k++){const fx2=x*T+10+(k*11+n*5)%28,fy2=y*T+12+(k*7+n*3)%24;c.fillStyle=cols[(k+n)%3];c.beginPath();c.arc(fx2,fy2,2,0,PI2);c.fill();}}

        c.strokeStyle='#97513a';c.lineWidth=1.5;for(let gx=sx0;gx<=sx0+sw;gx+=24){c.beginPath();c.moveTo(gx,sy0);c.lineTo(gx,sy0+sh);c.stroke();}for(let gy=sy0;gy<=sy0+sh;gy+=24){c.beginPath();c.moveTo(sx0,gy);c.lineTo(sx0+sw,gy);c.stroke();}

  /* ---------- Cây: tre, cau, chuối, đa ---------- */
  function tree(o){

    if(v<=2){ // khóm tre
      for(let k=0;k<7;k++){const bx=x-14+k*4.5,h=70+((o.seed*(k+3))%28),lean=(k-3)*3+sway;ctx.strokeStyle=k%2?'#7d9a3c':'#8aa846';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bx,y+2);ctx.quadraticCurveTo(bx+lean*.3,y-h*.5,bx+lean,y-h);ctx.stroke();ctx.fillStyle='#5f7a2c';for(let s=1;s<5;s++){const t2=s/5;ctx.fillRect(bx+lean*t2*t2-2,y-h*t2,4,1.5);}
        for(let l=0;l<4;l++){const lx=bx+lean+(l-1.5)*6,ly=y-h+6+l*5;ell(ctx,lx,ly,8,2.4,l%2?'#6f9140':'#86ad4c',(l%2?.5:-.5));}}

    }

  /* ---------- NPC trang phục Việt xưa + hoạt động lặp lại ---------- */
  /* ---------- Bộ vẽ người dùng chung (nhân vật, lính, dân làng): viền đậm, đổ bóng, mặt có mắt mũi miệng ---------- */
  const shadeMemo={};
  function shade(hex,f){const k=hex+f;if(shadeMemo[k])return shadeMemo[k];const m=/^#([0-9a-f]{6})/i.exec(hex||'');if(!m)return hex;const n=parseInt(m[1],16),ch=i=>{const v=(n>>i)&255;return Math.round(f<0?v*(1+f):v+(255-v)*f);};return shadeMemo[k]='#'+[16,8,0].map(i=>ch(i).toString(16).padStart(2,'0')).join('');}
  // nét có viền: vẽ lớp tối dày hơn ở dưới
  function oline(c,pts,col,w){line(c,pts,shade(col,-.45),w+2);line(c,pts,col,w);}
  // khối thân: tô màu, bóng tối nửa sau, viền

  // mặt nhìn nghiêng sang phải: cổ, tai, mắt trắng + con ngươi, lông mày, mũi, miệng, má hồng
  function face(c,o){
    const skin=o.skin,dk=shade(skin,-.22);
    c.fillStyle=dk;c.fillRect(-3.5,-27.5,7,4.5);
    c.fillStyle=skin;c.strokeStyle=shade(skin,-.5);c.lineWidth=1.1;c.beginPath();c.ellipse(0,-35,10.5,11,0,0,PI2);c.fill();c.stroke();
    c.save();c.globalAlpha=.28;c.fillStyle=dk;c.beginPath();c.ellipse(-4.5,-33,5.5,8,0,0,PI2);c.fill();c.restore();

  /* ---------- Sát thương: dao động min-max, chính xác, x2/x3, hoàn hảo/huyền thoại/thần thoại, sát thương chuẩn ---------- */
  function rollHit(D,mul,owner){
    const S=D.tot,lo=S.dmgMin,hi=Math.max(lo,S.dmgMax);
    let v=Math.random()*100<S.acc?hi:lo+Math.random()*(hi-lo);
    v*=mul*D.dmgMul*(1+(HD.fx.aura||0)/100);
    let tag='',color='#fff1c4',size=14;
    const c=Math.random()*100;
    if(c<S.crit3){v*=3;tag='x3';color='#ff9a5a';size=18;}else if(c<S.crit3+S.crit2){v*=2;tag='x2';color='#ffd27a';size=16;}
    const q=Math.random()*100;
    if(q<S.mythDmg){v*=3;tag='Thần thoại';color=rarColor('m');size=18;}
    else if(q<S.mythDmg+S.legDmg){v*=2;tag='Huyền thoại';color=rarColor('l');size=17;}
    else if(q<S.mythDmg+S.legDmg+S.perfDmg){v*=1.5;tag='Hoàn hảo';color=rarColor('p');size=16;}
    if(owner==='hero'&&hero.counter){v*=1+(HD.fx.counter||0)/100;hero.counter=false;tag=tag||'Phản công';}
    if(owner==='hero'&&dbfOn('weak'))v*=.6;
    if(owner==='hero'&&HD.fx.rage&&player.hp<HD.tot.hp*.3){v*=1+HD.fx.rage/100;tag=tag||'Cuồng nộ';} // Cuồng nộ: dưới 30% máu
    return {dmg:Math.max(1,Math.round(v+S.trueDmg)),tag,color,size};
  }
  function hitMonster(m,atk,dx,dy,opt={}){
    if(m.dead)return 0;const M=MON[m.type];
    const r=atk.abs?{dmg:Math.max(1,Math.round(atk.abs)),tag:'',color:atk.color||'#fff1c4',size:13}:rollHit(atk.D,atk.mul,atk.owner);
    let dmg=r.dmg;const f=atk.owner==='hero'&&!atk.abs?HD.fx:{};
    if(f.execute&&!M.boss&&(m.hp-dmg)/m.max<f.execute/100){dmg=Math.max(dmg,m.hp);r.tag='Kết liễu';}
    m.hp-=dmg;m.hurt=time;m.aggro=time+8;if(atk.owner!=='bot')m.heroDmg=(m.heroDmg||0)+dmg;
    const c=center(m);if(atk.owner==='bot')floater(c.x+(Math.random()*16-8),c.y-M.h*.5,String(dmg),'#cfc7b6',11);else floater(c.x+(Math.random()*16-8),c.y-M.h*.5,(r.tag?r.tag+' ':'')+dmg,atk.el&&!r.tag?EL[atk.el].glow:r.color,atk.el&&!r.tag?16:r.size);
    burst(c.x,c.y,atk.el?EL[atk.el].color:'#f1e2b5',6);
    const kb=(atk.knock||30)*M.knock;if(kb)World.move(m,dx*kb*.25,dy*kb*.25,Math.min(M.r,16));
    if(m.type==='deer')m.flee=time+3;
    if(atk.owner==='hero'&&!atk.abs){
      if(f.lifesteal)healHero(dmg*f.lifesteal/100);
      if(f.stun&&Math.random()*100<f.stun){m.stunUntil=time+1;m.atk=null;floater(c.x,c.y-M.h*.5-18,'Choáng','#ffe69a',12);}
      if(f.burn)m.burn={dps:dmg*f.burn/100/3,until:time+3};
      if(f.venom&&!(m.burn&&m.burn.until>time+3)){m.burn={dps:dmg*f.venom/100/4,until:time+4,color:'#80e060'};floater(c.x,c.y-M.h*.5-18,'Độc','#80e060',12);} // Độc: mất máu dần 4 giây
      if(f.frost&&Math.random()*100<f.frost){m.slowUntil=time+2;m.slowK=.5;floater(c.x,c.y-M.h*.5-18,'Băng giá','#a0e0ff',12);burst(c.x,m.y-6,'#a0e0ff',10,120);}
      const B=HD.bfx||{},bossK=M.boss?.5:1;
      if(B.thunder&&Math.random()*100<B.thunder)thunder(m,dmg*(Number(CFG.loi_sat_thuong)||150)/100);
      if(B.wind&&Math.random()*100<B.wind){m.slowUntil=time+(Number(CFG.phong_ms)||3000)/1000;m.slowK=Math.max(.1,1-(Number(CFG.phong_cham)||45)/100);floater(c.x,c.y-M.h*.5-18,'Chậm',EL.wind.color,12);burst(c.x,m.y-6,EL.wind.color,10,120);}
      if(B.ice&&Math.random()*100<B.ice){m.frozenUntil=time+(Number(CFG.bang_ms)||1800)/1000*bossK;m.atk=null;m.leap=null;floater(c.x,c.y-M.h*.5-18,'Đóng băng',EL.ice.glow,13);burst(c.x,c.y,EL.ice.color,16,140);}
      if(f.cleave&&atk.skill==='normal'&&!opt.cleave)for(const o of monsters)if(o!==m&&!o.dead&&Math.hypot(o.x-m.x,o.y-m.y)<90)hitMonster(o,{abs:dmg*f.cleave/100,owner:'hero',color:'#ffc8a0'},dx,dy,{cleave:true});
    }
    if(m.hp<=0)kill(m,atk.owner);
    return dmg;
  }
  // Sách Lôi: một đạo lôi quang từ trời đánh xuống quái, nổ sau 0,15 giây
  const strikes=[];
  function thunder(m,v){const c=center(m),x0=c.x+(Math.random()-.5)*70,pts=[x0,c.y-320];for(let i=1;i<8;i++)pts.push(lerp(x0,c.x,i/8)+(Math.random()-.5)*26,c.y-320+40*i);pts.push(c.x,c.y);fx.push({kind:'sky',pts,color:EL.thunder.color,glow:EL.thunder.glow,age:0,life:.32});strikes.push({m,v,at:time+.12});}
  function updateStrikes(){for(let i=strikes.length-1;i>=0;i--){const k=strikes[i];if(time<k.at)continue;strikes.splice(i,1);if(k.m.dead)continue;const c=center(k.m);fx.push({kind:'ring',x:k.m.x,y:k.m.y,r0:6,r1:60,color:EL.thunder.glow,age:0,life:.3,lw:4});burst(c.x,c.y,EL.thunder.color,16,200);shake(3);hitMonster(k.m,{abs:k.v,owner:'thunder',color:EL.thunder.glow},0,0);}}
  function hitArc(ox,oy,ang,range,arc,atk){
    for(const m of monsters){if(m.dead)continue;const M=MON[m.type],c=center(m),dx=c.x-ox,dy=c.y-oy,d=Math.hypot(dx,dy);if(d-M.r>range)continue;
      const da=Math.abs(((Math.atan2(dy,dx)-ang)%PI2+PI2*1.5)%PI2-Math.PI);if(arc<PI2-.01&&da>arc/2&&d>M.r+12)continue;hitMonster(m,atk,dx/(d||1),dy/(d||1));}
  }
  function hitLine(ox,oy,ang,len,w,atk){

  }
  function nova(x,y,r,atk,except){fx.push({kind:'ring',x,y,r0:10,r1:r,color:atk.el?EL[atk.el].color:'#ffd9a0',age:0,life:.45,lw:5});for(const m of monsters){if(m.dead||m===except)continue;const c=center(m),d=Math.hypot(c.x-x,c.y-y);if(d<r+MON[m.type].r)hitMonster(m,{...atk,knock:60},(c.x-x)/(d||1),(c.y-y)/(d||1));}}
  function spawnProjectile(o,ang,atk,d,home,missed){
    const ox=o.x+Math.cos(ang)*26,oy=o.y-20-(o.seat||0)+Math.sin(ang)*20;
    projectiles.push({kind:d.kind,x:ox,y:oy,vx:Math.cos(ang)*d.speed,vy:Math.sin(ang)*d.speed,sp:d.speed,age:0,life:(d.range||400)/d.speed,atk:{...atk,knock:d.kind==='bolt'?50:25},el:atk.el,pierce:d.pierce||0,splash:d.splash||0,hit:new Set(),gy:20+(o.seat||0),home:home||null,missed:missed||null});

  function resolveAttack(a,idx=0){
    const d0=ATK[a.type],RM=1+(HD.tot.range||0)/100,d=RM>1?{...d0,range:d0.range*RM}:d0,sk=SK[a.skill],el=HD.books.fire?'fire':a.elem; // Tầm đánh (dòng cánh): nới tầm mọi đòn
    const atk={D:HD,mul:d.dmg*sk.mul*(a.empowered?1.6:1),el,owner:'hero',knock:d.knock,skill:a.skill};
    const ang=Math.atan2(a.aim.y,a.aim.x),ox=hero.x,oy=hero.y-18,col=el?EL[el].color:'#f4ead0';
    if(d.kind==='melee'){
      const whirl=!!sk.multi,range=d.range*(whirl?1.15:1)*(a.skill==='basic'?1.2:1);
      hitArc(ox,oy,ang,range,whirl?PI2:d.arc,{...atk,knock:d.knock*(a.type==='shield'&&a.skill!=='normal'?1.6:1)});
      fx.push(whirl?{kind:'ring',x:ox,y:oy,r0:range*.5,r1:range,color:col,age:0,life:.35,lw:6}:{kind:'arc',x:ox,y:oy,ang,r:range*.8,arc:a.type==='punch'?.8:a.type==='shield'?1.1:1.7,color:col,age:0,life:.22});

    }else if(d.kind==='thrust'){
      const n=sk.multi?3:1;for(let i=0;i<n;i++){const an=ang+(i-(n-1)/2)*.28;hitLine(ox,oy,an,d.range*(a.skill==='basic'?1.25:1),d.width,atk);fx.push({kind:'thrust',x:ox,y:oy,ang:an,len:d.range,color:col,age:0,life:.2});}
    }else{
      const n=sk.multi?3:1,o={x:hero.x,y:hero.y,seat:seatH()},tg=lockOn&&isRanged(a.type)&&hero.lockT&&!hero.lockT.dead?hero.lockT:null;
      for(let i=0;i<n;i++){if(!tg){spawnProjectile(o,ang+(i-(n-1)/2)*.16,atk,d);continue;}
        const hit=Math.random()*100<(HD.tot.aim||0);spawnProjectile(o,ang+(hit?(i-(n-1)/2)*.16:(Math.random()<.5?-1:1)*(.18+Math.random()*.2)),atk,d,hit?tg:null,hit?null:tg);}
      if(a.stance&&a.stance.dual&&a.type==='staff')spawnProjectile(o,ang+.08,{...atk,mul:atk.mul*.6},d);

    if(a.skill==='normal'&&HD.fx.wave&&++hero.waveCount%4===0){nova(hero.x,hero.y-12,150,{...atk,mul:atk.mul*HD.fx.wave/100},null);burst(hero.x,hero.y-20,'#ffb070',20,200);}
  }
  function kill(m,owner){
    const M=MON[m.type];m.dead=true;m.deadAt=time;m.respawn=time+M.respawn;m.atk=null;m.burn=null;m.leap=null;
    if(owner==='bot'&&(m.heroDmg||0)<m.max*.3){burst(m.x,m.y-M.h*.4,'#e9dcb4',12);return;}
    floater(m.x,m.y-M.h-6,'+'+M.copper+' đồng','#f3d27a',13);burst(m.x,m.y-M.h*.4,'#e9dcb4',16);
    // Phần thưởng tính ngay trên máy người chơi (cùng luật, cùng chuỗi ngẫu nhiên với máy chủ): túi rơi xuống là mở liền,
    // lệnh gom lại gửi máy chủ sau; máy chủ tính lại y hệt để lưu
    const sack={x:m.x+(Math.random()-.5)*10,y:m.y+4,born:time,boss:!!M.boss};loot.push(sack);

  /* ---------- Túi rơi đồ ---------- */
  const loot=[];
  function openSack(sack,r){
    if(!r||!r.ok){sack.gone=time;return;}
    sack.open=time;const x=sack.x,y=sack.y-30;let dy=0;
    burst(x,y+18,(r.items.length?Player.rar(r.items[0]).color:'#e9dcb4'),r.items.length?22:10,150);

    if(r.exp){floater(x,y-dy,'+'+r.exp+' kinh nghiệm','#ffe08a',12);dy+=14;}
    if(r.up)levelUp(r.up);
    if(r.pet){petSpawn[r.pet.pid]={x:sack.x,y:sack.y};const M=MON[r.pet.type];floater(x,y-dy-10,'Thu phục '+M.name+'!',EL.demon.glow,16);fx.push({kind:'ring',x:sack.x,y:sack.y,r0:8,r1:90,color:EL.demon.color,age:0,life:.7,lw:5});burst(sack.x,sack.y-20,EL.demon.color,30,200);message(svg('check')+`Thu phục ${M.name} \u{b7} đi theo bạn`);syncMerc();}

    (r.lost||[]).forEach(it=>message(svg('close')+'Túi đầy, rơi mất '+Player.nameOf(it)));
    (r.done||[]).forEach(id=>{const Q=Player.QUESTS[id];if(Q)message(svg('quest')+`${Q.name}: xong, về gặp Lý trưởng`);});

  // Lên cấp: vòng sáng, hạt vàng, đầy máu và mana

  function drawLoot(){
    for(let i=loot.length-1;i>=0;i--){
      const s=loot[i];if(s.r&&!s.open&&time>=s.openAt)openSack(s,s.r);if((s.open&&time-s.open>.5)||(s.gone&&time-s.gone>.3)||time-s.born>30){loot.splice(i,1);continue;}
      const a=s.open?1-(time-s.open)/.5:1,bob=Math.sin((time-s.born)*5)*2,x=s.x,y=s.y+bob*(s.open?0:1),k=s.boss?1.4:1;
      ctx.save();ctx.globalAlpha=Math.max(0,a);ctx.translate(x,y);ctx.scale(k,k);
      if(!s.open){ctx.globalAlpha*=.35+.25*Math.sin(time*6);ell(ctx,0,-6,16,8,s.boss?'#ffb0e0':'#ffe7a0');ctx.globalAlpha=Math.max(0,a);}
      ell(ctx,0,2,10,3,'#1d2a2266');
      const sp=LH_IMG.pic('giao_dien:tui_do_roi');if(sp)drawPic(ctx,sp,24,0);else{poly(ctx,[-8,0,8,0,6,-12,-6,-12],'#b48a52');poly(ctx,[-6,-12,6,-12,3,-16,-3,-16],'#8a6438');line(ctx,[-4,-13,4,-13],'#5a3e22',1.6);}

  /* ---------- Lưu tiến trình: chơi trên máy, chỉ gửi lên máy chủ ở các mốc ----------
     - Mọi lệnh (giết quái, mua bán, gia cường, nhiệm vụ, thuê lính, cộng điểm\u{2026}) tính ngay trên máy bằng cùng luật + cùng chuỗi ngẫu nhiên với máy chủ,
       rồi xếp hàng và ghi vào bộ nhớ trình duyệt (localStorage) cùng trạng thái nhân vật. Tắt trang giữa chừng vẫn còn, lần vào sau gửi tiếp.
     - Chỉ gửi lên máy chủ và tải lại túi đồ, tiền, nhân vật khi: về làng, qua cầu, gặp Thương nhân, bấm Lưu, ra lều. Không tự làm mới.
     - Máy chủ tính lại y hệt (theo thời điểm và cách xếp đồ lúc ra lệnh) rồi lưu; trạng thái máy chủ là chuẩn. */
  const CHUNK=500,sync={queue:[],busy:null,sig:'',lastLay:null,at:-99,keptAt:0},pending=[];let inflight=null,sent=[];
  const record=()=>({save:Player.serialize(player,hero,seen),inflight,ops:sync.queue.map(b=>b.op),t:Date.now()});
  // Ghi phần chơi xuống máy: ngay khi cần (force) hoặc theo nhịp ~1,5 giây (không ghi mỗi đòn đánh để máy yếu không khựng)
  let localDirty=false;
  function keepLocal(force){if(!force&&time-sync.keptAt<1.5){localDirty=true;return;}localDirty=false;sync.keptAt=time;try{LH_Local.set(session.charId,record());}catch(e){LH_DIAG.error(e,'lưu máy');}}
  const unsaved=()=>!!(sync.queue.length||inflight);
  function queueOp(o,L=Player.layout(player)){
    const sig=JSON.stringify(L);o.at=Date.now();
    if(!sync.queue.length||sig!==sync.sig){o.lay=L;sync.sig=sig;}
    const b={op:o,ent:null};sync.queue.push(b);keepLocal();return b;
  }
  function adopt(S){
    const before=JSON.parse(JSON.stringify(player));
    let R=Player.merge(S,before);
    if(pending.length){for(const p of pending){try{Player.applyOp(R,p.op,{},Date.now());}catch(e){}}R=Player.merge(R,before);}
    for(const k of Object.keys(player))if(!(k in R))delete player[k];
    Object.assign(player,R);refreshHD();syncMerc();window.GameUI?.refresh();
  }
  // Gửi hết hàng chờ (mỗi gói tối đa 500 lệnh), nhận lại trạng thái chuẩn
  function flush(){
    if(window.LH_KICKED)return Promise.resolve(false);
    if(sync.busy)return sync.busy.then(()=>flush());
    sync.busy=(async()=>{
      try{
        do{
          if(!inflight){
            sent=sync.queue.splice(0,CHUNK);const ops=sent.map(b=>b.op);
            if(ops.length&&!ops[0].lay&&sync.lastLay)ops[0]={...ops[0],lay:sync.lastLay};
            for(const o of ops)if(o.lay)sync.lastLay=o.lay;
            inflight={bid:Date.now().toString(36)+Math.random().toString(36).slice(2,8),ops};
          }
          keepLocal(true);
          const sentSig=JSON.stringify(Player.layout(player));
          const r=await Net.call('play',{charId:session.charId,bid:inflight.bid,sentAt:Date.now(),save:Player.serialize(player,hero,seen),ops:inflight.ops});
          sync.flushedSig=sentSig;
          inflight=null;
          for(const b of sent)if(b.ent){const i=pending.indexOf(b.ent);if(i>=0)pending.splice(i,1);}
          adopt(r.state);
          const bad=(r.results||[]).filter(x=>!x.ok).length;if(bad)message(svg('close')+'Máy chủ không nhận '+bad+' lệnh, đã đồng bộ lại');
          sent=[];
        }while(sync.queue.length>=CHUNK);
        sync.at=time;if(!unsaved())LH_Local.clear(session.charId);else keepLocal(true);return true;
      }catch(e){keepLocal(true);message(svg('close')+netMsg(e)+(e.message==='CHAP_CHON'?'':' \u{b7} tiến trình vẫn giữ trên máy'));
        // rớt mạng: tự gửi lại một lần sau 10 giây (không cần chờ tới mốc lưu sau)
        if(['Failed to fetch','CHAP_CHON','KHONG_TRUY_CAP'].includes(e.message)&&!sync.retry){sync.retry=setTimeout(()=>{sync.retry=null;if(unsaved())flush();},10000);}
        return false;}
      finally{sync.busy=null;window.GameUI?.refresh();}
    })();
    return sync.busy;
  }
  // Lệnh giao dịch với người chơi (qua Thương nhân): lưu hết phần chơi trên máy trước, rồi mới gọi máy chủ và nhận trạng thái chuẩn
  async function server(action,payload){
    // chưa có gì mới kể từ lần lưu trước (cả cách xếp đồ) thì khỏi lưu lại
    if((unsaved()||JSON.stringify(Player.layout(player))!==sync.flushedSig)&&!(await flush()))throw Error('CHUA_LUU');
    const r=await Net.call(action,{charId:session.charId,...payload});
    if(r.state&&(!r.charId||r.charId===session.charId))adopt(r.state);
    sync.at=time;LH_Local.clear(session.charId);if(unsaved())keepLocal();
    return r;
  }
  // Mốc lưu tự động (về làng, qua cầu, gặp Thương nhân): vừa lưu xong mà chưa chơi gì thêm thì bỏ qua
  function checkpoint(){if(!unsaved()&&time-sync.at<20)return;flush().then(ok=>{if(ok)message(svg('save')+'Đã lưu');});}
  const op=(o)=>{
    if(Player.PREDICT.has(o.t)){
      const L=Player.layout(player);let r;try{r=Player.applyOp(player,o,{},Date.now());}catch(e){return Promise.reject(e);}
      const b=queueOp(o,L);
      b.ent={op:o};pending.push(b.ent);refreshHD();syncMerc();window.GameUI?.refresh();
      return Promise.resolve({ok:true,...r});
    }
    queueOp(o);return flush().then(()=>({ok:true}));
  };
  function moveVector(){const x=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)+joystick.x,y=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0)+joystick.y;return {x,y,len:Math.hypot(x,y)};}
  function toggleLock(){lockOn=!lockOn;hero.lockT=null;try{localStorage.setItem('lh-lock',lockOn?'1':'0');}catch(e){}message(svg('aim')+(lockOn?'Khóa mục tiêu: bật':'Khóa mục tiêu: tắt'));window.GameUI?.refresh();}
  /* ---------- Khóa mục tiêu (cung, nỏ): bật nút thì mỗi phát bắn tự tìm quái đã chọn / gần nhất; trúng theo tỉ lệ chính xác của vũ khí ---------- */
  let lockOn=(()=>{try{return localStorage.getItem('lh-lock')==='1';}catch(e){return false;}})();
  const isRanged=t=>t==='bow'||t==='crossbow';
  function lockTarget(range){
    const ok=m=>m&&!m.dead&&Math.hypot(m.x-hero.x,m.y-hero.y)<range+220;
    if(ok(hero.lockT))return hero.lockT;
    let best=null,bd=range+60;for(const m of monsters){if(m.dead)continue;const dd=Math.hypot(m.x-hero.x,m.y-hero.y);if(dd<bd){bd=dd;best=m;}}
    return hero.lockT=best;
  }
  function chooseAim(st,d){
    const mv=moveVector();
    if(lockOn&&isRanged(st.type)){const m=lockTarget(d.range||500);if(m){const c=center(m),dx=c.x-hero.x,dy=c.y-(hero.y-20),l=Math.hypot(dx,dy)||1;return {x:dx/l,y:dy/l};}}
    if(mouseAim&&time-mouseAim.t<3){const dx=mouseAim.x-hero.x,dy=mouseAim.y-(hero.y-20),l=Math.hypot(dx,dy)||1;return {x:dx/l,y:dy/l};}
    if(st.type==='crossbow'){if(mv.len>.1)return {x:mv.x/mv.len,y:mv.y/mv.len};return {...hero.aim};}
    let best=null,bd=(d.range||80)+40;
    for(const m of monsters){if(m.dead)continue;const dd=Math.hypot(m.x-hero.x,m.y-hero.y);if(dd<bd){bd=dd;best=m;}}
    if(best){const c=center(best),dx=c.x-hero.x,dy=c.y-(hero.y-20),l=Math.hypot(dx,dy)||1;return {x:dx/l,y:dy/l};}
    if(mv.len>.1)return {x:mv.x/mv.len,y:mv.y/mv.len};
    return {...hero.aim};
  }
  const SKILL_NAMES={basic:'Combo',intermediate:'Diện rộng',advanced:'Liên hoàn'};
  const atkFactor=()=>(1+(HD.tot.atkSpd+(time<hero.hasteUntil?HD.fx.haste||0:0))/100)*(dbfOn('slow')?.6:1);
  function cast(id,quiet){
    if(busy()||hero.dead)return false;
    if(frozen()){if(!quiet)message(svg('ice')+'Đang bị '+(dbfOn('freeze')?'đóng băng':'choáng'));return false;}
    if(safe&&id!=='normal'){if(!quiet)message(svg('shield')+'Vùng an toàn: không dùng kỹ năng');return false;}
    if(id==='mount'&&!player.equipment.mount)return false;
    if(hero.mountAct&&time<hero.mountAct.start+hero.mountAct.dur)return false;
    if(id!=='mount'&&hero.attack&&time<hero.attack.start+hero.attack.dur*(hero.attack.cycles>1?.97:.82))return false;
    const r=Player.cast(player,id,Date.now(),HD);
    if(!r.ok){if(r.error==='MANA'&&(!quiet||time-manaWarnAt>4)){manaWarnAt=time;message(svg('orb')+'Hết mana'+(HD.tot.mpReg?'':' \u{b7} cần Sách Thủy hoặc đồ hồi mana'));}return false;}
    const st=r.stance,aim=chooseAim(st,ATK[st.type]);
    hero.aim=aim;if(Math.abs(aim.x)>.12)hero.facing=aim.x<0?-1:1;
    if(id==='mount'){
      const md=Player.info(player.equipment.mount),big=md.beast==='elephant';
      hero.mountAct={type:md.beast,start:time,dur:big?.9:.7,hit:big?.55:.45,done:false,aim:{...aim}};
      floater(hero.x,hero.y-80-seatH(),Player.BEASTS[md.beast].skill,'#ffe0a0',13);window.GameUI?.refresh();return true;
    }

  function pickTarget(m){

  // Đi tới đích; vướng bụi cây, nhà, nước thì tìm đường vòng theo lưới ô thay vì đẩy mãi vào vật cản

  // Chạy trốn: chọn hướng thoáng gần với hướng ngược kẻ đuổi nhất (không lao đầu vào bụi cây, bờ nước)

  const KEYMAP={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',ArrowUp:'arrowup',ArrowDown:'arrowdown',ArrowLeft:'arrowleft',ArrowRight:'arrowright',KeyE:'e',KeyB:'b',Escape:'escape',Space:' ',Digit1:'1',Digit2:'2',Digit3:'3',Digit4:'4',Numpad1:'1',Numpad2:'2',Numpad3:'3',Numpad4:'4'};

  function showQuestBoard(){
